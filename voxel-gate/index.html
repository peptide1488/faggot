<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Voxel Gate Testbed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a22; }
  #stage { position: fixed; inset: 0; }
  #gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 46vw; max-height: 90vh;
    overflow: auto; background: rgba(10,10,16,0.82); color: #cfd4e0; padding: 8px 10px;
    font: 12px/1.45 Consolas, monospace; border-radius: 6px; white-space: pre-wrap;
  }
  #hud .pass { color: #7dd87d; } #hud .fail { color: #ff7d7d; } #hud .info { color: #8fb8ff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
</div>
<div id="hud">booting…</div>
<script type="module" src="harness.js"></script>
</body>
</html>
