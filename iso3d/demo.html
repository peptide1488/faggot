<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iso3D Engine</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  
  <div id="ui" style="position:absolute; top:10px; left:10px; color:#fff; font-family:sans-serif; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; pointer-events:auto;">
    <button id="btnRotate" style="cursor:pointer; padding:6px 12px; font-size:14px;">Rotate 90°</button>
    <div id="camInfo" style="margin-top:8px; font-size:13px;">Rot: 0° | Zoom: 1.0x</div>
    <div id="turnInfo" style="margin-top:8px; font-size:13px; color:#ffcc00;"></div>
    <div id="actionMenu" style="margin-top:8px; display:none;">
      <button id="btnMove" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px;">Move</button>
      <button id="btnAttack" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px;">Attack</button>
      <button id="btnWait" style="cursor:pointer; padding:6px 12px; font-size:14px;">Wait</button>
    </div>
    <div style="font-size:11px; margin-top:6px; color:#aaa;">Scroll to zoom • Drag to pan</div>
    <div id="versionInfo" style="position:absolute; top:10px; right:10px; color:#666; font-size:12px;"></div>
  </div>

  <script type="module">
    (async () => {
      // Dynamically load gl-matrix library
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.3/gl-matrix-min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      
      const APP_VERSION = '1.0';
      
      // Load modules in correct order to avoid gl-matrix issues
      const { init, setMap, rotate, setZoom, setPan, getCamState, setTokens, pickTile, selectTile } = await import("./renderer3d.js?v=" + Date.now());
      const { computeMoveRange } = await import("./movement.js?v=" + Date.now());
      const { TurnManager, computeTurnOrder } = await import("./turnOrder.js?v=" + Date.now());
      
      // Add debug logging to see if the module loaded correctly
      console.log('Module loaded successfully');
      
      // Set version info after APP_VERSION is defined
      document.getElementById('versionInfo').textContent = 'v' + APP_VERSION;
      const canvas = document.getElementById('glCanvas');
      init(canvas);

      // UI Elements
      const btnRotate = document.getElementById('btnRotate');
      const camInfo = document.getElementById('camInfo');
      
      function updateUI() {
        const s = getCamState();
        camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x`;
      }

      btnRotate.addEventListener('click', () => {
        rotate(1);
        updateUI();
      });

      // Scroll to zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        setZoom(getCamState().zoom + delta);
        updateUI();
      }, { passive: false });

      // Click-drag to pan
      let isDragging = false;
      let lastX, lastY;
      
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        
        // Adjust pan speed based on zoom level for consistent feel
        const s = getCamState();
        const scale = 0.025 * (1 / s.zoom); 
        
        setPan(s.panX + dx * scale, s.panY - dy * scale);
        lastX = e.clientX;
        lastY = e.clientY;
        updateUI();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      // Click to pick tile
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const picked = pickTile(e.clientX - rect.left, e.clientY - rect.top);
        if (picked) {
          selectTile(picked.col, picked.row);
          const s = getCamState();
          camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Picked: (${picked.col}, ${picked.row})`;
        }
      });

      // Initial UI state
      updateUI();

      // Generate a sample 10x10 map with random heights (0-4)
      const cols = 10, rows = 10;
      const heights = new Array(cols * rows).fill(0);
      for(let y=0; y<rows; y++) {
        for(let x=0; x<cols; x++) {
          heights[y*cols+x] = Math.floor(Math.random() * 5);
        }
      }
      
      // Optional: custom palette mapping terrain-type int -> [r,g,b]
      const palette = {
        0: [0.35, 0.55, 0.25], // grass
        1: [0.60, 0.45, 0.20], // dirt
        2: [0.70, 0.70, 0.70]  // stone
      };

      console.log('Setting map with dimensions:', cols, 'x', rows);
      setMap(cols, rows, heights, palette);

      // Place example tokens on the map
      const tokens = [
        { x: 2, z: 3, color: [1.0, 0.2, 0.2], label: 'Red' },
        { x: 5, z: 6, color: [0.2, 0.8, 0.2], label: 'Green' },
        { x: 8, z: 1, color: [0.3, 0.4, 1.0], label: 'Blue' }
      ];
      console.log('Setting tokens:', tokens);
      setTokens(tokens);
      
      // Track the currently selected unit
      let selectedUnit = null;
      let reachableTiles = new Set();
      let turnManager = null;
      
      // Initialize turn manager
      const units = tokens.map(token => ({
        id: token.label,
        x: token.x,
        z: token.z,
        alive: true,
        speed: 10, // Default speed
        moveRange: 3, // Default movement range
        jumpHeight: 1, // Default jump height
        hp: 20, // Default HP
        maxHp: 20,
        job: 'Warrior' // Default job
      }));
      
      turnManager = new TurnManager(units);
      
      // Function to update turn info display
      function updateTurnInfo() {
        const currentUnit = turnManager.currentUnit();
        if (currentUnit) {
          document.getElementById('turnInfo').textContent = 
            `Turn: ${currentUnit.label} (${currentUnit.job}) - HP: ${currentUnit.hp}/${currentUnit.maxHp}`;
          document.getElementById('actionMenu').style.display = 'block';
        } else {
          document.getElementById('turnInfo').textContent = '';
          document.getElementById('actionMenu').style.display = 'none';
        }
      }
      
      // Function to highlight reachable tiles
      function highlightReachableTiles(unit, allUnits, mapCols, mapRows, mapHeights) {
        reachableTiles = computeMoveRange(unit, allUnits, mapCols, mapRows, mapHeights);
        
        // Convert set of tiles to token format for display
        const reachableTokens = Array.from(reachableTiles).map(tile => ({
          x: tile.col,
          z: tile.row,
          color: [0.2, 0.8, 0.2], // Green color for reachable tiles
          label: ''
        }));
        
        setTokens([...tokens, ...reachableTokens]);
      }
      
      // Function to move a unit to a new position
      function moveUnit(unit, newX, newY) {
        // Check if the target tile is in reachable tiles
        const isReachable = Array.from(reachableTiles).some(tile => 
          tile.col === newX && tile.row === newY
        );
        
        if (isReachable) {
          unit.x = newX;
          unit.z = newY;
          
          // Update tokens to show new position
          setTokens(tokens);
          
          // Clear reachable tiles highlight
          reachableTiles.clear();
          setTokens(tokens);
          
          // Reset selection
          selectedUnit = null;
          
          // End turn after moving
          endTurn();
        }
      }
      
      // Function to end the current unit's turn
      function endTurn() {
        const nextUnit = turnManager.nextTurn();
        updateTurnInfo();
        
        // Clear any reachable tiles highlight
        if (reachableTiles.size > 0) {
          reachableTiles.clear();
          setTokens(tokens);
        }
      }
      
      // Function to handle attack action
      function handleAttack() {
        // In a real implementation, this would target an enemy unit
        console.log('Attack action selected');
        // For now, just end the turn
        endTurn();
      }
      
      // Click to select a unit or move it
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const picked = pickTile(e.clientX - rect.left, e.clientY - rect.top);
        
        if (picked) {
          // Check if clicked on a unit
          const clickedUnit = tokens.find(token => 
            token.x === picked.col && token.z === picked.row
          );
          
          if (clickedUnit && clickedUnit.label) {
            // Select the unit
            selectedUnit = clickedUnit;
            highlightReachableTiles(clickedUnit, tokens, cols, rows, heights);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Selected: ${clickedUnit.label}`;
          } else if (selectedUnit) {
            // Try to move the selected unit
            moveUnit(selectedUnit, picked.col, picked.row);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Moved ${selectedUnit.label} to (${picked.col}, ${picked.row})`;
          } else {
            // Just pick a tile
            selectTile(picked.col, picked.row);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Picked: (${picked.col}, ${picked.row})`;
          }
        }
      });
      
      // Action buttons
      document.getElementById('btnMove').addEventListener('click', () => {
        const currentUnit = turnManager.currentUnit();
        if (currentUnit) {
          highlightReachableTiles(currentUnit, tokens, cols, rows, heights);
          document.getElementById('camInfo').textContent = 
            `Rot: ${getCamState().rot}° | Zoom: ${getCamState().zoom.toFixed(2)}x | Moving ${currentUnit.label}`;
        }
      });
      
      document.getElementById('btnAttack').addEventListener('click', () => {
        handleAttack();
      });
      
      document.getElementById('btnWait').addEventListener('click', () => {
        endTurn();
      });
      
      // Initialize turn info
      updateTurnInfo();
    })();
  </script>
</body>
</html>
