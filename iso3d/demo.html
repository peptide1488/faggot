<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iso3D Engine</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #toolTip {
      position: absolute;
      color: white;
      font-family: sans-serif;
      font-size: 12px;
      pointer-events: none;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  
  <div id="ui" style="position:absolute; top:10px; left:10px; color:#fff; font-family:sans-serif; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; pointer-events:auto;">
    <button id="btnRotate" style="cursor:pointer; padding:6px 12px; font-size:14px;">Rotate 90°</button>
    <div id="camInfo" style="margin-top:8px; font-size:13px;">Rot: 0° | Zoom: 1.0x</div>
    <div id="turnInfo" style="margin-top:8px; font-size:13px; color:#ffcc00;"></div>
    <div id="actionMenu" style="margin-top:8px; display:none;">
      <button id="btnMove" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px;">Move</button>
      <button id="btnAttack" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px;">Attack</button>
      <button id="btnWait" style="cursor:pointer; padding:6px 12px; font-size:14px;">Wait</button>
    </div>
    <div style="font-size:11px; margin-top:6px; color:#aaa;">Scroll to zoom • Drag to pan</div>
    <div id="versionInfo" style="position:absolute; top:10px; right:10px; color:#666; font-size:12px;"></div>
  </div>

  <div id="editorPanel" style="position:absolute; top:10px; right:10px; color:#fff; font-family:sans-serif; background:rgba(0,0,0,0.6); padding:12px; border-radius:8px; pointer-events:auto;">
    <h3>Map Editor</h3>
    <div style="margin-bottom:10px;">
      <button id="toolRaise" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px; background:#4CAF50;">Raise Terrain</button>
      <button id="toolLower" style="cursor:pointer; padding:6px 12px; font-size:14px; margin-right:6px; background:#f44336;">Lower Terrain</button>
      <button id="toolPaint" style="cursor:pointer; padding:6px 12px; font-size:14px; background:#2196F3;">Paint Terrain</button>
    </div>
    <div style="margin-bottom:10px;">
      <label for="terrainType">Terrain Type:</label>
      <select id="terrainType" style="padding:6px; font-size:14px; background:#333; color:#fff; border:none; border-radius:4px;">
        <option value="0">Grass</option>
        <option value="1">Sand</option>
        <option value="2">Water</option>
        <option value="3">Brick</option>
        <option value="4">Building</option>
      </select>
    </div>
    <div style="font-size:11px; color:#aaa;">Click on tiles to edit</div>
  </div>

  <div id="toolTip"></div>

  <script type="module">
    (async () => {
      // Dynamically load gl-matrix library
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      
      const APP_VERSION = '1.1';
      
      // Load modules in correct order to avoid gl-matrix issues
      const { init, setMap, rotate, setZoom, setPan, getCamState, setTokens, pickTile, selectTile, updateTile, setCurrentTool, setCurrentTerrainType } = await import("./renderer3d.js?v=" + Date.now());
      const { computeMoveRange } = await import("./movement.js?v=" + Date.now());
      const { TurnManager, computeTurnOrder } = await import("./turnOrder.js?v=" + Date.now());
      
      // Add debug logging to see if the module loaded correctly
      console.log('Module loaded successfully');
      
      // Set version info after APP_VERSION is defined
      document.getElementById('versionInfo').textContent = 'v' + APP_VERSION;
      const canvas = document.getElementById('glCanvas');
      init(canvas);

      // UI Elements
      const btnRotate = document.getElementById('btnRotate');
      const camInfo = document.getElementById('camInfo');
      
      function updateUI() {
        const s = getCamState();
        camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x`;
      }

      btnRotate.addEventListener('click', () => {
        rotate(1);
        updateUI();
      });

      // Scroll to zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        setZoom(getCamState().zoom + delta);
        updateUI();
      }, { passive: false });

      // Click-drag to pan
      let isDragging = false;
      let lastX, lastY;
      
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) {
          // Update tool tip position
          const toolTip = document.getElementById('toolTip');
          toolTip.style.left = (e.clientX + 10) + 'px';
          toolTip.style.top = (e.clientY + 10) + 'px';
          
          // Handle hover detection for brush highlighting
          const rect = canvas.getBoundingClientRect();
          const hovered = pickTile(e.clientX - rect.left, e.clientY - rect.top);
          
          if (hovered) {
            selectTile(hovered.col, hovered.row);
            
            // Update tool tip text
            let toolTipText = '';
            switch(window.currentTool) {
              case 'raise':
                toolTipText = ' Raise';
                break;
              case 'lower':
                toolTipText = ' Lower';
                break;
              case 'paint':
                const terrainType = parseInt(document.getElementById('terrainType').value);
                switch(terrainType) {
                  case 0: toolTipText = ' Grass'; break;
                  case 1: toolTipText = ' Sand'; break;
                  case 2: toolTipText = ' Water'; break;
                  case 3: toolTipText = ' Brick'; break;
                  case 4: toolTipText = ' Building'; break;
                }
                break;
            }
            
            if (toolTipText) {
              toolTip.textContent = toolTipText;
              toolTip.style.display = 'block';
            } else {
              toolTip.style.display = 'none';
            }
          } else {
            selectTile(null, null); // Clear selection
            toolTip.style.display = 'none';
          }
        }
        
        if (!isDragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        
        // Adjust pan speed based on zoom level for consistent feel
        const s = getCamState();
        const scale = 0.025 * (1 / s.zoom); 
        
        // s.rot is already in radians!
        const rad = s.rot;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        // Map the screen delta mouse movements to the current camera view orientation
        // Grab-and-drag behavior: moving mouse right pulls map right
        const worldDX = (-dx * cos - dy * sin) * scale;
        const worldDY = (dx * sin - dy * cos) * scale;

        setPan(s.panX + worldDX, s.panY + worldDY);
        lastX = e.clientX;
        lastY = e.clientY;
        updateUI();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      // Track the currently selected tool
      let currentTool = 'raise';
      let currentType = 0;
      
      // Editor tool selection
      document.getElementById('toolRaise').addEventListener('click', () => {
        currentTool = 'raise';
        window.currentTool = currentTool;
        setCurrentTool(currentTool);
        document.querySelectorAll('#editorPanel button').forEach(btn => btn.style.background = '');
        document.getElementById('toolRaise').style.background = '#4CAF50';
        updateUI();
      });
      
      document.getElementById('toolLower').addEventListener('click', () => {
        currentTool = 'lower';
        window.currentTool = currentTool;
        setCurrentTool(currentTool);
        document.querySelectorAll('#editorPanel button').forEach(btn => btn.style.background = '');
        document.getElementById('toolLower').style.background = '#f44336';
        updateUI();
      });
      
      document.getElementById('toolPaint').addEventListener('click', () => {
        currentTool = 'paint';
        window.currentTool = currentTool;
        setCurrentTool(currentTool);
        document.querySelectorAll('#editorPanel button').forEach(btn => btn.style.background = '');
        document.getElementById('toolPaint').style.background = '#2196F3';
        updateUI();
      });
      
      // Initialize tool selection
      document.getElementById('toolRaise').style.background = '#4CAF50';
      window.currentTool = currentTool;

      // Click to pick tile
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const picked = pickTile(e.clientX - rect.left, e.clientY - rect.top);
        if (picked) {
          selectTile(picked.col, picked.row);
          const s = getCamState();
          camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Picked: (${picked.col}, ${picked.row})`;
          
          // If in editor mode, update the tile
          const terrainType = parseInt(document.getElementById('terrainType').value);
          setCurrentTerrainType(terrainType);
          updateTile(picked.col, picked.row, currentTool, terrainType);
        }
      });

      // Continuous hover detection for brush highlighting
      let hoverTimeout;
      canvas.addEventListener('mousemove', (e) => {
        if (isDragging) return;
        
        const rect = canvas.getBoundingClientRect();
        const hovered = pickTile(e.clientX - rect.left, e.clientY - rect.top);
        
        // Clear previous timeout
        clearTimeout(hoverTimeout);
        
        // Set new hover timeout to prevent excessive updates
        hoverTimeout = setTimeout(() => {
          if (hovered) {
            selectTile(hovered.col, hovered.row);
          } else {
            selectTile(null, null); // Clear selection
          }
        }, 50);
      });

      // Initial UI state
      updateUI();

      // Generate a sample 20x20 map with random heights (0-4)
      const cols = 20, rows = 20;
      const heights = new Array(cols * rows).fill(0);
      for(let y=0; y<rows; y++) {
        for(let x=0; x<cols; x++) {
          heights[y*cols+x] = Math.floor(Math.random() * 5);
        }
      }
      
      // Optional: custom palette mapping terrain-type int -> [r,g,b]
      const palette = {
        0: [0.35, 0.55, 0.25], // grass
        1: [0.60, 0.45, 0.20], // dirt
        2: [0.70, 0.70, 0.70]  // stone
      };

      console.log('Setting map with dimensions:', cols, 'x', rows);
      setMap(cols, rows, heights, palette);

      // Place example tokens on the map
      const tokens = [
        { x: 2, z: 3, color: [1.0, 0.2, 0.2], label: 'Red' },
        { x: 5, z: 6, color: [0.2, 0.8, 0.2], label: 'Green' },
        { x: 8, z: 1, color: [0.3, 0.4, 1.0], label: 'Blue' }
      ];
      console.log('Setting tokens:', tokens);
      setTokens(tokens);
      
      // Track the currently selected unit
      let selectedUnit = null;
      let reachableTiles = new Set();
      let turnManager = null;
      
      // Initialize turn manager
      const units = tokens.map(token => ({
        id: token.label,
        x: token.x,
        z: token.z,
        alive: true,
        speed: 10, // Default speed
        moveRange: 3, // Default movement range
        jumpHeight: 1, // Default jump height
        hp: 20, // Default HP
        maxHp: 20,
        job: 'Warrior' // Default job
      }));
      
      turnManager = new TurnManager(units);
      
      // Function to update turn info display
      function updateTurnInfo() {
        const currentUnit = turnManager.currentUnit();
        if (currentUnit) {
          document.getElementById('turnInfo').textContent = 
            `Turn: ${currentUnit.label} (${currentUnit.job}) - HP: ${currentUnit.hp}/${currentUnit.maxHp}`;
          document.getElementById('actionMenu').style.display = 'block';
        } else {
          document.getElementById('turnInfo').textContent = '';
          document.getElementById('actionMenu').style.display = 'none';
        }
      }
      
      // Function to highlight reachable tiles
      function highlightReachableTiles(unit, allUnits, mapCols, mapRows, mapHeights) {
        reachableTiles = computeMoveRange(unit, allUnits, mapCols, mapRows, mapHeights);
        
        // Convert set of tiles to token format for display
        const reachableTokens = Array.from(reachableTiles).map(tile => ({
          x: tile.col,
          z: tile.row,
          color: [0.2, 0.8, 0.2], // Green color for reachable tiles
          label: ''
        }));
        
        setTokens([...tokens, ...reachableTokens]);
      }
      
      // Function to move a unit to a new position
      function moveUnit(unit, newX, newY) {
        // Check if the target tile is in reachable tiles
        const isReachable = Array.from(reachableTiles).some(tile => 
          tile.col === newX && tile.row === newY
        );
        
        if (isReachable) {
          unit.x = newX;
          unit.z = newY;
          
          // Update tokens to show new position
          setTokens(tokens);
          
          // Clear reachable tiles highlight
          reachableTiles.clear();
          setTokens(tokens);
          
          // Reset selection
          selectedUnit = null;
          
          // End turn after moving
          endTurn();
        }
      }
      
      // Function to end the current unit's turn
      function endTurn() {
        const nextUnit = turnManager.nextTurn();
        updateTurnInfo();
        
        // Clear any reachable tiles highlight
        if (reachableTiles.size > 0) {
          reachableTiles.clear();
          setTokens(tokens);
        }
      }
      
      // Function to handle attack action
      function handleAttack() {
        // In a real implementation, this would target an enemy unit
        console.log('Attack action selected');
        // For now, just end the turn
        endTurn();
      }
      
      // Click to select a unit or move it
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const picked = pickTile(e.clientX - rect.left, e.clientY - rect.top);
        
        if (picked) {
          // Check if clicked on a unit
          const clickedUnit = tokens.find(token => 
            token.x === picked.col && token.z === picked.row
          );
          
          if (clickedUnit && clickedUnit.label) {
            // Select the unit
            selectedUnit = clickedUnit;
            highlightReachableTiles(clickedUnit, tokens, cols, rows, heights);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Selected: ${clickedUnit.label}`;
          } else if (selectedUnit) {
            // Try to move the selected unit
            moveUnit(selectedUnit, picked.col, picked.row);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Moved ${selectedUnit.label} to (${picked.col}, ${picked.row})`;
          } else {
            // Just pick a tile
            selectTile(picked.col, picked.row);
            const s = getCamState();
            camInfo.textContent = `Rot: ${s.rot}° | Zoom: ${s.zoom.toFixed(2)}x | Picked: (${picked.col}, ${picked.row})`;
          }
        }
      });
      
      // Action buttons
      document.getElementById('btnMove').addEventListener('click', () => {
        const currentUnit = turnManager.currentUnit();
        if (currentUnit) {
          highlightReachableTiles(currentUnit, tokens, cols, rows, heights);
          document.getElementById('camInfo').textContent = 
            `Rot: ${getCamState().rot}° | Zoom: ${getCamState().zoom.toFixed(2)}x | Moving ${currentUnit.label}`;
        }
      });
      
      document.getElementById('btnAttack').addEventListener('click', () => {
        handleAttack();
      });
      
      document.getElementById('btnWait').addEventListener('click', () => {
        endTurn();
      });
      
      // Initialize turn info
      updateTurnInfo();
    })();
  </script>
</body>
</html>
