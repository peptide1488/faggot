<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<meta name="robots" content="noindex, nofollow">
<title>Pepti Mart · Tag Generator</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#141a26; --panel2:#1b2333; --line:#26314a;
    --txt:#e8edf6; --muted:#8a97b0; --accent:#4f8cff; --accent2:#27d3a2;
    --warn:#ffb454; --danger:#ff5d6c; --good:#27d3a2; --r:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{background:var(--bg); color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    max-width:560px; margin:0 auto; padding:0 0 40px}
  h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
  header{position:sticky; top:0; z-index:10; backdrop-filter:blur(12px);
    background:rgba(11,15,23,.82); border-bottom:1px solid var(--line);
    padding:14px 18px; display:flex; align-items:center; gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;font-size:11px;color:#06121f}
  .wrap{padding:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:14px}
  label{display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px 2px}
  input,select{width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); border-radius:11px; padding:12px 13px; font-size:15px; outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .field{margin-bottom:13px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--accent); color:#06121f; font-weight:700; border:none;
    border-radius:12px; padding:14px; font-size:15px; cursor:pointer; transition:.15s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.sec{background:var(--panel2); color:var(--txt)}
  .btn.ghost{background:transparent; color:var(--txt); border:1px solid var(--line)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .serialrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel2)}
  .serialrow.done{border-color:rgba(39,211,162,.5);background:rgba(39,211,162,.08)}
  .serialrow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .serialrow .s{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;letter-spacing:.5px}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:700}
  .tag.idx{background:var(--panel);color:var(--muted)}
  .tag.ok{background:rgba(39,211,162,.16);color:var(--good)}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:11px 16px;
    border-radius:12px; font-size:13.5px; opacity:0; pointer-events:none; transition:.3s; z-index:50; box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .warnbar{background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.35);color:var(--warn);
    border-radius:11px;padding:10px 12px;font-size:12px;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="logo">PM</div>
  <div style="flex:1">
    <h1 style="font-size:16px">Tag Generator</h1>
    <div class="small muted">Mint &amp; write vial serials — internal tool</div>
  </div>
</header>

<div class="wrap">
  <div class="warnbar">Keep this page private. Anyone who can open it can mint valid serials.</div>

  <div class="card">
    <h2 style="font-size:16px;margin-bottom:12px">Batch details</h2>
    <div class="field">
      <label>Compound</label>
      <select id="g_comp" onchange="applyProductDefaults();updatePreview()"></select>
    </div>
    <div class="grid2">
      <div class="field"><label>Strength</label><input id="g_strength" type="number" inputmode="decimal" value="10"></div>
      <div class="field"><label>Unit</label>
        <select id="g_unit">
          <option>MG</option><option>MCG</option><option>IU</option><option>ML</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Start vial #</label><input id="g_start" type="number" inputmode="numeric" value="1"></div>
      <div class="field"><label>Quantity</label><input id="g_qty" type="number" inputmode="numeric" value="1"></div>
    </div>
    <div class="field">
      <label>Order number</label>
      <input id="g_order" autocomplete="off" placeholder="e.g. 7F3A or 10482">
    </div>
    <button class="btn" onclick="generate()">Generate serials</button>
    <div class="hint" id="g_preview">Serial preview appears here.</div>
  </div>

  <div class="card" id="g_outcard" style="display:none">
    <div class="row between" style="margin-bottom:12px">
      <h2 style="font-size:16px">Serials · <span id="g_count">0</span></h2>
      <div class="row" style="gap:8px">
        <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:12.5px" onclick="copyAll()">Copy</button>
        <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:12.5px" onclick="downloadCSV()">CSV</button>
      </div>
    </div>

    <button class="btn" id="g_writeBtn" style="margin-bottom:14px" onclick="writeNext()">📡 Write next tag</button>
    <div class="hint" id="g_nfcHint" style="margin:-6px 0 12px">Checking NFC…</div>

    <div id="g_list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="serial.js"></script>
<script>
const NFC_SUPPORTED = ('NDEFReader' in window);
let serials = [];     // [{serial, vial, written}]
let cursor = 0;       // index of next tag to write

// populate compound dropdown from the shared product table
(function initCompounds(){
  const sel=document.getElementById('g_comp');
  PMSerial.PRODUCTS.forEach(p=>{
    const o=document.createElement('option');
    o.value=p.code; o.textContent=p.name+'  ('+p.code+')';
    sel.appendChild(o);
  });
  applyProductDefaults();
})();
function applyProductDefaults(){
  const code=document.getElementById('g_comp').value;
  const p=PMSerial.PRODUCTS.find(x=>x.code===code); if(!p) return;
  document.getElementById('g_strength').value=p.doses[0];
  document.getElementById('g_unit').value=p.unit.toUpperCase();
}

let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

function initNFC(){
  const hint=document.getElementById('g_nfcHint');
  const btn=document.getElementById('g_writeBtn');
  if(NFC_SUPPORTED){ hint.innerHTML='Tap <b>Write next tag</b>, then hold a blank tag to the phone.'; }
  else { btn.disabled=true; btn.textContent='NFC not available here';
    hint.innerHTML='Open in <b>Chrome on Android</b> to write tags. You can still copy/CSV the serials.'; }
}

function readForm(){
  const code=document.getElementById('g_comp').value;
  const product=PMSerial.PRODUCTS.find(x=>x.code===code);
  const strength=+document.getElementById('g_strength').value||0;
  const unit=document.getElementById('g_unit').value;
  const start=Math.max(1, Math.floor(+document.getElementById('g_start').value||1));
  const qty=Math.max(1, Math.floor(+document.getElementById('g_qty').value||1));
  const order=document.getElementById('g_order').value.trim();
  return {code, compound:code, name:product?product.name:code, strength, unit, start, qty, order};
}

function updatePreview(){
  const f=readForm();
  const el=document.getElementById('g_preview');
  if(!f.order || !(f.strength>0)){ el.textContent='Enter an order number and strength to preview.'; return; }
  try{ el.innerHTML='Preview: <span class="mono" style="color:var(--accent)">'+PMSerial.encode({compound:f.compound,strength:f.strength,unit:f.unit,order:f.order,vial:f.start})+'</span>'; }
  catch(e){ el.textContent=e.message; }
}
['g_comp','g_strength','g_unit','g_start','g_order'].forEach(id=>document.getElementById(id).addEventListener('input',updatePreview));

async function generate(){
  const f=readForm();
  if(!f.order){ toast('Enter an order number'); return; }
  if(!(f.strength>0)){ toast('Enter a valid strength'); return; }
  serials=[]; cursor=0;
  try{
    for(let i=0;i<f.qty;i++){
      const vial=f.start+i;
      serials.push({serial:PMSerial.encode({compound:f.compound,strength:f.strength,unit:f.unit,order:f.order,vial}), vial, written:false});
    }
  }catch(e){ toast(e.message); return; }
  try{ for(const s of serials) s.verify=await PMSerial.verifyCode(s.serial); }
  catch(e){ toast('Verify codes need HTTPS — '+(e.message||e)); }
  document.getElementById('g_outcard').style.display='block';
  document.getElementById('g_count').textContent=serials.length;
  renderList();
  initNFC();
  document.getElementById('g_outcard').scrollIntoView({behavior:'smooth'});
}

function renderList(){
  const el=document.getElementById('g_list');
  el.innerHTML=serials.map((s,i)=>`
    <div class="serialrow ${s.written?'done':''} ${i===cursor&&!s.written?'cur':''}">
      <div style="min-width:0">
        <div class="row" style="gap:10px">
          <span class="tag idx">#${String(s.vial).padStart(2,'0')}</span>
          <span class="s">${s.serial}</span>
        </div>
        ${s.verify?`<div class="small" style="margin-top:6px"><span class="muted">print on vial → </span><span class="mono" style="color:var(--accent2);font-size:14px;letter-spacing:1px">${s.verify}</span></div>`:''}
      </div>
      ${s.written?'<span class="tag ok">written ✓</span>':''}
    </div>`).join('');
  const allDone=serials.every(s=>s.written);
  const btn=document.getElementById('g_writeBtn');
  if(NFC_SUPPORTED){
    btn.disabled=allDone;
    btn.textContent=allDone? 'All tags written ✓' : ('📡 Write tag #'+String(serials[cursor].vial).padStart(2,'0'));
  }
}

async function writeNext(){
  if(!NFC_SUPPORTED){ toast('NFC needs Chrome on Android'); return; }
  if(cursor>=serials.length){ toast('All done'); return; }
  const item=serials[cursor];
  try{
    const w=new NDEFReader();
    toast('Hold a blank tag to the phone…');
    await w.write({records:[{recordType:'text', data:item.serial}]});
    item.written=true;
    toast('Wrote '+item.serial+' ✓');
    // advance to next unwritten
    while(cursor<serials.length && serials[cursor].written) cursor++;
    renderList();
  }catch(e){ toast('Write failed: '+(e.message||e)); }
}

function copyAll(){
  const txt=serials.map(s=>s.serial).join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Copied '+serials.length+' serials')).catch(()=>toast('Copy failed'));
}
function downloadCSV(){
  const f=readForm();
  const rows=[['order','vial','compound','strength','unit','serial','verify_code']]
    .concat(serials.map(s=>[f.order, s.vial, f.name, f.strength, f.unit, s.serial, s.verify||'']));
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='peptimart-'+(f.order||'batch')+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

initNFC(); updatePreview();
</script>
</body>
</html>
