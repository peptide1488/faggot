<!doctype html>
<html>
<head><meta charset="utf-8"><title>grass stack check</title>
<style>html,body{margin:0;background:#14161c;overflow:hidden;height:100%}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { getCameraMatrix } from '../src/math.js';
import { VoxelStore } from '../src/voxel/store.js';
import { buildMesh } from '../src/voxel/mesher.js';
import { loadAtlasImage } from '../src/voxel/blocks.js';
import { VoxelRenderer } from '../src/voxel/renderer.js';

const store = new VoxelStore();
store.set(0, 0, 0, 'grass');
store.set(0, 0, 1, 'grass');
store.set(0, 0, 2, 'grass');

const canvas = document.getElementById('c');
const atlasImg = await loadAtlasImage('../src/voxel/atlas.png?v=' + Date.now());
const renderer = new VoxelRenderer(canvas);
renderer.setAtlasImage(atlasImg);
renderer.setMesh(buildMesh(store));

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const cam = { rot: 0.7854, zoom: 3.5, panX: 0.5, panY: 0.5 };
const aspect = canvas.width / canvas.height;
const { matrix } = getCameraMatrix(cam.rot, cam.zoom, cam.panX, cam.panY, aspect);
renderer.render(matrix);
window.__ready = true;
</script>
</body>
</html>
