<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Material maker per-material-texture pivot — checkpoint</title>
<style>html,body{margin:0;background:#14161c;height:100%;} canvas{display:block;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Standalone checkpoint (not part of voxel.html) for the per-material-texture pivot: creates
// TWO custom materials (distinct colors, distinct resolutions, one with a distinct bottom
// face) purely through the same code path voxel.html's Material Maker panel uses, places them
// next to built-in blocks, and renders — a visual regression check that (a) built-in shared-
// atlas materials are unaffected, (b) each custom material's own texture/draw call actually
// shows up correctly, distinctly, at its own resolution.
import { VoxelStore } from '../src/voxel/store.js';
import { buildMesh } from '../src/voxel/mesher.js';
import { loadAtlasCanvas, drawImageIntoGridCell, BLOCKS } from '../src/voxel/blocks.js';
import { VoxelRenderer } from '../src/voxel/renderer.js';
import { planMaterialLayout, createCustomMaterial } from '../src/voxel/customMaterials.js';
import { getCameraMatrix } from '../src/math.js';

function solidColorDataURL(size, color) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, size, size);
  // A distinguishing mark so top vs side vs bottom are visually distinct even at a glance.
  ctx.fillStyle = '#000';
  ctx.fillRect(size * 0.4, size * 0.1, size * 0.2, size * 0.2);
  return c.toDataURL();
}
function dataURLToImage(dataURL) {
  return new Promise((resolve) => { const img = new Image(); img.onload = () => resolve(img); img.src = dataURL; });
}

async function makeMaterial({ name, heightBlocks, cellPx, topColor, sideColors, bottomColor }) {
  const hasCustomBottom = !!bottomColor;
  const layout = planMaterialLayout({ heightBlocks, hasCustomBottom });
  const canvas = document.createElement('canvas');
  canvas.width = layout.cols * cellPx;
  canvas.height = layout.rows * cellPx;
  const ctx = canvas.getContext('2d');

  const topImg = await dataURLToImage(solidColorDataURL(cellPx, topColor));
  drawImageIntoGridCell(ctx, topImg, layout.topIdx, layout.cols, cellPx);
  for (let i = 0; i < heightBlocks; i++) {
    const sideImg = await dataURLToImage(solidColorDataURL(cellPx, sideColors[i]));
    drawImageIntoGridCell(ctx, sideImg, layout.sideIdx[i], layout.cols, cellPx);
  }
  if (hasCustomBottom) {
    const bottomImg = await dataURLToImage(solidColorDataURL(cellPx, bottomColor));
    drawImageIntoGridCell(ctx, bottomImg, layout.bottomIdx, layout.cols, cellPx);
  }
  const entry = createCustomMaterial({ name, heightBlocks, layout, properties: {} });
  return { entry, canvas };
}

const canvas = document.getElementById('c');
const renderer = new VoxelRenderer(canvas);
const atlasCanvas = await loadAtlasCanvas('../src/voxel/atlas.png');
renderer.setAtlasImage(atlasCanvas);

// Material A: hot-pink/orange, 48px cells, single side course, custom bottom (distinct navy).
const matA = await makeMaterial({ name: 'Check Mat A', heightBlocks: 1, cellPx: 48, topColor: '#ff33aa', sideColors: ['#ff8800'], bottomColor: '#223399' });
renderer.setMaterialAtlas(matA.entry.id, matA.canvas);

// Material B: lime/teal, 2-course (heightBlocks=2), 24px cells — deliberately a DIFFERENT
// resolution than Material A, proving each material's texture is independent.
const matB = await makeMaterial({ name: 'Check Mat B', heightBlocks: 2, cellPx: 24, topColor: '#aaff33', sideColors: ['#22cccc', '#116666'] });
renderer.setMaterialAtlas(matB.entry.id, matB.canvas);

console.log('registered', matA.entry.id, matB.entry.id, Object.keys(BLOCKS).length, 'block types');

const store = new VoxelStore();
for (let c = 0; c < 5; c++) for (let r = 0; r < 5; r++) store.set(c, r, 0, 'grass');
store.set(1, 1, 1, matA.entry.id);
store.set(1, 2, 1, matA.entry.id);
store.set(3, 1, 1, matB.entry.id);
store.set(3, 1, 2, matB.entry.id); // 2-tall stack: exercises the bottom-course texture too
store.set(3, 2, 1, 'stone'); // built-in neighbor, confirms shared-atlas path still works alongside custom

const mesh = buildMesh(store);
console.log('byMaterial buckets:', Object.keys(mesh.byMaterial));
renderer.setMesh(mesh);

function render() {
  renderer.resize(900, 650);
  const { matrix } = getCameraMatrix(0.7, 1.6, 2.5, 2.5, 900 / 650);
  renderer.render(matrix);
}
render();
window.__ready = true;
</script>
</body>
</html>
