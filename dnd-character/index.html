function loadMapData(d){ if(!d||!net||net.role!=='dm') return; net.session.map={cols:d.cols, rows:d.rows, tiles:Object.assign({},d.tiles||{})}; dmBroadcast(); render(); }
function mapGridHTML(s, isDM, opts){ opts=opts||{}; const {cols,rows}=s.map; const tiles=s.map.tiles||{}; let cells='';
  const at=(x,y)=>tiles[x+','+y];
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const ter=at(x,y), td=ter&&TERRAIN[ter]; let style='';
    if(td&&td.c){
      // autotile: same-terrain neighbours connect (square edge); outer corners round off
      const U=at(x,y-1)===ter, D=at(x,y+1)===ter, L=at(x-1,y)===ter, R=at(x+1,y)===ter, RAD='11px';
      const tl=(!U&&!L)?RAD:'0', tr=(!U&&!R)?RAD:'0', br=(!D&&!R)?RAD:'0', bl=(!D&&!L)?RAD:'0';
      const m=2; // overlap the 2px gap so connected cells merge seamlessly
      style=`border-radius:${tl} ${tr} ${br} ${bl};`
        + (U?`margin-top:-${m}px;padding-top:${m}px;`:'') + (D?`margin-bottom:-${m}px;padding-bottom:${m}px;`:'')
        + (L?`margin-left:-${m}px;padding-left:${m}px;`:'') + (R?`margin-right:-${m}px;padding-right:${m}px;`:'');
    }
    const mo=s.monsters.find(m=>m.x===x&&m.y===y), pl=s.players.find(p=>p.x===x&&p.y===y);
    const hpbar=(cur,mx)=>{ if(!mx) return ''; const p=Math.max(0,Math.min(100,Math.round(cur/mx*100))); const cl=p<=25?'crit':p<=50?'low':''; return `<span class="hpbar ${cl}"><i style="width:${p}%"></i></span>`; };
    let tok=''; if(mo){ const dead=mo.hp<=0; const inner=mo.sprite?pixelArt(monsterSprite(mo.sprite),2):esc((mo.name[0]||'M').toUpperCase());
      const tcls='tok '+(mo.sprite?'':'mon')+(net&&net.sel==='m'+mo.id?' sel':'')+(dead?' deadtok':'');
      const tstyle=(mo.sprite?'background:none;box-shadow:none;':'')+(dead?'filter:grayscale(1) brightness(.55);transform:rotate(90deg);opacity:.65;':'');
      tok=`<span class="${tcls}" style="${tstyle}">${inner}</span>`+(dead?`<span class="mnum" style="background:#9c3b2c">💀</span>`:(mo.num?`<span class="mnum">${mo.num}</span>`:'')+hpbar(mo.hp,mo.max)); }
    else if(pl){ const meTok=(net&&net.role==='player'&&net.peer&&pl.id===net.peer.id); tok=`<span class="tok pl ${(net&&net.sel==='p'+pl.id)||meTok?'sel':''}">${esc((pl.name[0]||'P').toUpperCase())}</span>`+hpbar(pl.hpCur,pl.hpMax); }
    else if(td&&td.e) tok=`<span style="font-size:15px">${td.e}</span>`;
    let extra='';
    if(opts.reachCost && !mo && !pl && ter!=='wall' && ter!=='void'){ const fc=opts.reachCost[x+','+y]; if(fc!=null && fc>0) extra+=(opts.reachNormal!=null && fc>opts.reachNormal)?' reachdash':' reach'; }
    if(opts.rangeFrom && ter!=='wall'){ const rf=opts.rangeFrom, d=Math.max(Math.abs(rf.x-x),Math.abs(rf.y-y)); if(d>0 && d<=rf.tiles && losClear(s,rf.x,rf.y,x,y)) extra+=' reach'; }
    if(opts.blast){ const bl=opts.blast, d=Math.max(Math.abs(bl.x-x),Math.abs(bl.y-y)); if(d<=bl.r) extra+=' intarget'; }
    if(opts.targets && mo && opts.targets.indexOf(mo.id)>=0) extra+=' intarget';
    const canTarget = !isDM && mo && mo.hp>0;
    cells+=`<div class="mcell${td?' ter-'+ter:''}${extra} ${canTarget?'tgt':''}" data-cell="${x},${y}" style="${style}" ${canTarget?`data-target="${mo.id}"`:''}>${tok}</div>`;
  }
  return `<div class="mapwrap"><div class="mapgrid" style="grid-template-columns:repeat(${cols},36px)">${cells}</div></div>`;
}

    if(net.sel.slice(0,2)==='t:'){ const key=net.sel.slice(2); if(!s.map.tiles) s.map.tiles={}; if(key==='floor') delete s.map.tiles[x+','+y]; else s.map.tiles[x+','+y]=key; dmBroadcast(); render(); return; }   // paint terrain, keep brush
    const ter=terrainAt(s,x,y);
    if(net.sel[0]==='m'){ const mo=s.monsters.find(m=>m.id===net.sel.slice(1)); if(mo){
      if(s.battle.active){ if(ter==='wall'){ flashBanner('Wall blocks '+mo.name); return; }
        if(s.monsters.some(m=>m.hp>0&&m.id!==mo.id&&m.x===x&&m.y===y)||s.players.some(p=>p.x===x&&p.y===y)){ flashBanner('That tile is occupied'); return; }
        const dashAvail=(mo.attacksLeft||0)>0, dashMax=(mo.moveLeft||0)+(dashAvail?(mo.speed||30):0);
        const cost=reachableCells(s,mo.x,mo.y,dashMax)[x+','+y]; if(cost==null){ flashBanner(mo.name+' can’t reach there (walls or too far)'); return; }
        if(cost>(mo.moveLeft||0)){ if(!dashAvail){ flashBanner(mo.name+' too far — needs its action to Dash'); return; } mo.moveLeft=(mo.moveLeft||0)+(mo.speed||30); mo.attacksLeft=0; flashBanner('🏃 '+mo.name+' Dashes (action used)'); }
        mo.moveLeft=(mo.moveLeft||0)-cost; }
      mo.x=x; mo.y=y; mo.placed=true;
      if(s.battle.active){ const tdef=TERRAIN[ter]; if(tdef&&tdef.deadly){ mo.hp=0; flashBanner(mo.name+' fell into the void! 💀'); } else if(tdef&&tdef.dmg){ const d=(rollNotation(tdef.dmg)||{total:0}).total; mo.hp=Math.max(0,mo.hp-d); flashBanner((tdef.e||'🔥')+' '+mo.name+' takes '+d+' from '+tdef.name); } }
    } }
    else { const p=s.players.find(pp=>pp.id===net.sel.slice(1)); if(p){ if(s.battle.active && ter==='wall'){ flashBanner('Wall is impassable'); return; } p.x=x; p.y=y; p.placed=true;
      if(s.battle.active){ const tdef=TERRAIN[ter]; if(tdef&&tdef.deadly){ dmSend(p.id,{t:'apply',delta:-9999}); flashBanner(p.name+' pushed into the void! 💀'); } else if(tdef&&tdef.dmg){ const d=(rollNotation(tdef.dmg)||{total:0}).total; dmSend(p.id,{t:'apply',delta:-d}); flashBanner(p.name+' pushed into '+tdef.name+' — '+d+'!'); } } } }
    net.sel=null; dmBroadcast(); render(); });

  { const ml=$('#mLoad'); if(ml) ml.onclick=()=>{ const v=$('#mPreset').value; if(!v) return; const [k,nm]=[v.slice(0,1),v.slice(2)]; const d=k==='p'?MAP_PRESETS[nm]:savedMaps()[nm]; if(d&&confirm('Load "'+nm+'"? This replaces the current map.')) loadMapData(d); }; }

  $('#mResize').onclick=()=>{ s.map.cols=Math.max(2,Math.min(30,Number($('#mCols').value)||10)); s.map.rows=Math.max(2,Math.min(30,Number($('#mRows').value)||8)); dmBroadcast(); render(); };
}
function deployMonster(m){ if(!net||net.role!=='dm') return;
  const same=net.session.monsters.filter(x=>x.base===m.n);
  if(same.length===1){ same[0].name=same[0].base+' 1'; same[0].num=1; }   // retro-number the first when a second appears
  const idx=net.session.monsters.length, cols=net.session.map.cols||10;
  const spd=(typeof m.spd==='number')?m.spd:(String(m.spd||'').match(/(\d+)/)?Number(String(m.spd).match(/(\d+)/)[1]):30);
  net.session.monsters.push({id:'m'+Date.now().toString(36)+Math.floor(Math.random()*99), base:m.n, name: same.length? m.n+' '+(same.length+1) : m.n, num: same.length? same.length+1 : 0, hp:m.hp, max:m.hp, ac:m.ac, x:idx%cols, y:Math.floor(idx/cols), sprite:m.sprite, atk:m.atk, init:m.init||0, attacks:m.attacks||1, attacksLeft:m.attacks||1, speed:spd, moveLeft:spd});
  dmBroadcast(); render(); flashBanner('Deployed '+m.n); }
function parseMonsterAttacks(str){ return (str||'').split('·').map(s=>s.trim()).filter(Boolean).map(part=>{
  const hit=part.match(/\+(\d+)\s*\(/)||part.match(/\+(\d+)/); const dc=part.match(/DC\s*(\d+)\s*(Str|Dex|Con|Int|Wis|Cha)/i);
  const dmg=part.match(/(\d+d\d+(?:\s*\+\s*\d+)?)/); const name=part.split(/\s*\(|\s*\+/)[0].trim();
  let tiles=/reach/i.test(part)?2:1;
  if(/breath|cone|line/i.test(part)) tiles=6;
  else if(/bow|crossbow|sling|javelin|dart|spit|ray|bolt|hurl|thrown|web|net|stinger|spike/i.test(part)) tiles=24;
  return {name:name||'Attack', hit:hit?Number(hit[1]):null, dc:dc?{n:Number(dc[1]),ab:dc[2]}:null, dmg:dmg?dmg[1].replace(/\s+/g,''):null, tiles, raw:part}; }); }
function dmMonsterAttack(mo){
  if(net.session.battle.active && mo.attacksLeft!=null && mo.attacksLeft<=0){ flashBanner(mo.name+' already attacked this turn — ▶ Next turn to reset'); return; }
  const atks=parseMonsterAttacks(mo.atk); if(!atks.length) atks.push({name:'Attack',hit:0,dmg:'1d6'});
  const players=net.session.players; if(!players.length){ flashBanner('No players connected to target'); return; }
  const st={atk:atks[0], targetId:players[0].id, phase:'aim', d20:0, total:0, dmg:0};
  const tgt=()=>net.session.players.find(p=>p.id===st.targetId)||players[0];
  function draw(){ const range=st.atk.tiles||1; const inR=players.filter(p=>gridDist(mo.x,mo.y,p.x,p.y)<=range && losClear(net.session,mo.x,mo.y,p.x,p.y));
    if(inR.length && !inR.some(p=>p.id===st.targetId)) st.targetId=inR[0].id;
    const t=tgt(); let body=`<h2>⚔ ${esc(mo.name)} attacks</h2>`;
    body+=`<div class="field"><label>Attack</label><div class="chips">${atks.map((a,i)=>`<button class="chip ${st.atk===a?'on':''}" data-ma="${i}">${esc(a.name)}${a.hit!=null?' +'+a.hit:a.dc?' (DC'+a.dc.n+')':''}${a.tiles>1?' · '+(a.tiles*5)+'ft':''}</button>`).join('')}</div></div>`;
    if(!inR.length){ body+=`<div class="empty" style="padding:10px 0">No players within ${range*5} ft of ${esc(mo.name)} for ${esc(st.atk.name)} — 📍 move it closer or pick another attack.</div>`; }
    else { body+=`<div class="field"><label>Target (in range)</label><select id="maTgt">${inR.map(p=>`<option value="${p.id}" ${p.id===st.targetId?'selected':''}>${esc(p.name)} — AC ${p.ac}, HP ${p.hpCur}/${p.hpMax} · ${gridDist(mo.x,mo.y,p.x,p.y)*5}ft</option>`).join('')}</select></div>`;
    if(st.atk.dc){
      body+=`<div class="card" style="margin:0 0 10px"><b>${esc(st.atk.name)}</b><br>${esc(t.name)} must make a <b>DC ${st.atk.dc.n} ${st.atk.dc.ab}</b> save.${st.atk.dmg?'<br>Damage: '+esc(st.atk.dmg):''}</div>`;
      if(st.atk.dmg){ if(!st.dmg) body+=`<button class="btn block" id="maDmg">🎲 Roll damage</button>`;
        else body+=`<div class="card" style="text-align:center;margin:0 0 8px"><div style="font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--bad)">${st.dmg}</div></div><div class="row2"><button class="btn bad" id="maFull">Apply ${st.dmg} (fail)</button><button class="btn ghost" id="maHalf">Apply ${Math.floor(st.dmg/2)} (save)</button></div>`; }
    } else if(st.phase==='aim'){
      body+=`<button class="btn block" id="maRoll">🎲 Roll to hit (+${st.atk.hit||0}) vs AC ${t.ac}</button>`;
    } else {
      const isHit=st.total>=t.ac||st.d20===20, crit=st.d20===20;
      body+=`<div class="card" style="text-align:center;margin:0 0 8px"><div style="font-family:Georgia,serif;font-size:32px;font-weight:700;color:${isHit?'var(--good)':'var(--bad)'}">${st.total}</div><div class="muted">d20(${st.d20}) +${st.atk.hit||0} vs AC ${t.ac} — ${crit?'💥 CRIT':isHit?'HIT':'MISS'}</div></div>`;
      if(isHit){ if(!st.dmg) body+=`<button class="btn block" id="maDmg">🎲 Roll damage${crit?' (crit ×2 dice)':''}</button>`;
        else body+=`<div class="card" style="text-align:center;margin:0 0 8px"><div style="font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--bad)">${st.dmg}</div></div><button class="btn bad block" id="maApply">Apply ${st.dmg} to ${esc(t.name)}</button>`; }
      body+=`<button class="btn ghost block" id="maReset" style="margin-top:8px">↺ New attack</button>`;
    } }
    body+=`<button class="btn ghost block" id="maClose" style="margin-top:10px">Close</button>`;
    $('#modalRoot').innerHTML=`<div class="modal" id="maModal"><div class="sheet"><div class="grip"></div>${body}</div></div>`;
    $('#maModal').onclick=e=>{ if(e.target.id==='maModal') $('#modalRoot').innerHTML=''; };
    $('#maClose').onclick=()=>{ $('#modalRoot').innerHTML=''; };
    { const ts=$('#maTgt'); if(ts) ts.onchange=()=>{ st.targetId=ts.value; st.phase='aim'; st.dmg=0; draw(); }; }
    document.querySelectorAll('[data-ma]').forEach(b=>b.onclick=()=>{ st.atk=atks[Number(b.dataset.ma)]; st.phase='aim'; st.dmg=0; draw(); });
    { const r=$('#maRoll'); if(r) r.onclick=()=>{ sfx('swing'); st.d20=rnd(20); st.total=st.d20+(st.atk.hit||0); st.phase='res'; const isH=st.total>=tgt().ac||st.d20===20; sfx(st.d20===20?'crit':isH?'hit':'miss'); attackFx(st.d20===20?'crit':isH?'hit':'miss'); pushRoll({label:mo.name+' '+st.atk.name, total:st.total, detail:'d20('+st.d20+') +'+(st.atk.hit||0)+' vs AC '+tgt().ac, crit:st.d20===20?'crit':st.d20===1?'fumble':null, kind:'check'}); draw(); }; }
    { const dm=$('#maDmg'); if(dm) dm.onclick=()=>{ sfx('damage'); attackFx(st.d20===20?'crit':'hit'); const base=st.atk.dmg||'1d6'; const note=(st.d20===20)?critNotation(base):base; const rr=rollNotation(note)||{total:0,detail:''}; st.dmg=rr.total; pushRoll({label:mo.name+' '+st.atk.name+' dmg', total:rr.total, detail:rr.detail, kind:'dmg'}); draw(); }; }
    const useAtk=()=>{ if(mo.attacksLeft!=null) mo.attacksLeft=Math.max(0,mo.attacksLeft-1); dmBroadcast(); render(); };
    { const ap=$('#maApply'); if(ap) ap.onclick=()=>{ dmSend(st.targetId,{t:'apply',delta:-Math.abs(st.dmg)}); flashBanner(mo.name+' hits '+tgt().name+' for '+st.dmg); $('#modalRoot').innerHTML=''; useAtk(); }; }
    { const f=$('#maFull'); if(f) f.onclick=()=>{ dmSend(st.targetId,{t:'apply',delta:-Math.abs(st.dmg)}); flashBanner(tgt().name+' takes '+st.dmg); $('#modalRoot').innerHTML=''; useAtk(); }; }
    { const hf=$('#maHalf'); if(hf) hf.onclick=()=>{ const half=Math.floor(st.dmg/2); dmSend(st.targetId,{t:'apply',delta:-half}); flashBanner(tgt().name+' takes '+half+' (saved)'); $('#modalRoot').innerHTML=''; useAtk(); }; }
    { const rs=$('#maReset'); if(rs) rs.onclick=()=>{ st.phase='aim'; st.dmg=0; draw(); }; }
  }
  draw();
}

function renderNetBar(){
  let bar=document.getElementById('netbar');
  if(net && net.role==='player'){ if(!bar){ bar=document.createElement('div'); bar.id='netbar'; bar.className='netbar'; document.body.insertBefore(bar, document.body.firstChild); }
    const status = net.connected ? (net.session&&net.session.battle.active?' · ⚔ Battle R'+net.session.battle.round:'') : ' · <span style="color:#ffd9c9">reconnecting…</span>';
    bar.innerHTML=`<span>🔗 In game <span class="code">${esc(net.code)}</span>${status}</span><button id="nbMap">🗺 Map</button><button id="nbLeave">Leave</button>`;
    bar.querySelector('#nbMap').onclick=openSessionMap; bar.querySelector('#nbLeave').onclick=()=>{ if(confirm('Leave the game?')) playerLeave(); };
  } else if(bar){ bar.remove(); }
}

/* reconnect when a backgrounded player tab regains focus / network */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && net && net.role==='player'){ try{ if(net.conn&&net.conn.open) return; }catch(e){} scheduleReconnect(); } });
window.addEventListener('online',()=>{ if(net && net.role==='player'){ try{ if(net.conn&&net.conn.open) return; }catch(e){} scheduleReconnect(); } });

/* ---- wiring ---- */
document.addEventListener('click',e=>{
  playClickSound(e.target);
  const cl=e.target.closest('[data-collapse]'); if(cl){ toggleCollapse(cl.dataset.collapse); return; }
  const af=e.target.closest('[data-aflow]'); if(af){ const c=cur(); if(c) attackFlow(c, {name:af.dataset.aname, toHit:Number(af.dataset.ahit)||0, dmg:af.dataset.admg||'1d4', dt:af.dataset.adt||'', vers:af.dataset.avers||''}); return; }
  const bdEl=e.target.closest('[data-bd]');
  if(bdEl){ const c=cur(); if(c) showBreakdown(c, bdEl.dataset.bd); return; }
  const rc=e.target.closest('[data-rollcheck]');
  if(rc){ rollCheck(rc.dataset.label, Number(rc.dataset.bonus)||0, 'normal');
    const cc=cur(); if(cc&&cc.battle&&/attack/i.test(rc.dataset.label||'')){ cc.battle.attacksLeft=Math.max(0,cc.battle.attacksLeft-1); cc.battle.action=true; save(); render(); }
    return; }
  const rd=e.target.closest('[data-rolldmg]');
  if(rd){ rollDmg(rd.dataset.label, rd.dataset.notation); return; }
  const si=e.target.closest('[data-spellinfo]'); if(si){ spellInfo(si.dataset.spellinfo); return; }
  const fi=e.target.closest('[data-featinfo]'); if(fi){ featInfo(fi.dataset.featinfo); return; }
  const bi=e.target.closest('[data-bginfo]'); if(bi){ bgInfo(bi.dataset.bginfo); return; }
  if(e.target.closest('#diceFab')){ openDiceTray(); return; }
  const t=e.target.closest('[data-tab]');
  if(t){ tab=t.dataset.tab; render(); }
  if(e.target.id==='welcomeNew'||e.target.id==='newChar') createCharacterFlow();
  if(e.target.id==='welcomeRandom') openRandomBuilder();
  if(e.target.id==='welcomeHost') dmHost();
  if(e.target.id==='welcomeJoin') openJoin();
  if(e.target.id==='appMenu') openAppMenu();
  if(e.target.id==='appSearch') openSearch();
});
$('#charSelect').addEventListener('change',e=>{ curId=e.target.value; localStorage.setItem(LS_CUR,curId); tab='char'; render(); });

/* ---- service worker (auto-update on new version) ---- */
const APP_VERSION='v62';
{ const vb=document.getElementById('verBadge'); if(vb) vb.textContent=APP_VERSION; }
if('serviceWorker' in navigator){
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_reloaded) return; _reloaded=true; location.reload(); });
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{ if(reg.update) reg.update(); }).catch(()=>{}));
}

render();
</script>
</body>
</html>
