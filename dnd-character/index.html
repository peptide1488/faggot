<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5320">
<title>Grimoire — D&D 5e Character Keeper</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root{
    --bg:#e7d8b8; --panel:#f4ecd6; --panel2:#e6d6b4; --line:#c1a877;
    --ink:#3a2c1a; --mut:#7b6847; --accent:#4d6a2c; --accent2:#3b5320;
    --good:#3f7d36; --bad:#9c3b2c; --gold:#a9791a;
    --r:14px; --sp:14px;
  }
  *{box-sizing:border-box}
  /* Reserve the scrollbar gutter permanently — battle log/HP updates constantly change
     page height, which toggles the scrollbar on/off; each toggle shifts available width
     by its ~15px, which resizes the Iso3D canvas (clientWidth check in _syncSize), and
     resizing a <canvas> clears it to transparent/black for that frame. That's the "black
     flicker during battle, worse once the camera started following every turn" report —
     the canvas was being reset by a scrollbar-driven layout shift, not by the camera. */
  html{scrollbar-gutter:stable; overflow-y:scroll}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 80% at 15% 0%, rgba(255,250,235,.55), transparent 60%),
      radial-gradient(100% 70% at 85% 100%, rgba(120,90,40,.10), transparent 55%),
      repeating-linear-gradient(135deg, rgba(120,90,40,.025) 0 2px, transparent 2px 5px),
      var(--bg);
    color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  ::selection{background:rgba(77,106,44,.28)}
  .serif{font-family:Georgia,"Times New Roman",serif}
  h1,h2,h3{margin:0}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:84px}
  label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px;text-transform:uppercase;letter-spacing:.04em}
  a{color:var(--accent)}

  header{
    position:sticky;top:0;z-index:20;background:linear-gradient(rgba(244,236,214,.95),rgba(231,216,184,.92));backdrop-filter:blur(8px);
    border-bottom:2px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    box-shadow:0 2px 10px rgba(90,67,30,.10);
  }
  .hrow{display:flex;align-items:center;gap:10px}
  .hrow .d20{width:30px;height:30px;flex:none}
  .htitle{font-weight:700;font-size:17px;letter-spacing:.02em}
  .hsub{font-size:12px;color:var(--mut)}
  .charpick{margin-left:auto;display:flex;gap:8px;align-items:center}
  .charpick{gap:6px}
  .charpick select{width:auto;max-width:32vw;padding:7px 8px}
  .iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;line-height:1}

  main{padding:14px;max-width:760px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:520px){.g4{grid-template-columns:repeat(2,1fr)}}

  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px}

  /* abilities */
  .abis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:560px){.abis{grid-template-columns:repeat(3,1fr)}}
  .abi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
  .abi .nm{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .abi .mod{font-family:Georgia,serif;font-size:24px;font-weight:700;line-height:1.1}
  .abi input{text-align:center;padding:6px;margin-top:6px;font-weight:600}

  /* big stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .tile .lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .tile .big{font-family:Georgia,serif;font-size:26px;font-weight:700}
  .tile input{text-align:center}

  .listrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}
  .listrow .chk{flex:none}
  .listrow .nm{flex:1;min-width:0}
  .listrow .val{font-family:Georgia,serif;font-weight:700;min-width:34px;text-align:right}
  .listrow .sub{font-size:12px;color:var(--mut)}
  .chk{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}

  .hp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
  .hpbtns{display:flex;gap:8px;margin-top:10px}
  .hpbtns input{flex:1}
  .btn{background:linear-gradient(180deg,var(--accent),var(--accent2));border:1px solid var(--accent2);border-radius:10px;padding:9px 12px;font-weight:600;text-align:center;color:#f6efda;box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 2px 6px rgba(60,84,32,.25);transition:transform .08s ease, filter .15s ease, box-shadow .15s ease}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px) scale(.985)}
  .btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--ink);font-weight:500;box-shadow:none}
  .btn.bad{background:#e8cabb;border-color:#9c3b2c;color:#6e251a}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.block{width:100%}

  .slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .slot:last-child{border-bottom:0}
  .slot .lvl{width:64px;font-size:13px;color:var(--mut)}
  .pips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .pip{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
  .pip.on{background:var(--accent2);border-color:var(--accent)}
  .slotcfg{width:54px}
  .slotcfg input{padding:5px;text-align:center}

  .spell{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .spell:last-child{border-bottom:0}
  .spell .nm{flex:1;min-width:0}
  .spell .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spell .nm small{color:var(--mut)}
  .tag{font-size:11px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .del{background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px;line-height:1}
  .del:hover{color:var(--bad)}

  .addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .addrow input,.addrow select{flex:1;min-width:90px;width:auto}

  .currency{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
  .currency .lab{font-size:11px;color:var(--mut);text-transform:uppercase}

  .muted{color:var(--mut)}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:14px 0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sectionhide{display:none}

  /* bottom nav */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(rgba(231,216,184,.97),rgba(238,226,198,.98));backdrop-filter:blur(10px);border-top:2px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(90,67,30,.10);
  }
  nav.tabs button{background:none;border:0;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px}
  nav.tabs button .ic{font-size:18px;line-height:1}
  nav.tabs button.on{color:var(--accent)}

  .fade{animation:f .18s ease}
  @keyframes f{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* welcome / empty state */
  .welcome{text-align:center;padding:40px 16px}
  .welcome .d20big{width:84px;height:84px;margin:0 auto 16px}
  .welcome h1{font-size:24px;margin-bottom:8px}
  .welcome p{color:var(--mut);max-width:380px;margin:0 auto 20px}

  /* modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(40,28,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadein .18s ease}
  .modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:560px){.modal{align-items:center;padding:16px}.modal .sheet{border-radius:18px}}
  .modal h2{font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0;margin-bottom:14px}
  .modal .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}

  /* rollable affordance */
  .rollbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;
    font-family:Georgia,serif;font-weight:700;cursor:pointer;min-width:40px}
  .rollbtn:active{background:var(--accent2);border-color:var(--accent)}
  .abi .mod.rollbtn{display:block;width:100%;margin:0 auto;padding:4px}

  /* dice FAB */
  .dicefab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;
    width:54px;height:54px;border-radius:50%;border:1px solid var(--accent2);
    background:linear-gradient(160deg,#5a7d34,#3b5320);color:#f6efda;font-size:24px;
    box-shadow:0 8px 22px rgba(60,84,32,.45);display:flex;align-items:center;justify-content:center;
    animation:fabfloat 3.2s ease-in-out infinite}
  .dicefab:hover{animation-play-state:paused;filter:brightness(1.08)}
  .dicefab:active{transform:scale(.92) rotate(-12deg)}

  /* roll result banner */
  .rollbanner{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
    bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;width:calc(100% - 24px);max-width:440px;
    background:var(--panel);border:1px solid var(--accent);border-radius:14px;
    padding:10px 12px;box-shadow:0 10px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s}
  .rollbanner.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .rollbanner .rb-main{display:flex;align-items:center;gap:12px}
  .rollbanner .rb-total{font-family:Georgia,serif;font-size:30px;font-weight:700;min-width:48px;text-align:center;color:var(--accent)}
  .rollbanner .rb-info{flex:1;min-width:0}
  .rollbanner .rb-detail{font-size:12px;color:var(--mut);margin-top:1px}
  .rollbanner .rb-detail s{opacity:.6}
  .rollbanner .rb-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .rb-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600}
  .rb-btn:active{background:var(--accent2)}
  .crit{color:var(--good);font-weight:700;font-size:12px}
  .fumble{color:var(--bad);font-weight:700;font-size:12px}

  /* dice tray */
  .dietray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .diebtn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 0;font-family:Georgia,serif;font-weight:700;font-size:16px}
  .diebtn:active{background:var(--accent2);border-color:var(--accent)}
  .logrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .logrow:last-child{border-bottom:0}
  .logrow .lr-total{font-family:Georgia,serif;font-weight:700;font-size:18px;color:var(--accent);min-width:34px;text-align:right}
  .logrow .lr-lab{font-weight:600;min-width:0}
  .logrow .lr-det{font-size:12px;color:var(--mut);margin-left:auto;text-align:right}

  /* condition chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px}
  .chip.on{background:#e8cabb;border-color:#9c3b2c;color:#6e251a}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:18px}
  .stepper button:disabled{opacity:.35}
  .seg{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px;border-radius:7px;font-size:13px;font-weight:600}
  .seg button.on{background:var(--accent2);color:#f6efda}
  .pbinfo{font-size:13px;color:var(--mut);margin-bottom:10px}
  .abrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .abrow:last-child{border-bottom:0}
  .abrow .nm{width:40px;font-weight:700;text-transform:uppercase;font-size:12px;color:var(--mut)}
  .abrow .rcl{width:30px;text-align:center;font-size:12px;color:var(--gold)}
  .abrow .tot{margin-left:auto;min-width:64px;text-align:center}
  .profdot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);flex:none}
  .profdot.on{background:var(--accent);border-color:var(--accent)}
  .wzprog{display:flex;gap:5px;margin-bottom:12px}
  .wzprog span{flex:1;height:5px;border-radius:3px;background:var(--panel2)}
  .wzprog span.on{background:var(--accent)}
  .cklist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px}
  .pfp{width:76px;height:76px;border-radius:50%;flex:none;background:var(--panel2) center/cover no-repeat;
    border:2px solid var(--line);display:grid;place-items:center;font-size:30px;color:var(--mut)}
  .hpfp{width:30px;height:30px;border-radius:50%;flex:none;background:center/cover no-repeat;border:1px solid var(--line)}

  /* ---- D&D parchment polish: cards look like aged paper ---- */
  .card{background:linear-gradient(180deg,var(--panel),#efe6cd);box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 3px 10px rgba(90,67,30,.10);transition:box-shadow .2s ease, transform .2s ease}
  .card h2{font-family:Georgia,"Times New Roman",serif}
  @media(hover:hover){.card:hover{box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 6px 18px rgba(90,67,30,.16)}}
  .htitle{color:var(--accent2);text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .tile,.abi,.pill,.chip,.pip,.tag,.rollbtn,.iconbtn,.diebtn,.profdot,.seg button,.stepper button{transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease}
  .iconbtn:active{transform:scale(.92)}
  .abi:active,.tile:active{transform:scale(.97)}
  .pip:active{transform:scale(.8)}
  .pip.on{animation:pop .18s ease}
  .chip.on{animation:pop .18s ease}
  nav.tabs button{transition:color .15s ease, transform .12s ease}
  nav.tabs button:active{transform:scale(.9)}
  nav.tabs button.on .ic{animation:pop .22s ease}

  /* ---- animations ---- */
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes fabfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pixin{from{opacity:0;transform:translateY(3px) scale(.9)}to{opacity:1;transform:none}}
  .spin{animation:spin .6s ease}

  /* ---- pixel-art sprites ---- */
  .pix{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .emblem{display:inline-grid;place-items:center;border-radius:12px;flex:none;
    background:radial-gradient(circle at 50% 35%, #f6efd9, #e3d2ac);
    border:2px solid var(--line);box-shadow:0 2px 6px rgba(90,67,30,.18), 0 0 0 1px rgba(255,255,255,.3) inset;
    padding:6px;animation:pixin .25s ease}
  .emblem .pix{filter:drop-shadow(0 1px 0 rgba(90,67,30,.25))}
  @media(hover:hover){.emblem:hover{transform:translateY(-2px) rotate(-1deg)}}
  .emblem{transition:transform .15s ease}
  .emrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .emrow .emcap{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-top:4px}

  /* collapsible card headers */
  .chev{background:none;border:0;color:var(--mut);font-size:13px;padding:2px 6px;transition:transform .15s ease}
  .collapsed-note{color:var(--mut);font-size:12px;padding:6px 0 2px}

  /* DM / multiplayer */
  .netbar{position:sticky;top:0;z-index:21;background:linear-gradient(var(--accent2),#2c3f18);color:#f6efda;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;font-size:13px}
  .netbar .code{font-family:Georgia,serif;font-weight:700;letter-spacing:2px}
  .netbar button{margin-left:auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#f6efda;border-radius:8px;padding:5px 10px;font-size:12px}
  /* clear:both is load-bearing: .mapwrap's own overflow:auto makes it establish a block
     formatting context, and a BFC box sitting beside an UNCLEARED float (every map header row
     has float:right Rotate/Top-down/Move buttons) shrinks to fit beside the float instead of
     spanning the container — clearing forces it onto its own line below the header first. */
  .mapwrap{clear:both;overflow:auto;border-radius:12px;padding:6px;background:#b8a274;
    box-shadow:inset 0 0 18px rgba(60,42,20,.35), 0 2px 8px rgba(0,0,0,.18)}
  /* On mobile, break the map viewport out of main's + the card's padding to use the full
     screen width — every mode (DM, player battle, quick battle, modal map pickers) shares this
     one .mapwrap, and all of them sit inside a centered container, so the standard "full-bleed
     from a centered max-width parent" trick works regardless of nesting depth/modal vs card. */
  @media(max-width:760px){
    .mapwrap{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;
      padding-left:calc(6px + env(safe-area-inset-left));padding-right:calc(6px + env(safe-area-inset-right))}
  }
  .mapgrid{display:grid;gap:0;min-width:max-content;
    background:
      repeating-linear-gradient(0deg,rgba(40,28,12,.20) 0 1px,transparent 1px 36px),
      repeating-linear-gradient(90deg,rgba(40,28,12,.20) 0 1px,transparent 1px 36px),
      linear-gradient(145deg,#efe3c4,#dccba0);
    box-shadow:inset 0 0 0 1px rgba(40,28,12,.25)}
  .mcell{width:36px;height:36px;display:grid;place-items:center;position:relative;cursor:pointer;background:transparent}
  /* isometric mode: floor/elevation is painted on a <canvas> underlay (real painter's-algorithm
     depth sort — see paintIsoCanvas/drawIsoTile) so occlusion can never desync from z-index the
     way the old clip-path riser divs did. The .mcell divs stay (invisible, no fill) purely as
     absolutely-positioned hitboxes/highlight-rings for click/reach/target — same diamond
     shape+position math as before, so all existing click/target/DM-paint code is untouched. */
  .mapgrid.iso{position:relative;background:none;box-shadow:none;min-width:0;isolation:isolate}
  .mapgrid.iso canvas.isocanvas{position:absolute;left:0;top:0;pointer-events:none}
  /* WebGL Iso3D underlay (optional battle view) */
  .mapgrid.iso.iso3dmode{background:linear-gradient(180deg,#8eb8e0 0%,#6a9cc8 55%,#4a7aaa 100%)}
  .mapgrid.iso.iso3dmode .iso3d-mount{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0}
  /* Nearest-neighbor when browser scales the canvas CSS size */
  .mapgrid.iso.iso3dmode .iso3d-gl,.mapgrid.iso.iso3dmode .iso3d-overlay,
  canvas.iso3d-gl,canvas.iso3d-overlay{image-rendering:pixelated;image-rendering:crisp-edges}
  .mapgrid.iso.iso3dmode canvas.isocanvas{display:none}
  .mapgrid.iso.iso3dmode .mcell.iso{background:transparent!important;box-shadow:none!important;filter:none!important;border:none!important;outline:none!important}
  .mapgrid.iso.iso3dmode .mcell.iso .isoContent{opacity:0;pointer-events:none} /* sprites drawn by Iso3D */
  /* DOM range/move rings use fixed 2D iso layout — they drift when the WebGL camera pans.
     Iso3D draws camera-projected highlights on its overlay instead. */
  .mapgrid.iso.iso3dmode .mcell.iso.reach,
  .mapgrid.iso.iso3dmode .mcell.iso.reachdash,
  .mapgrid.iso.iso3dmode .mcell.iso.reachjump,
  .mapgrid.iso.iso3dmode .mcell.iso.reachclimb,
  .mapgrid.iso.iso3dmode .mcell.iso.rangeok,
  .mapgrid.iso.iso3dmode .mcell.iso.aoe,

  .mcell.reach{box-shadow:inset 0 0 0 2px rgba(110,200,90,.9), inset 0 0 8px rgba(110,200,90,.5)!important;cursor:pointer}

  /* Range tints: max-reach = slate indigo (no LoS); valid shot = hot gold (clear LoS).

  .mcell.rangeok{box-shadow:inset 0 0 0 2px rgba(255,210,40,.98), inset 0 0 12px rgba(255,180,20,.5)!important;cursor:crosshair}
  .mcell.rangeok::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,220,60,.95);bottom:2px;left:2px;box-shadow:0 0 4px rgba(255,200,40,.9)}
  .mcell.rangemax{box-shadow:inset 0 0 0 2px rgba(100,110,170,.55), inset 0 0 8px rgba(70,80,140,.22)!important}
  /* Fog of war (v120.241) — player view only; the DM map never gets these classes.
     Remembered = you know the terrain but not what's standing on it now; unseen = nothing.
     Kept as brightness/opacity rather than an overlay element so it works identically in the
     flat grid and the iso view, which position .mcell very differently. */
  /* Invisible (v120.254): opacity 0.25, and nothing else.
     v120.250 had the right opacity but bolted on a hue-rotate and a shimmer animation, which
     desaturated the token and drew the eye — the opposite of fading it. Transparency alone is
     the whole effect. */
  .invisTok{opacity:.25}

/* ----------------------------------------------------------------------------

---------------------------------------------------------------------------- */
const LS_KEY = 'grimoire.characters.v1';
const LS_CUR = 'grimoire.current.v1';

const ABILITIES = [
  ['str','Strength'],['dex','Dexterity'],['con','Constitution'],

// each: {s: skill proficiencies, f: signature feature}
const BG_INFO = {
'Acolyte':{s:'Insight, Religion', f:'Shelter of the Faithful — free healing & care at temples of your faith.'},

// Core class features by level [level, name, summary]

/* ---- equipment sprites (reuse class weapons + new gear) ---- */

/* ---- weapon catalog ---- */
/* ---- equipment economy: starting gold, shop, essentials ---- */
// A Healer's Kit has 10 uses (PHB); tracked as one flat counter on the character rather than
// per-item, the same simplification Goodberries already uses. Lazily defaults to 10 the first
// time it's actually spent, not at purchase — nothing to migrate for characters who bought one

// Class weapon proficiencies (simplified to the catalog).
// `it` (the character's inventory item, not the catalog entry `w`) carries a magic weapon's

// Which existing inventory item a catalog entry needs picked (a +1 Weapon enchants a weapon you
// already own, RAW-style — it isn't a second item you carry alongside a mundane one); null for
// the standalone wondrous items (Cloak of Protection etc.), which just become new items outright.
/* ---- battle mode: initiative, rounds, action tracking ---- */
// THE per-turn resource reset, shared by every mode (solo battle, quick battle,
// net play). Add new per-turn flags HERE and nowhere else.
// Path of the Berserker — Frenzy (3rd level): a CHOICE made when you rage (not automatic —
// real optimizers sometimes skip it to avoid exhaustion stacking), so toggleRage takes an
// optional param instead of a separate function; every existing call site (#rageBtn/#rageBtn2/
// #pbRage — already shared across QB and player-net, Rage has no adapter dependency at all
// since it only ever touches the caster's own c) stays byte-identical by simply not passing it.
// The Rage button's actual click target — every one of the 3 UI buttons calls this instead of
// toggleRage directly, so an eligible Berserker starting a fresh rage gets asked about Frenzy
// (a real choice with a real cost) while ending a rage / a non-Berserker's rage stays a single
// tap, unchanged.
// Wild Shape (base Druid 2nd) + Circle of the Moon's Circle Forms/Combat Wild Shape/Elemental
// Wild Shape (2nd/2nd/10th). One modal covers both transforming and, once shapeshifted,
// reverting or (Moon only) healing via a spent spell slot — mirrors rageButtonClick's shape
// (a single entry point that branches on current state) rather than separate functions per state.
// Ki (Monk 2nd): Patient Defense and Step of the Wind (both self-only, no target needed —
// Flurry of Blows lives in the Use-menu's foe list instead, since it needs a target and (Open
// Hand) an on-hit technique choice) plus Wholeness of Body (6th, no ki cost, once/long rest).
// Paladin — Divine Sense, Lay on Hands, Channel Divinity (Sacred Weapon / Turn the Unholy),
// Holy Nimbus. One modal covering every resource-spending base/Devotion feature, mirroring
// openKiUI/openWildShapeUI's shape (self-contained, reads battleSession() for range checks).
// Lay on Hands: heal from the pool (any amount, capped at what's left) touching self or an
// adjacent connected player — the same self-vs-other-player round-trip shape Preserve Life
// already established (self applies locally, another player routes through the DM via the
// existing generic 'apply' message).
// Draconic Bloodline — Dragon Wings (14th) and Draconic Presence (18th). One small modal,
// same shape as openKiUI/openPaladinUI (self-contained, reads battleSession() for the AoE).

// damage, or an imposed condition) open map targeting. Teleportation spells open the
// destination picker below. Everything else (Wish, Fog Cloud, heals, buffs…) goes to

// reactive-interrupt system; spells resolve immediately when cast, so there's no "spell being
// cast right now" to hook into). Both collapse to the same real, useful outcome — strip a
// foe's magical conditions — rather than doing nothing, with the mismatch documented here

// Rolls the riders the player chose and mutates c's resource fields exactly like the single
// old inline copy did. `choices`={sneak,smiteLevel,divineStrike,colossus,hurl} (all optional).
// Returns {total, detail, doubled} — `total` is extra damage to ADD to the base roll; Death
// Strike is reported via `doubled` instead of folded into `total`, since it doubles the FULL
// final sum (base + every other rider), which only the caller (after adding `total` to its own
// base roll) is in a position to do.
// Great Weapon Master / Sharpshooter: -5 to hit for +10 damage. A choice made BEFORE the to-hit
// roll (not a damage-step rider like the others above), so it lives in its own small helper
// rather than attackRiderOptions/applyAttackRiders. Returns which feat applies for this attack
// (weapon type + property gated), or null if neither is eligible.
/* ---- multiclassing ----
   c.classes = [{cls, level, subclass}], in the order taken — c.classes[0] is the "primary"
   (starting) class. c.cls/c.subclass stay as plain aliases of c.classes[0], kept in sync by
   syncPrimaryClass, so every existing single-class-scoped system (proficiencies, saves,
   pendingChoiceSpecs, resource-pool formulas like Rage damage or Ki points, subclass-gated
   isX helpers) keeps working completely unchanged and stays correctly scoped to your PRIMARY
   class — this is a deliberate v1 boundary, not an oversight: RAW class FEATURES belong to
   whichever class granted them, and modeling that per-class for every one of the ~30 existing
   c.cls-gated formulas in this file is future work, not this pass. What multiclassing v1 makes
   correct: total character level (proficiency bonus, HP), each class's own hit dice, each
   class's own ASI progression, subclass selection captured per class (even if not yet acted on
   by isX helpers for non-primary classes), and — the mechanic multiclassing exists for — a
   correctly combined spell slot pool across your casting classes (see spellSlots).
   c.level remains a real, always-total field (kept in sync here too) so every existing
   `Number(c.level)` read for total-level things (profBonus, initiative, etc.) needs no change. */
// Single-class characters (the overwhelming majority, including every pre-existing test fixture
// and any code that sets c.level/c.subclass directly rather than through levelUp/syncPrimaryClass)
// always read the LIVE c.level/c.subclass fields here, never c.classes[0] — this makes classLevel
// immune to c.classes going stale relative to a directly-mutated c.level, at the cost of only
// consulting the real per-class breakdown once a character has verifiably taken levels in 2+
// classes (which only ever happens through levelUp's own class-array bookkeeping).
// "My own level in my primary class" — identical to Number(c.level)||1 for every single-class
// character (provable: with one class entry, its level IS the total), so substituting this in
// place of Number(c.level) anywhere already gated by c.cls==='X' is a no-op until you actually
// multiclass, at which point it becomes correct instead of silently reading your total level.
// Keeps c.cls/c.subclass/c.level in sync with c.classes[0]/total. For a single-class character
// (the overwhelming majority, including any code — tests included — that sets c.cls/c.level/
// c.subclass directly), the LIVE scalar fields are treated as authoritative and mirrored INTO
// classes[0], not the reverse — otherwise ensureFields (which calls this on every load) would
// silently clobber a direct field mutation back to whatever classes[0] happened to say. Only
// once a character has genuinely multiclassed (2+ entries — which only ever happens through
// levelUp's own class-array bookkeeping, always kept fresh) does c.classes become authoritative.
// Multiclassing ability-score prerequisites (PHB): 13 in the relevant score(s) to take your
// FIRST level in a class other than your starting one. Soft-checked only (a warning, not a
// hard block) in the level-up UI — DMs vary on enforcing this, and blocking outright would
// stop someone importing/reconstructing a character built under a different table's ruling.
const MULTICLASS_PREREQ = {
  Barbarian:['str'], Bard:['cha'], Cleric:['wis'], Druid:['wis'], Fighter:['str','dex'],
  Monk:['dex','wis'], Paladin:['str','cha'], Ranger:['dex','wis'], Rogue:['dex'],
  Sorcerer:['cha'], Warlock:['cha'], Wizard:['int'], Artificer:['int']
};

// total to spend, you just always roll your primary class's die size for all of them).

/* ---- spell list (curated SRD-ish; class letters A B C D P R S K W) ---- */
const SPELLS=[], SPELL_BY_NAME={};
Object.keys(SPELL_SRC).forEach(lvl=>{ SPELL_SRC[lvl].split('|').forEach(e=>{ const p=e.split(':'); const sp={n:p[0],l:Number(lvl),c:p[1],s:p[2]}; SPELLS.push(sp); SPELL_BY_NAME[p[0].toLowerCase()]=sp; }); });

// ---- the built-in tactical brain ----
BRAINS.tactical = function(qb, u){
  if(isIncapacitated(u)) return [];   // Asleep/Paralyzed/Banished… — it loses the turn
  // Party allies (summons + dominated) fight hostiles; hostiles fight PC + party allies
  const foes0 = isPartyAlly(u)
    ? qb.monsters.filter(m=>m.id!==u.id&&isHostile(m))
    : qb.players.filter(p=>p.c.hp.cur>0).concat(qb.monsters.filter(m=>m.id!==u.id&&isPartyAlly(m)));
  // A hidden PC (see maneuverHide) can't be targeted unless this unit's passive Perception beats
  // their Stealth total — otherwise every monster would just ignore Hide entirely.
  const foes = foes0.filter(f=>!(f.c && f.c.conditions && f.c.conditions.Hidden && monsterPassivePerception(u) < (f.c.hiddenDC||0)));
  if(!foes.length) return [];
  const atks=parseMonsterAttacks(u.atk).map(a=>({name:a.name, toHit:a.hit||0, dmg:a.dmg||'1d6', tiles:a.tiles||1, dtype:a.dtype, cond:a.cond})).filter(a=>true);
  const usable=atks.length?atks:[{name:'Attack',toHit:0,dmg:'1d6',tiles:1}];
  const dist=f=>gridDist(u.x,u.y,f.x,f.y);
  const canHitFrom=(x,y,f,a)=>{ const d=gridDist(x,y,f.x,f.y); if(d>a.tiles) return false; if(a.tiles>1) return losClear(qb,x,y,f.x,f.y); return true; };
  const blocked=(x,y)=> qb.monsters.some(m=>m.hp>0&&m.id!==u.id&&m.x===x&&m.y===y)||qb.players.some(p=>p.x===x&&p.y===y);
  // 1) can we attack someone right now? prefer the lowest-HP foe we can hit
  let best=null;
  foes.forEach(f=>usable.forEach(a=>{ if(canHitFrom(u.x,u.y,f,a)){ if(!best||qbHP(f)<qbHP(best.f)) best={f,a}; } }));
  if(best){ const out=[]; for(let k=0;k<(u.attacksLeft||1);k++) out.push({type:'attack', targetId:best.f.id, atk:best.a}); return out; }
  // 2) move to a cell from which we can attack the nearest foe, then attack
  const ufly=monsterFlies(u)||!!u.fly;
  const target=foes.slice().sort((a,b)=>dist(a)-dist(b))[0];
  const reach=reachableCells(qb, u.x, u.y, u.moveLeft||0, ufly, u);
  let spot=null, spotCost=1e9, spotAtk=null;
  Object.keys(reach).forEach(k=>{ const [x,y]=k.split(',').map(Number); if(blocked(x,y)) return;
    usable.forEach(a=>{ if(canHitFrom(x,y,target,a)){ const cost=reach[k]; if(cost<spotCost){ spot={x,y}; spotCost=cost; spotAtk=a; } } }); });
  if(spot){ const out=[{type:'move', to:spot}]; for(let k=0;k<(u.attacksLeft||1);k++) out.push({type:'attack', targetId:target.id, atk:spotAtk}); return out; }
  // 3) can't reach — step as close as possible toward the nearest foe (Dash if truly stuck)
  let stepTo=null, bestD=dist(target);
  Object.keys(reach).forEach(k=>{ const [x,y]=k.split(',').map(Number); if(blocked(x,y)) return; const d=gridDist(x,y,target.x,target.y); if(d<bestD){ bestD=d; stepTo={x,y}; } });
  if(stepTo) return [{type:'move', to:stepTo}];
  // truly stuck within normal move → Dash toward the foe (Restrained/Grappled: speed is 0, Dash gives nothing)
  if(speedBlocked(u)) return [];
  const reachD=reachableCells(qb, u.x, u.y, (u.moveLeft||0)+(u.speed||30), ufly, u); let dashTo=null, dd=dist(target);
  Object.keys(reachD).forEach(k=>{ const [x,y]=k.split(',').map(Number); if(blocked(x,y)) return; const d=gridDist(x,y,target.x,target.y); if(d<dd){ dd=d; dashTo={x,y}; } });
  if(dashTo) return [{type:'move', to:dashTo, dash:true}];
  return [];
};

// callback instead of hardcoding QB/qbLog, so the exact same function runs Quick Battle, a
// DM-controlled unit, and a connected player's own turn. Same principle as Engine.attack/
// Engine.castApply above: one resolver, adapter supplies the mode-specific plumbing.
// These only ever resolve a check the CALLER's device can compute locally — i.e. the actor
// is always fully known (it's whoever's device is running this code) and the target is
// always a monster (fully known everywhere via deriveMonsterAbilities — see checkSubject on
// each adapter). A maneuver against another real PLAYER's own PC (not currently exposed in
// any Use menu) would need the DM-prompt round-trip instead; these functions don't attempt it.
// Athletics vs the target's choice of Athletics/Acrobatics (PHB). Push moves the target
// 5 ft directly away; Prone knocks it down. Both cost one of the attacker's attacks (same
// budget as a weapon Attack — see qbSpendAttackBudget), matching the RAW "special melee
// attack" framing. Simplification: no size-category restriction (monsters in this project
// carry no size data — see AUDIT.md-style note in the skills-in-combat plan) and a push
// into an obstacle just stops at the last clear tile rather than dealing damage.
// `tiles` (default 1 = 5 ft, the normal Shove action's push distance) — Charger's shove
// option is the same opposed-check push, just 10 ft (2 tiles), so this takes a distance
// instead of a second near-duplicate function. `skipBudget`: Charger's shove spends the
// BONUS action (handled by its own caller before this runs), not the normal Action/attack
// economy qbSpendAttackBudget gates every other Shove call through — without this, a
// character who already spent their action on Dash would fail qbSpendAttackBudget's own
// "no action left" check even though Charger doesn't need one.
// Open Hand Technique (3rd): on a Flurry of Blows hit, impose ONE chosen effect. Each has its
// own save ability (PHB is explicit these differ: Dex for prone, Str for the push; "can't take
// reactions" has no save at all) against the monk's ki save DC. The "no reactions" option reuses
// the exact idiom Shocking Grasp's own "No Reactions" condition already established elsewhere
// in this file (`mo.reactionUsed=true` directly denies its NEXT reaction — same shape, not a
// new mechanism) rather than inventing a separate tracked condition.
// Quivering Palm (17th): 3 ki on an unarmed-strike hit starts the vibrations (tracked as
// `mo.quiveringPalmBy` — this app has no multi-day out-of-combat clock, so "within your next
// `level` days" is approximated as "until you end it or start a new one," matching how
// Intimidating Presence's 24-hour window is already approximated as encounter-length).
// Grapple (PHB): Athletics vs Athletics/Acrobatics; success applies Grappled (speed 0 —
// already handled generically by speedBlocked()). Tracks who grappled whom (mo.grappledBy)
// so Escape Grapple knows which side to contest against — this project doesn't otherwise
// track grapple ownership, so a monster-initiated grapple (from its own attack text, see
// parseMonsterAttacks) falls back to contesting the nearest adjacent hostile, documented
// as a simplification below. `mo.grappledBy` is a local-only marker (not synced over the
// network) — it's only ever read by the currently-unused monster-side Escape branch below.
// Taunt (Intimidation): not a core 5e action, but a well-understood variant built on the exact
// same opposed-check + impose-a-condition machinery Shove/Grapple already use — Intimidation
// (Cha) vs the target's Insight (Wis); success imposes Frightened (of the taunter) for a few
// rounds, same default-duration convention SPELL_COND already uses elsewhere. Costs one of
// your attacks, same resource class as Shove/Grapple in the same foe menu.
// Path of the Berserker — Intimidating Presence (10th level): action, DC 8+prof+Cha, targets a
// creature within 30 ft (6 tiles — wider than every other maneuver's adjacency-only range).
// A fixed-DC save against the TARGET's own Wisdom save bonus, not an opposed check like Taunt
// — ad.saveBonus is the exact same adapter method Sanctuary/Holy Aura already use for this
// shape. Success marks the target immune for the rest of THIS encounter — a documented
// approximation of the real 24-hour window (battles in this app don't span real hours).
// Escape a grapple as your action — the escaper rolls the better of Athletics/Acrobatics,
// contested by the grappler's Athletics (PHB); a tie favors the grappler (still grappled),
// which opposedCheck already gives us for free by rolling the grappler as the "attacker".
// `unit` is the grappled side (pc-shaped {c:...} or a monster). The `!isPc` (monster escaping
// a PC's grapple) branch is preserved but currently has no caller anywhere in the app — kept
// adapter-generic rather than deleted, since it's harmless and may get a caller later (e.g. AI).
// Hide (PHB): needs heavy obscurement (darkness) at your own tile, full cover from the
// nearest hostile, or — with the Skulker feat — just dim light. Success sets hiddenDC
// (your Stealth total): hostile monsters can't target you unless their passive
// Perception (monsterPassivePerception, CR-scaled like monsterSaveBonus) beats it (see
// BRAINS.tactical's foes filter), and your next attack gets advantage (attackAdvantage's
// 'Hidden' check) — cleared the moment you attack (qbResolveAttack) or use a maneuver.
// Recall Knowledge (DMG-style): an Intelligence check (Arcana/History/Nature/Religion —
// player's choice; MONSTERS_5E doesn't track creature type here, so there's no "correct"
// one to enforce) vs 10+CR reveals the target's resistances/vulnerabilities/immunities
// from MONSTER_RVI. Costs your action.
// Stabilize (PHB action): Medicine DC 10 on a creature at 0 HP that isn't dead yet. Success
// ends death saves without waking them or restoring HP. The target is a DOWNED ALLY —
// meaningless in solo Quick Battle (no second ally exists there) and, in player-net, that
// ally's real c.stable/death fields live only on THEIR OWN device, not the actor's — so this
// only ever computes the actor's own roll locally; the caller is responsible for delivering
// the result to the target (see the stabilize/stabilized net messages for player-net).
// Shared "does this downed ally still need stabilizing" predicate — a mirror-data-shaped
// {hpCur, stable, deathFail} check (see the Use menu's `allies` filter), kept as its own
// function so it stays unit-testable even though maneuverStabilize itself no longer touches
// a target object directly.
/** Weapon / spell attack vs a hazard barrel (no AC dance — objects don't dodge). */
// explicit Attack picker — monsters + hazard objects (barrels etc.)
// paint temporary terrain (Grease, etc.) onto the tiles a blast covers; remembers what
// was underneath so it can revert when the hazard expires (see expireHazards).
// Mode-agnostic — works on QB, a DM net.session, or any {map,battle,hazards}-shaped
// state — Grease/Web/gas hazards used to only paint terrain in Quick Battle; DM-hosted
// and player-net battles called a different function (applyFireBlastHazards, torches/
// barrels only) that never painted lasting terrain at all.
// Silence / Antimagic Field: a zone that blocks spellcasting for anyone inside, reusing the
// exact same s.hazards cell-tracking + expireHazards revert machinery as Grease/Web/gas —
// just with no terrain repaint (cells keep whatever floor they already had) and a `noCast`
// flag instead of a damage/condition one. Simplification: doesn't suppress EXISTING magical
// effects already active on creatures inside (Antimagic Field's other real effect) or
// distinguish somatic/verbal/material components (Silence RAW only blocks verbal) — both
// collapse to "can't cast at all while standing in it," the mechanically dominant case.
const SPELL_NOCAST_ZONE={'Silence':10, 'Antimagic Field':100};
// Antimagic Field's OTHER real effect (beyond blocking new casts, which inNoCastZone already
// covers): it suppresses already-active magical effects on anyone standing inside. Checked by
// name specifically — Silence shares the same noCast hazard shape but must never suppress a
// buff, only block new spellcasting.
/* ---- DM-placed traps ----
   A curated set of classic single-tile traps (not spell-created — a DM paints one onto the
   map before/during a fight, reusing the exact click-to-place brush pattern terrain/decor
   already use). Deliberately out of scope for v1: a passive-Perception "spot the trap"
   check (traps are simply invisible to players on the map until triggered — a real,
   named simplification, not modeled as findable/disarmable) and re-arming (each trap is
   strictly one-shot, matching the common case; RAW some traps CAN reset, most published
   ones don't bother, and this app doesn't need the added complexity for what's already a
   curated feature). s.traps = [{x,y,name,dmg,dtype,dc,ability,cond}], `triggered` added
   once sprung so the SAME find-by-cell lookup checkTrapTrigger uses also naturally skips
   an already-sprung trap without a separate "is this tile clear" bookkeeping pass. */
const TRAP_CATALOG = [
  {name:'Pressure Plate (darts)', dmg:'2d10', dtype:'piercing', dc:13, ability:'dex', cond:null},
  {name:'Spiked Pit', dmg:'2d6', dtype:'piercing', dc:13, ability:'dex', cond:'Prone'},
  {name:'Poison Needle Trap', dmg:'2d10', dtype:'poison', dc:15, ability:'con', cond:'Poisoned'},
  {name:'Fire Rune', dmg:'4d6', dtype:'fire', dc:15, ability:'dex', cond:null},
  {name:'Lightning Rune', dmg:'4d10', dtype:'lightning', dc:15, ability:'dex', cond:null},
];
// Direct resolution — used wherever this device already has the real stat block to roll
// against (QB always; DM-hosted for monsters, which live entirely in s.monsters).
// DM-hosted's player path — the DM has no local copy of a connected player's real ability
// scores/saves, so it can't roll for them (same reasoning as sendTerrainHazardCheck); it
// reuses that exact same 'hazard' net message the player's own device already knows how to
// resolve fully (save roll, damage, condition) — traps just populate the dmg field that
// terrain hazards leave empty (terrain damage is already handled by a separate branch at
// each of those call sites).
// Dex save or suffer a condition when a creature ends its move on hazardous terrain
// (Grease → Prone, Web → Restrained). Mode-agnostic, same reasoning as paintHazardTerrain.
/**
 * DM-hosted equivalent of checkTerrainHazardCond for a PLAYER specifically (monsters use
 * checkTerrainHazardCond directly — the DM has their full stat block). The DM only syncs
 * a player's hp/ac/conds summary, never ability scores, so it can't roll their Dex save
 * itself; sends a 'hazard' message and lets the player's own device resolve+report back
 * (same reasoning as tickGasHazards's DM-mode player branch).
 */
/**
 * Tick every gas hazard (Cloudkill, Insect Plague, Stinking Cloud) once per round: every
 * creature currently standing in its cells rolls a Con save against the DC stashed at
 * cast time (hz.dc) — on a fail, damage-cloud spells (hz has gs.dmg) deal full damage
 * (half on a save), no-damage clouds (Stinking Cloud) apply Poisoned instead. Simplified
 * to "once when the round advances" rather than each creature's own turn-start, so one
 * call site (alongside expireHazards) covers QB, DM, and player-net alike — see
 * AUDIT.md for why real Cloudkill's per-turn/on-entry timing and 10-ft/round drift
 * aren't modeled exactly.
 */
// Back-compat aliases — old QB-specific names, kept so nothing else needs updating.

/* reconnect when a backgrounded player tab regains focus / network */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && net && net.role==='player'){ try{ if(net.conn&&net.conn.open) return; }catch(e){} scheduleReconnect(); } });
window.addEventListener('online',()=>{ if(net && net.role==='player'){ try{ if(net.conn&&net.conn.open) return; }catch(e){} scheduleReconnect(); } });

/* ---- wiring ---- */
document.addEventListener('click',e=>{
  playClickSound(e.target);
  const cl=e.target.closest('[data-collapse]'); if(cl){ toggleCollapse(cl.dataset.collapse); return; }
  const af=e.target.closest('[data-aflow]'); if(af){ const c=cur(); if(c) attackFlow(c, {name:af.dataset.aname, toHit:Number(af.dataset.ahit)||0, dmg:af.dataset.admg||'1d4', dt:af.dataset.adt||'', vers:af.dataset.avers||'', offhand:af.dataset.offhand==='1'}); return; }
  const bdEl=e.target.closest('[data-bd]');
  if(bdEl){ const c=cur(); if(c) showBreakdown(c, bdEl.dataset.bd); return; }
  const rc=e.target.closest('[data-rollcheck]');
  if(rc){
    let mode='normal';
    const lab=String(rc.dataset.label||'').toLowerCase();
    if(/stealth/.test(lab)) mode=lightSkillMode(cur(),'stealth');
    else if(/perception/.test(lab)) mode=lightSkillMode(cur(),'perception');
    rollCheck(rc.dataset.label, Number(rc.dataset.bonus)||0, mode);
    if(mode!=='normal'){
      const s=battleSession();
      if(s) flashBanner((mode==='adv'?'⬆':'⬇')+' '+rc.dataset.label+' ('+lightLabel(tileLightLevel(s,(s.players&&s.players[0]&&s.players[0].x)||0,(s.players&&s.players[0]&&s.players[0].y)||0))+' light)');
    }
    return;
  }   // pure roll — weapon attacks spend resources via attackFlow, spells via castSpell
  const rd=e.target.closest('[data-rolldmg]');
  if(rd){ rollDmg(rd.dataset.label, rd.dataset.notation); return; }
  const si=e.target.closest('[data-spellinfo]'); if(si){ spellInfo(si.dataset.spellinfo); return; }
  const fi=e.target.closest('[data-featinfo]'); if(fi){ featInfo(fi.dataset.featinfo); return; }
  const bi=e.target.closest('[data-bginfo]'); if(bi){ bgInfo(bi.dataset.bginfo); return; }
  if(e.target.closest('#diceFab')){ openDiceTray(); return; }
  const t=e.target.closest('[data-tab]');
  if(t){ tab=t.dataset.tab; render(); }
  if(e.target.id==='welcomeNew'||e.target.id==='newChar') createCharacterFlow();
  if(e.target.id==='welcomeRandom') openRandomBuilder();
  if(e.target.id==='welcomeHost') dmHost();
  if(e.target.id==='welcomeJoin') openJoin();
  if(e.target.id==='appMenu') openAppMenu();
  if(e.target.id==='appSearch') openSearch();
});
$('#charSelect').addEventListener('change',e=>{ curId=e.target.value; localStorage.setItem(LS_CUR,curId); tab='char'; render(); });

/* ---- service worker (auto-update on new version) ---- */
// Must match sw.js CACHE suffix (grimoire-vXXX). Mismatch → install+claim → controllerchange → reload.
const APP_VERSION='v120.255';
{ const vb=document.getElementById('verBadge'); if(vb) vb.textContent=APP_VERSION; }
if('serviceWorker' in navigator){
  let _reloaded=false;
  // NEVER hard-reload during Quick Battle — QB lives only in memory, and skipWaiting+claim
  // mid-fight was kicking players back to the character sheet (had to "start again").
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded) return;
    // Defer while a fight (or the QB setup modal) is live — reload wipes in-memory QB.
    const busy=(typeof QB!=='undefined' && QB && QB.active)
      || !!document.getElementById('qbModal')
      || !!(net && net.session && net.session.battle && net.session.battle.active);
    if(busy){
      window.__swReloadPending=true;
      try{ flashBanner('Update ready — will apply when you leave battle'); }catch(e){}
      return;
    }
    _reloaded=true;
    location.reload();
  });
  // updateViaCache:'none' — without this, the browser applies normal HTTP caching to sw.js
  // itself (no-cache-header dev servers like `python -m http.server` make this worst-case:
  // the update *byte-compare* can silently run against a stale cached copy of sw.js, so a
  // bumped CACHE string never gets noticed and a hard refresh looks like it did nothing).
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{ if(reg.update) reg.update(); }).catch(()=>{}));
}

render();
</script>
