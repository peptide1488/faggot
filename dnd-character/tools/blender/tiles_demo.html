      // now somewhere else. Dropping it is the honest answer; remapping it would
      // be a walk the player never asked for.
      a.path=[];
    }
    // A spell in flight is dropped for the same reason, and it is a quarter of a
    // second of animation, not a decision anyone will miss.
    fx.length=0;
    // carry the props round with the world
    const rotE = e => ORDER[(ORDER.indexOf(e)+1)%4];
    for(const pp of propPlan){
      if(pp.kind==="torch"){ const ni=N-1-pp.j, nj=pp.i; pp.i=ni; pp.j=nj; pp.edge=rotE(pp.edge); }
      else { const nX=SH-1-pp.Y, nY=pp.X; pp.X=nX; pp.Y=nY;
             if(pp.ax) pp.ax = pp.ax==='x' ? 'y' : 'x'; }
    }
    buildDraws();
    rebuildComposite();
    refreshMoveRange();
    flash("view rotated");
  }

  // WHERE THE TIME GOES, per phase, so "loading is slow" can name the phase.
  // The status line said "loading tile images" for 21 of 22 seconds and the art
  // turned out to be 1.6s of it -- the label was simply the last one set.
  const PHASE={};
  const phase=(name,fn)=>{ const t=performance.now(); const r=fn();
                           PHASE[name]=+(performance.now()-t).toFixed(0); return r; };
  function build(){
    // Reseed rather than continue the stream: building twice with the same seed
    // has to give the same map, however many maps were made in between.
    reseed(SEED);
    seedBox.value = SEED;
    // Carry the whole scene in the address bar, not just the map: a link that
    // silently drops the actor count reproduces a DIFFERENT scene, which is how
    // the parameter came to be dropped in the first place.
    history.replaceState(null,"", "?set="+TILESET+"&seed="+SEED+
                                  "&goblins="+N_GOBLINS+"&who="+HERO_BODY);
    if(SOCKET_SET){
      // An outdoor set is a LANDSCAPE, not a dungeon: no rooms to carve, no doors
      // to dress, no rift to gouge and no elevation pass, because every one of
      // those is already a tile in the vocabulary. The solver output is the map.
      const out=phase('wfc',()=>socketWfc(W,H));
      if(!out){ status.textContent="socket WFC found no tiling"; return; }
      cells=out; RIFT_CELLS=cells; RIFT_W=W; RIFT_H=H;
      sqZ=null;                       // heights belong to the map about to be built
      passable=phase('squares',()=>buildSquares());
      window.__elevDebug={afterGen:{raised:cells.filter(c=>c.level===1).length,
                                    stairs:0}, stats:null, passes:[]};
      // The flood is computed INSIDE finishBuild for a landscape: what is reachable
      // depends on the height buffer, and that does not exist until the composite
      // has been drawn.
      return finishBuild(null);
    }
    const layout=genLayout(W,H);
    cells=layout.cells;
    RIFT_CELLS=cells; RIFT_W=W; RIFT_H=H;      // rimArt needs neighbour context
    const opened=layout.doors;
    // map-spanning features FIRST, so the plateau can avoid them
    addRift(cells,W,H,"pit", 2+(rnd()<0.35?1:0));   // a real gorge, not a crack
    if(rnd()<0.65) addRift(cells,W,H,"water", 1+(rnd()<0.5?1:0));
    normaliseCrossings(cells,W,H); enforceEdges(cells,W,H);
    ensureCrossings(cells,W,H); enforceEdges(cells,W,H);
    const stranded=undressStrandedOpenings(cells,W,H);   // AFTER the rift, or it can't see it
    const elevStats=addElevation(cells,W,H,layout.rooms);
    passable=buildSquares();
    window.__elevDebug={ afterGen:{
      raised:cells.filter(c=>c.level===1).length,
      stairs:cells.filter(c=>c.kind==="stairs").length }, stats:elevStats, passes:[] };

    // Elevation can strand large parts of the map: a plateau across a corridor
    // is a cliff, and a stair only helps if it lands somewhere you can already
    // get to. Flood from the best start and flatten whatever is still cut off,
    // repeating until nearly everything standable is connected. A dungeon you
    // cannot walk is worse than a flat one.
    const at2=(i,j)=>cells[j*W+i];
    let flood=null;
    for(let pass=0;pass<8;pass++){
      // Take the LARGEST component, not the highest-degree square. Picking by
      // degree once seeded the hero on a 3-tile plateau and called the other 737
      // squares unreachable -- he was stranded on an island in his own dungeon.
      const comp=new Int32Array(SW*SH).fill(-1);
      let best=null, tot=0;
      for(let Y0=0;Y0<SH;Y0++) for(let X0=0;X0<SW;X0++){
        if(!passable(X0,Y0,0,X0,Y0,0)) continue;
        tot++;
        if(comp[Y0*SW+X0]>=0) continue;
        const id=Y0*SW+X0, seen=new Set([id]), st=[id];
        comp[id]=id;
        while(st.length){
          const n=st.pop(), X=sqX(n), Y=sqY(n), L=sqL(n);
          for(const [dx,dy] of STEPS8){
            if(!canStep(X,Y,L,dx,dy,L)) continue;
            const m=(Y+dy)*SW+(X+dx);
            if(comp[m]<0){ comp[m]=id; seen.add(m); st.push(m); }
          }
        }
        if(!best||seen.size>best.seen.size) best={s0:id, seen};
      }
      if(!best) break;
      const seen=best.seen, s0=best.s0;
      flood={s0,seen,tot};
      if(seen.size>=tot*0.97) break;
      let changed=false;
      // FIRST try to connect the plateau rather than delete it. The old repair
      // flattened any raised tile outside the main component, which is why maps
      // kept coming out flat: a big plateau splits the low level, the flood
      // starts on whichever side is larger, and the whole feature got erased even
      // though its stairs worked perfectly. Cut a new stair in from the main
      // component instead, and only flatten if there is nowhere to put one.
      for(const c of cells){
        if(c.level!==1||c.kind) continue;
        const X=c.i*CELLS+1, Y=c.j*CELLS+1;
        if(seen.has(Y*SW+X)) continue;
        for(const nb of NEIGH){
          const ni=c.i+nb.di, nj=c.j+nb.dj;
          if(ni<0||ni>=W||nj<0||nj>=H) continue;
          const t=at2(ni,nj);
          if(!t||t.level!==0||t.kind) continue;
          const tX=ni*CELLS+1, tY=nj*CELLS+1;
          if(!seen.has(tY*SW+tX)) continue;      // must join the MAIN component
          c.walls.delete(nb.edge);
          t.kind="stairs"; t.dir=OPP[nb.edge]; openForStair(t,t.dir);
          changed=true;
          break;
        }
        if(changed) break;
      }
      if(!changed) for(const c of cells){
        if(!c.level && c.kind!=="stairs") continue;
        const X=c.i*CELLS+1, Y=c.j*CELLS+1;
        if(seen.has(Y*SW+X)) continue;
        c.level=0; if(c.kind==="stairs") c.kind="";
        changed=true;
      }
      // A pit can sever the dungeon just as a cliff can, and flattening plateaus
      // never fixes that. Fill any pit that touches a stranded region -- floor is
      // duller than a chasm, but a chasm you cannot get past is worse.
      for(const c of cells){
        if(!["pit","bridge","water","water_bridge"].includes(c.kind)) continue;
        let touchesOrphan=false, axis=null;
        for(const nb of NEIGH){
          const ni=c.i+nb.di, nj=c.j+nb.dj;
          if(ni<0||ni>=W||nj<0||nj>=H) continue;
          const X=ni*CELLS+1, Y=nj*CELLS+1;
          if(passable(X,Y,0,X,Y,0) && !seen.has(Y*SW+X)){
            touchesOrphan=true; axis = nb.di!==0 ? "x" : "y";
          }
        }
        if(!touchesOrphan) continue;
        // BRIDGE it rather than fill it. Filling erased every chasm and lake --
        // they are large enough to strand something almost every time, so the
        // repair was quietly deleting the features it was meant to preserve.
        // Span the FULL width of the rift, not one tile. A single bridged tile in
        // a 2-wide gorge does not reach the far side, so the map stayed cut and
        // the repair kept chewing until the gorge was one tile wide again.
        const fam = k => k==="bridge" ? "pit" : k==="water_bridge" ? "water" : k;
        const myFam = fam(c.kind);
        if(myFam==="pit" || myFam==="water"){
          // perpendicular to the rift, always -- using the orphan direction let
          // two crossings of the same chasm run at right angles to each other
          const spanAxis = bestSpanAxis(cells,W,H,c) || (c.riftHoriz ? "y" : "x");
          const step = spanAxis==="x" ? [1,0] : [0,1];
          for(const dir of [1,-1]){
            let i=c.i, j=c.j;
            while(true){
              const t=at2(i,j);
              if(!t || fam(t.kind)!==myFam) break;
              t.kind = myFam==="pit" ? "bridge" : "water_bridge";
              t.spanAxis = spanAxis;
              i+=step[0]*dir; j+=step[1]*dir;
            }
          }
        } else { c.kind=""; delete c.spanAxis; }    // already spanned and still cut
        changed=true;
        break;   // ONE crossing per pass, then re-flood.
      }
      window.__elevDebug.passes.push({pass, seen:seen.size, tot,
        raisedLeft:cells.filter(c=>c.level===1).length, changed});
      normaliseCrossings(cells,W,H); enforceEdges(cells,W,H);
      ensureCrossings(cells,W,H); enforceEdges(cells,W,H);
      if(!changed) break;
      passable=buildSquares();
    }
    // the contract is only worth having if it is checked
    const edgeErrors=checkEdges(cells,W,H);
    if(edgeErrors.length) console.error("EDGE CONTRACT VIOLATED",edgeErrors);
    window.__edgeErrors=edgeErrors.length;

    addOverpass(cells,W,H);
    // ---- decide where props go, then draw tiles and props in ONE painter pass.
    // A prop must be drawn immediately after its own tile: draw all tiles first
    // and props after, and a prop on a far tile lands on top of a nearer tile.
    return finishBuild(flood);
  }

  // Everything from prop placement onward is the same for a dungeon and a
  // landscape, so it is one function rather than two copies that drift.
  function finishBuild(flood){
    // COMPOSITE EXTENT. This lives here and not in the dungeon branch because it
    // is a fact about the LATTICE -- where the tiles land on screen and how much
    // padding the largest one needs -- and both kinds of map have a lattice. It
    // used to sit just above the dungeon's call to this function, which meant the
    // landscape path reached the compositor with CW and CH still undefined: the
    // canvases came out 0x0 and the map rendered as a black screen with a
    // perfectly correct tile layout behind it.
    const pts=cells.map(c=>[c.i*STEP_I[0]+c.j*STEP_J[0], c.i*STEP_I[1]+c.j*STEP_J[1]]);
    const minx=Math.min(...pts.map(p=>p[0])), maxx=Math.max(...pts.map(p=>p[0]));
    const miny=Math.min(...pts.map(p=>p[1])), maxy=Math.max(...pts.map(p=>p[1]));
    // OX/OY are the CENTRE of the tile at lattice origin, and the padding is the
    // largest tile in the set -- both so a taller-than-1024 tile has room.
    CW=(maxx-minx)+MAXR; CH=(maxy-miny)+MAXR; OX=-minx+MAXR/2; OY=-miny+MAXR/2;

    // Prop placement is DATA (which tile, which edge, which square), decided
    // once. The draw list is derived from it. That way rotating the view can
    // rotate the props with the world instead of re-rolling them somewhere else.
    propPlan=[];
    // Dungeon furniture on a landscape: a barrel in a meadow is wrong before it is
    // buggy, and outdoor scatter (trees, shrubs, boulders) is its own prop set that
    // does not exist yet. Torches are skipped for free -- they mount on walls, and
    // an outdoor tile has none.
    if(SOCKET_SET){
      // What grows where, by ROLE. Trees stay off the tracks -- a path with a tree
      // in it is not a path -- and off the transitions, where the ground is too
      // steep to root in and a trunk would hang off a cliff. Boulders are allowed
      // anywhere walkable, because a boulder does not care.
      // WHAT GROWS WHERE, by role. Cover is deliberately rarer than scatter --
      // a block you can hide behind is a tactical feature, and one per few tiles
      // is a battlefield while one per tile is a maze. The scale range matters as
      // much as the count: rocks, then shrub, then bush, then sapling, then tree
      // is what stops a meadow reading as grass with lollipops on it.
      const PLANT={ ground:[["tree",0.07],["pine",0.05],["sapling",0.05],
                            ["shrub",0.10],["bush",0.07],["rocks",0.08],
                            ["block",0.05],["boulder",0.04],["stump",0.02],
                            ["ruin",0.02]],
                    high_ground:[["pine",0.10],["tree",0.04],["shrub",0.09],
                                 ["bush",0.06],["rocks",0.07],["block",0.06],
                                 ["boulder",0.05],["ruin",0.03],
                                 ["entrance",0.02]],
                    wallow:[["shrub",0.09],["rocks",0.06],["stump",0.04]] };
      for(const c of cells){
        const table=PLANT[c.role];
        if(!table) continue;
        for(const [name,p] of table){
          if(rnd()>p) continue;
          if(!propImg[name]) continue;
          // Keep off the outermost square ring: a prop is drawn from its own centre
          // and a canopy hanging over the tile edge lands on whatever the neighbour
          // turns out to be, which may be a cliff face or open water.
          const k=1+((rnd()*(CELLS-2))|0), m=1+((rnd()*(CELLS-2))|0);
          propPlan.push({kind:"furn", X:c.i*CELLS+k, Y:c.j*CELLS+m, name, ax:null});
          break;                       // one thing per tile; a copse is not a hedge
        }
      }
    }
    for(const c of (SOCKET_SET ? [] : cells)){
      for(const e of c.walls){
        if(rnd()>0.30) continue;
        if(!propImg["torch_"+e]) continue;
        propPlan.push({kind:"torch", i:c.i, j:c.j, edge:e});
      }
      if(rnd()<0.34 && !c.kind){
        // Walls are WALL_T thick and sit INSIDE the tile, so the outer square row
        // on a walled edge is partly masonry -- a chest placed there ends up half
        // buried in the wall. Keep furniture off those rows.
        // (m=0 is the Y+ edge, because j increases toward -Y.)
        const k0 = c.walls.has("X-") ? 1 : 0, k1 = c.walls.has("X+") ? CELLS-2 : CELLS-1;
        const m0 = c.walls.has("Y+") ? 1 : 0, m1 = c.walls.has("Y-") ? CELLS-2 : CELLS-1;
        if(k1>=k0 && m1>=m0){
          const nm=FURNITURE[(rnd()*FURNITURE.length)|0];
          const wide = FURN_FOOT[nm][0]>1;
          const kMax = wide ? k1-1 : k1;                 // a 2-square prop needs room
          if(kMax>=k0){
            const k=k0+((rnd()*(kMax-k0+1))|0), m=m0+((rnd()*(m1-m0+1))|0);
            propPlan.push({kind:"furn", X:c.i*CELLS+k, Y:c.j*CELLS+m, name:nm,
                           ax: wide ? "x" : null});
          }
        }
      }
    }
    const draws=buildDraws();
    draws.sort((p,q)=> (p.d-q.d) || (p.o-q.o));
    lastDraws=draws;
    rebuildComposite(draws);
    // A black canvas has three possible causes -- no draws, a composite that came
    // out zero-sized, or one too big for the GPU -- and they are indistinguishable
    // from the outside. Publish the three numbers rather than guess between them.
    window.__drawDebug={draws:draws.length, CW, CH, MAXR,
                        missing:draws.filter(d=>!d.img).length};

    if(SOCKET_SET){
      buildSquareHeights();
      passable=buildSquares();
      flood=floodFrom();
      // AND LET THE FULL-RESOLUTION HEIGHT BUFFER GO. It exists to fill sqZ and
      // sqSlope -- one float per SQUARE, 48x48 of them, nine kilobytes -- and
      // after that nothing reads it: squareZ and slopeUnder use the arrays, and
      // the shader has its own copy on the GPU. Retaining the ImageData was 147MB
      // of a 12x12 map's ~1GB, held for a lookup table that had already been
      // built. A re-composite makes it again if it is ever needed.
      hgtData=null;
    }
    gl.uniform1i(U("uAlb"),0); gl.uniform1i(U("uNrm"),1);
    gl.uniform1i(U("uHgt"),2); gl.uniform1i(U("uSpr"),3);
    gl.uniform1i(U("uSprNrm"),4); gl.uniform1i(U("uSprHgt"),5);
    gl.uniform1i(U("uAlb1"),6); gl.uniform1i(U("uNrm1"),7); gl.uniform1i(U("uHgt1"),8);
    gl.uniform2f(U("uRes"),CW,CH); gl.uniform2f(U("uOrigin"),OX,OY);
    gl.uniform1f(U("uPPU"),PPU); gl.uniform1f(U("uHoff"),HEIGHT_OFF); gl.uniform1f(U("uHrange"),HEIGHT_RANGE);
    gl.uniform1f(U("uCam"),CAM_DIST);

    // start on the most-connected square
    // start in the largest connected component, decided by the repair pass above
    const start = flood ? flood.s0 : 0;
    hero=newActor(HERO_BODY,start);
    actors=[hero]; fx=[];
    const seen=new Set([start]), st=[start];
    while(st.length){
      const n=st.pop(), X=sqX(n), Y=sqY(n), L=sqL(n);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        for(const L2 of [L,1-L]){              // include the climb to layer 1
          if(!passable(X,Y,L,X+dx,Y+dy,L2)) continue;
          const m=sqId(X+dx,Y+dy,L2);
          if(!seen.has(m)){ seen.add(m); st.push(m); }
        }
      }
    }
    reach=[...seen];
    // ?goblins=N -- how crowded the map starts. A slot in the sprite atlas costs
    // per-pixel shader work whether or not anything is standing in it, so this is
    // the knob a performance measurement turns, not just a difficulty setting.
    spawnGoblins(N_GOBLINS);
    const nUp=cells.filter(c=>c.level===1).length,
          nSt=cells.filter(c=>c.kind==="stairs").length,
          nPit=cells.filter(c=>c.kind==="pit").length,
          nBr=cells.filter(c=>c.kind==="bridge").length;
    status.innerHTML="WFC <b>"+W+"x"+H+"</b> tiles · reachable <b>"+seen.size+"</b>/"+
      ((flood&&flood.tot)||(SW*SH))+" standable"+
      "<br>elevation: raised <b>"+nUp+"</b> · stairs <b>"+nSt+"</b> · pit <b>"+nPit+
      "</b> · bridge <b>"+nBr+"</b> · water <b>"+cells.filter(c=>c.kind==="water"||c.kind==="water_bridge").length+"</b>";
    return true;
  }

  // ---- sprites: one atlas, eight slots ------------------------------------
  // The hero used to own the only sprite slot in the shader. A fight has several
  // things in it, and giving each a uniform set of its own would have been the
  // parallel-copy mistake -- so there is ONE atlas of NSPR cells, the hero is
  // slot 0, and a goblin, a fireball and the wizard go through identical code.
  // Cells are uploaded with texSubImage2D when an actor changes frame, never
  // per frame wholesale: the atlas is 4.7 MB per buffer and re-uploading three
  // of those at 60fps is not a thing a browser will do.
  const ATL_W=ATL_COLS*CELL_RES, ATL_H=ATL_ROWS*CELL_RES;
  const atlasTex=[], atlasHeld=new Array(NSPR).fill(null);
  for(let u=0;u<3;u++){
    const t=gl.createTexture();
    gl.activeTexture(gl.TEXTURE0+3+u); gl.bindTexture(gl.TEXTURE_2D,t);
    // Same rule the tiles follow: colour NEAREST (crunchy), normal and height
    // LINEAR, because they are data and point-sampling them makes the depth
    // test and the lighting jitter at every texel edge.
    const f=u===0 ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,ATL_W,ATL_H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    atlasTex.push(t);
  }
  function blit(i,tri){
    if(atlasHeld[i]===tri) return;
    const x=(i%ATL_COLS)*CELL_RES, y=((i/ATL_COLS)|0)*CELL_RES, src=[tri.a,tri.n,tri.h];
    for(let u=0;u<3;u++){
      gl.activeTexture(gl.TEXTURE0+3+u); gl.bindTexture(gl.TEXTURE_2D,atlasTex[u]);
      gl.texSubImage2D(gl.TEXTURE_2D,0,x,y,gl.RGBA,gl.UNSIGNED_BYTE,src[u]);
    }
    atlasHeld[i]=tri;
  }

  // Which image an actor is showing. An action that has not finished loading
  // falls back to the walk cycle rather than to nothing, so a click during the
  // first second of the page produces a lunge late, not a hole in the map.
  function actorFrame(a){
    const body=ACT[a.body]; if(!body) return null;
    const set=body[a.action]||body.walk; if(!set) return null;
    const fr=set[a.dir];
    return fr[Math.min(a.frame|0, fr.length-1)];
  }
  function spriteRect(o){
    // image centre == the model's feet, and the render used the same PPU, so
    // this is 1:1. Standing on a raised tile lifts it up-screen by its world Z,
    // exactly the way the projection lifts a wall of that height.
    const [sx,sy]=worldToScreen(o.wx,o.wy), w=(o.res||ACT_RES)*(o.k||1);
    return [sx-w/2, sy-w/2 - (o.z||0)*COS30*PPU, w, w];
  }
  const spRect=new Float32Array(NSPR*4), spAtlas=new Float32Array(NSPR*4),
        spMeta=new Float32Array(NSPR*4);
  let lastSlots=0;
  function syncSprites(){
    // SOLID FIRST. The shader makes one pass over the slots, settling the depth
    // of every solid as it goes, so an emitter must not appear before one --
    // it is tested against a zBest that has to be final. Effects are guaranteed
    // room even in a crowd, because the actor list is trimmed to leave it.
    const solid=[];
    for(const a of actors){
      const t=actorFrame(a);
      if(t) solid.push({t, wx:a.wx, wy:a.wy, z:a.z||0, res:ACT_RES,
                        d:(a.wx-hero.wx)**2+(a.wy-hero.wy)**2});
    }
    solid.sort((p,q)=>p.d-q.d);                    // the hero is his own zero
    const emit=[];
    for(const e of fx){
      const set=FXIMG[e.name]; if(!set) continue;
      emit.push({t:set[Math.min(e.frame|0,set.length-1)], wx:e.wx, wy:e.wy, z:e.z,
                 k:e.k, rot:e.rot, add:fxBurn(e), res:FX_RES});
    }
    const list=solid.slice(0,NSPR-Math.min(emit.length,2)).concat(emit).slice(0,NSPR);
    for(let i=0;i<list.length;i++){
      const o=list[i];
      blit(i,o.t);
      const [rx,ry,rw,rh]=spriteRect(o);
      spRect.set([rx,ry,rw,rh], i*4);
      // The sub-rect is the sprite's OWN size inside its cell, not the whole
      // cell: a 384 actor in a 512 cell would otherwise sample 128 px of
      // whatever image sits next to it.
      spAtlas.set([(i%ATL_COLS)*CELL_RES/ATL_W, ((i/ATL_COLS)|0)*CELL_RES/ATL_H,
                   (o.res||ACT_RES)/ATL_W, (o.res||ACT_RES)/ATL_H], i*4);
      // meta.zw is the sample rotation with the rect's oversize folded in, so a
      // bolt baked along +X can be pointed anywhere without its corners clipping.
      const c=Math.cos(o.rot||0)*(o.k||1), s=Math.sin(o.rot||0)*(o.k||1);
      spMeta.set([o.z||0, o.add||0, c, s], i*4);
    }
    // Stale slots must be CLEARED, not left: the shader reads uNSpr slots and a
    // rect left behind from a busier frame draws a corpse that is not there.
    for(let i=list.length;i<lastSlots;i++) spRect.set([0,0,0,0], i*4);
    lastSlots=Math.max(lastSlots, list.length);
    gl.uniform4fv(U("uSpRect[0]"),spRect);
    gl.uniform4fv(U("uSpAtlas[0]"),spAtlas);
    gl.uniform4fv(U("uSpMeta[0]"),spMeta);
    gl.uniform1f(U("uNSpr"),list.length);
    // Only slot 0 -- the actor nearest the hero, which is the hero himself
    // whenever he is on screen -- casts. See the note in occluded().
    gl.uniform1f(U("uNCast"),Math.min(1,solid.length));
  }

  // ---- actors --------------------------------------------------------------
  // One step function for every body on the map. The hero is actors[0] and is
  // not a special case: he differs only in being the one the click handler
  // gives a path to, and in `wander` being a checkbox instead of always on.
  function play(a,action){
    if(a.dead) return;
    if(!(ACT[a.body]&&ACT[a.body][action])){    // not loaded yet -- start when it is
      loadAction(a.body,action).then(()=>play(a,action));
      return;
    }
    a.action=action; a.t=0; a.frame=0; a.path=[];
    if(action==="death") a.dead=true;
  }
  function stepActor(a,dt){
    a.moving=false;
    // A one-shot action OWNS the actor until it ends: no walking mid-swing, and
    // nothing re-aims him. hold_last is why a death stays dead -- a death that
    // loops is a resurrection.
    if(a.action!=="walk"){
      const n=ACTMAN.actions[a.action]||1;
      a.t+=dt*ACT_FPS;
      if(a.t<n){ a.frame=Math.floor(a.t); return; }
      if(ACTMAN.hold_last.indexOf(a.action)>=0){ a.frame=n-1; return; }
      a.action="walk"; a.t=0; a.frame=0;
    }
    if(a.dead) return;
    if(!a.path.length){
      if(!a.wander || !reach.length) return;
      const t=reach[(Math.random()*reach.length)|0];
      if(t!==a.sq) a.path=bfsSq(a.sq,t);
      if(!a.path.length) return;
    }
    const X=sqX(a.path[0]), Y=sqY(a.path[0]), L=sqL(a.path[0]);
    const [tx,ty]=sqWorld(X,Y);
    const tz=squareZ(X,Y,L);
    const dx=tx-a.wx, dy=ty-a.wy, d=Math.hypot(dx,dy), spd=(a.speed||3.2)*dt;
    a.z += (tz-(a.z||0))*Math.min(1,dt*8);           // ease up the treads
    if(d<=spd){ a.wx=tx; a.wy=ty; a.z=tz; a.sq=a.path.shift(); }
    else{
      a.wx+=dx/d*spd; a.wy+=dy/d*spd;
      a.dist=(a.dist||0)+spd; a.moving=true;
      a.dir=faceDir(dx,dy);
    }
    // Frame is driven by DISTANCE WALKED, not by a timer: tie it to the clock
    // and he slides whenever speed and cycle rate disagree.
    const n=ACTMAN.actions.walk;
    a.frame = (a.path.length||a.moving)
      ? Math.floor((a.dist||0)/STRIDE_WORLD*n) % n : 0;
  }
  // World delta -> the screen direction its art was baked for. Screen, not
  // world: the art faces the camera, and the camera is what rotates on Q/E.
  function faceDir(dx,dy){
    const [ax,ay]=worldToScreen(0,0), [bx,by]=worldToScreen(dx,dy);
    const a=Math.atan2(by-ay,bx-ax);
    return DIRS[((Math.round(a/(Math.PI/4))%8)+8)%8];
  }
  function newActor(body,sq,opt){
    // A body that walks onto the map fetches WHAT IT NEEDS TO BE DRAWN, which is
    // walk and nothing else. Until it lands, actorFrame returns null and
    // syncSprites skips the slot -- the actor is simply not drawn for a moment,
    // which is the same thing that already happens for an action that has not
    // arrived.
    //
    // This called ensureBody, i.e. every action in all eight directions, for
    // every actor the moment it was created -- so spawning a wizard and two
    // goblins pulled 1441 files and 94.7 MB before anything had been clicked.
    // The attack and death sets arrive on the idle prefetch, or on demand from
    // play() if something swings first.
    loadAction(body, "walk");
    const [wx,wy]=sqWorld(sqX(sq),sqY(sq));
    return Object.assign({body, sq, wx, wy, z:squareZ(sqX(sq),sqY(sq),sqL(sq)),
                          dir:"south", action:"walk", frame:0, t:0, path:[],
                          hp:3, dead:false, wander:false}, opt||{});
  }
  function spawnGoblins(n){
    for(let k=0;k<n && reach.length;k++){
      // Not on top of the hero: a goblin that starts inside him is invisible
      // until one of them moves, which reads as the spawn having failed.
      let sq=null;
      for(let tries=0;tries<40;tries++){
        const s=reach[(Math.random()*reach.length)|0];
        const [wx,wy]=sqWorld(sqX(s),sqY(s));
        if(Math.hypot(wx-hero.wx,wy-hero.wy)>3){ sq=s; break; }
      }
      if(sq===null) continue;
      // A MIXED BAND, from whatever was baked. An ogre is slower and tougher
      // than a kobold and the numbers say so, so a fight is not four copies of
      // one thing at four positions.
      const pool=(ACTMAN.monsters&&ACTMAN.monsters.length)?ACTMAN.monsters:["goblin"];
      const body=pool[(Math.random()*pool.length)|0];
      const big=/ogre|troll/.test(body), small=/kobold|goblin/.test(body);
      actors.push(newActor(body,sq,{wander:true,
                                    speed: big?1.9 : small?2.6 : 2.3,
                                    hp: big?5 : small?2 : 3}));
    }
  }

  // ---- effects -------------------------------------------------------------
  // A cast is: an animation at a place, a point light while it burns, and
  // whatever it does to whoever is standing there. The first two are this
  // function; the third is the caller's business.
  function cast(name,wx,wy,z,fromWx,fromWy){
    if(!FXIMG[name]) return null;
    const def=FXDEF[name]||{};
    const e={name, wx, wy, z:(z||0)+(def.z||0), t:0, frame:0, k:1, rot:0};
    if(def.aimed && fromWx!==undefined){
      // AN AIMED EFFECT FLIES. It is baked as a streak along world +X, so it is
      // pointed by rotating the SAMPLE in screen space -- the art is a 2D image
      // from a fixed camera, so the honest rotation is the one the viewer sees --
      // and the rect grows by root-2 so the corners survive the turn.
      //
      // It used to be parked at the MIDPOINT for its whole life, which is why it
      // never looked like it came from the caster: the dart's only travel was
      // the couple of units the bake animates within its own frame, so on any
      // throw longer than that it simply appeared in the middle of the gap. It
      // carries its endpoints now and stepEffects walks it across them, so it
      // leaves the hand and arrives at the target however far away that is.
      const [ax,ay]=worldToScreen(0,0), [bx,by]=worldToScreen(1,0);
      const [cx,cy]=worldToScreen(fromWx,fromWy), [dx2,dy2]=worldToScreen(wx,wy);
      e.rot=Math.atan2(dy2-cy,dx2-cx)-Math.atan2(by-ay,bx-ax);
      e.k=1.42;
      // start AT the caster, a little in front of him so it reads as thrown
      // rather than as growing out of his chest
      const d=Math.hypot(wx-fromWx, wy-fromWy) || 1;
      e.fromX=fromWx+(wx-fromWx)/d*0.45; e.fromY=fromWy+(wy-fromWy)/d*0.45;
      e.toX=wx; e.toY=wy;
      e.wx=e.fromX; e.wy=e.fromY;
    }
    fx.push(e);
    return e;
  }
  // How brightly an effect burns at its current frame. ONE curve, used by both
  // the sprite and the light it throws: they are the same flash, and a blast
  // whose glow fades while its art stays at full strength reads as a decal.
  // Peaks early and dies with the smoke -- a flash that ends on full is a lamp
  // being switched off.
  function fxBurn(e){
    const n=FXMAN.effects[e.name], u=Math.min(1,e.t/Math.max(1,n-1));
    return Math.max(0.06, Math.sin(Math.min(1,u*1.9)*Math.PI*0.85)*(1-u*0.55));
  }
  function stepEffects(dt){
    for(let i=fx.length-1;i>=0;i--){
      const e=fx[i];
      e.t+=dt*ACT_FPS;
      const n=FXMAN.effects[e.name];
      if(e.t>=n){ fx.splice(i,1); continue; }
      e.frame=Math.floor(e.t);
      if(e.toX!==undefined){
        // Across the gap over its own lifetime. Eased out at the end so it
        // arrives rather than stopping dead: the last frames of the bake are the
        // dart striking, and they should land on the target, not short of it.
        const u=Math.min(1, e.t/Math.max(1,n-1));
        const k=1-(1-u)*(1-u);
        e.wx=e.fromX+(e.toX-e.fromX)*k;
        e.wy=e.fromY+(e.toY-e.fromY)*k;
      }
    }
  }

  // ---- fighting ------------------------------------------------------------
  // Impacts land PART WAY THROUGH the swing, so they need to happen later than
  // the click. On the frame clock, not setTimeout: a backgrounded tab throttles
  // timers but stops rendering too, and a blow that lands while nothing is
  // drawing is a goblin that dies off-screen between two frames.
  const soon=[];
  const after=(secs,fn)=>soon.push({t:secs,fn});
  function stepPending(dt){
    for(let i=soon.length-1;i>=0;i--)
      if((soon[i].t-=dt)<=0){ const f=soon[i].fn; soon.splice(i,1); f(); }
  }
  const REACH=1.9;                                  // world units; ~a square and a half
  const dist2=(a,b)=>(a.wx-b.wx)**2+(a.wy-b.wy)**2;

  // The actor nearest a click, in SCREEN space. His own sprite rect is the
  // hitbox, shrunk to the middle of it -- a 384px cell is mostly empty air
  // around a figure, and a full-cell hitbox swallows clicks on the ground beside
  // him. Live actors only: a corpse is scenery and you can walk over it.
  function pickActor(cx,cy){
    let best=null, bestD=Infinity;
    for(const a of actors){
      if(a.dead) continue;
      const [sx,sy]=worldToScreen(a.wx,a.wy);
      const y=sy-(a.z||0)*COS30*PPU;
      const dx=cx-sx, dy=cy-(y-ACT_RES*0.22);       // aim at the chest, not the feet
      if(Math.abs(dx)>ACT_RES*0.22 || Math.abs(dy)>ACT_RES*0.30) continue;
      const d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=a; }
    }
    return best;
  }

  function damage(tgt,n){
    tgt.hp-=(n||1);
    // hold_last is why the death sticks. Playing "hit" on a corpse would rewind
    // it to standing, which is the same bug as a looping death animation.
    play(tgt, tgt.hp<=0 ? "death" : "hit");
    if(tgt.hp<=0) flash(tgt.body+" down");
  }
  function heroAttack(tgt){
    if(hero.dead||tgt.dead) return;
    if(dist2(hero,tgt)>REACH*REACH){
      // Walk into reach and swing on arrival. Storing the intent rather than
      // refusing the click is the difference between a game and a diagram.
      const p=pathToward(hero.sq,sqX(tgt.sq),sqY(tgt.sq),sqL(hero.sq));
      if(!p.length){ flash("no way to reach it"); return; }
      hero.path=p.slice(0,Math.max(1,p.length-1));
      hero.intent={attack:tgt};
      return;
    }
    hero.intent=null;
    hero.dir=faceDir(tgt.wx-hero.wx, tgt.wy-hero.wy);
    play(hero,"attack");
    after(0.28,()=>{ if(!tgt.dead && dist2(hero,tgt)<=(REACH+0.6)**2) damage(tgt,1); });
  }
  function heroCast(name,wx,wy,z,tgt){
    if(hero.dead) return;
    hero.intent=null;
    hero.path=[];
    hero.dir=faceDir(wx-hero.wx, wy-hero.wy);
    play(hero,"attack");                            // the cast is the same gesture
    after(0.20,()=>{
      cast(name,wx,wy,z,hero.wx,hero.wy);
      // Splash. heal is the one that helps, which is the cheapest possible way
      // to prove the damage path and the effect are not the same switch.
      // A shot hits WHAT IT WAS AIMED AT. A blast has a radius; an arrow has a
      // point, and giving it one anyway meant it clipped whatever happened to be
      // standing near the target as well.
      const R = name==="fireball" ? 2.6 : name==="frost" ? 2.0
              : name==="arrow" ? 0.6 : 1.2;
      for(const a of actors){
        if(a.dead || (a===hero && name!=="heal")) continue;
        if((a.wx-wx)**2+(a.wy-wy)**2 > R*R) continue;
        if(name==="heal"){ a.hp=Math.min(3,a.hp+1); continue; }
        damage(a, name==="fireball" ? 2 : 1);
      }
      if(tgt && tgt.dead===false && name!=="heal" && (tgt.wx-wx)**2+(tgt.wy-wy)**2>R*R)
        damage(tgt,1);                              // a bolt hits what it was aimed at
    });
  }
  // Walked-into-reach: the swing the click asked for, fired when the walk ends.
  function checkIntent(){
    const it=hero.intent;
    if(!it||!it.attack) return;
    if(it.attack.dead){ hero.intent=null; return; }
    if(hero.path.length) return;
    if(dist2(hero,it.attack)<=(REACH+0.4)**2) heroAttack(it.attack);
    else hero.intent=null;                          // it moved; do not chase forever
  }

  const amb=document.getElementById("amb"), rng=document.getElementById("rng"),
        mode=document.getElementById("mode"), zoom=document.getElementById("zoom"),
        shd=document.getElementById("shd"), pix=document.getElementById("pix"),
        bits=document.getElementById("bits"), dith=document.getElementById("dith"),
        bands=document.getElementById("bands"), bdith=document.getElementById("bdith"),
        ss=document.getElementById("ss"), water=document.getElementById("water"),
        daylight=document.getElementById("daylight"),
        sun=document.getElementById("sun"), sunang=document.getElementById("sunang"),
        sunel=document.getElementById("sunel"), suncol=document.getElementById("suncol"),
        ambcol=document.getElementById("ambcol"), fog=document.getElementById("fog"),
        fogcol=document.getElementById("fogcol"), fogtop=document.getElementById("fogtop"),
        watcol=document.getElementById("watcol"),
        seedBox=document.getElementById("seed");
  // DAYLIGHT. The lighting model here is a dungeon's: near-black ambient plus a
  // handful of point lights, which is exactly wrong outdoors -- a meadow at noon
  // has one enormous light source and no torches at all. This is not a new shader
  // pass, it is a preset: ambient to full, torches off. It works because the bake
  // carries its own shading in the albedo (see build_tiles.py's add_lighting), so
  // a flat-lit outdoor tile is not flat-looking, it is just not lit twice.
  // Defaults ON for a socket set, which is what an outdoor set is, and OFF for a
  // dungeon -- so neither kind of map opens looking wrong.
  const NIGHT={amb:18, rng:150, shd:80};
  function applyDaylight(on){
    if(on){ amb.value=52; rng.value=rng.min; shd.value=60; sun.value=85;
            sunel.value=38; suncol.value="#fff0cc"; ambcol.value="#8899cc";
            fog.value=6;  fogcol.value="#a8bccc"; }
    else  { amb.value=NIGHT.amb; rng.value=NIGHT.rng; shd.value=NIGHT.shd; sun.value=0;
            sunel.value=38; suncol.value="#ffd9a0"; ambcol.value="#5566aa";
            fog.value=8;  fogcol.value="#0d1016"; }
    for(const el of [amb,rng,shd,sun,sunel,fog]) el.dispatchEvent(new Event("input",{bubbles:true}));
  }
  daylight.checked = SOCKET_SET;
  daylight.onchange = () => { applyDaylight(daylight.checked);
                              flash(daylight.checked?"daylight":"torchlight"); };
  applyDaylight(daylight.checked);
  let mouse=[6,-6], frozen=false, clock=0, paused=false;

  function drawGL(){
    syncSprites();
    // THE VISIBLE TILES, REDRAWN. Cheap enough to do every frame -- it is a few
    // dozen textured quads -- which is what makes panning and zooming free:
    // there is no map-sized buffer to rebuild when the view moves.
    if(useGBuf() && lastDraws){
      try{
        gRender(lastDraws);
      }catch(e){
        // Fall back for good, and rebuild what the composite path needs -- it
        // was never built, because this path said it would not be needed.
        fail("gbuffer", e);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.uniform1f(U("uGBuf"),0);
        rebuildComposite();
        drawGL();
        return;
      }
      // gRender leaves its own program and vertex buffer bound.
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(al);
      gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
      for(let k=0;k<3;k++){
        gl.activeTexture(gl.TEXTURE0+k);
        gl.bindTexture(gl.TEXTURE_2D, gLo.tex[k]);
        gl.activeTexture(gl.TEXTURE0+6+k);
        gl.bindTexture(gl.TEXTURE_2D, gUp.tex[k]);
      }
      gl.uniform1f(U("uGBuf"),1);
      gl.uniform2f(U("uGOrg"), gOrgX, gOrgY);
      gl.uniform2f(U("uGSize"), gW, gH);
      gl.uniform1f(U("uGScale"), gScale);
    }else{
      gl.uniform1f(U("uGBuf"),0);
    }
    gl.uniform1f(U("uAmb"),amb.value/100);
    // Sun direction in WORLD space, matching the light positions the torches use.
    // Elevation is fixed at a late-afternoon 38 degrees: high enough that flat
    // ground is clearly lit, low enough that a scarp throws a shadow you can see.
    {
      const a=sunang.value*Math.PI/180, el=sunel.value*Math.PI/180;
      gl.uniform3f(U("uSunDir"), Math.cos(a)*Math.cos(el), Math.sin(a)*Math.cos(el),
                   Math.sin(el));
      // Warm by default, and paired with a cool sky. EQUAL-TEMPERATURE sun and
      // fill is what makes a render look like a product shot rather than a place,
      // so both are pickable and the defaults are deliberately not the same hue.
      const k=sun.value/100, c=tint(suncol.value);
      gl.uniform3f(U("uSunCol"), k*c[0], k*c[1], k*c[2]);
      const ac=tint(ambcol.value);
      gl.uniform3f(U("uAmbCol"), ac[0], ac[1], ac[2]);
      const fc=hex3(fogcol.value);
      gl.uniform3f(U("uFogCol"), fc[0], fc[1], fc[2]);
      gl.uniform1f(U("uFog"), fog.value/100);
      gl.uniform1f(U("uFogHeight"), parseFloat(fogtop.value)/10);
    }
    gl.uniform1f(U("uShadow"),shd.value/100);
    gl.uniform1f(U("uWater"),water.value/100);
    // The slider IS the level -- read every frame, written back to WATER_SURFACE
    // so the pathfinder and the shader cannot disagree about where the shore is.
    WATER_SURFACE=parseFloat(wlev.value)/100;
    wlevout.textContent=" "+WATER_SURFACE.toFixed(2);
    gl.uniform1f(U("uWaterZ"),WATER_SURFACE);
    gl.uniform1f(U("uWaterFloor"),WATER_FLOOR);
    { const w=tint(watcol.value);
      gl.uniform3f(U("uWaterCol"), w[0], w[1], w[2]); }
    gl.uniform1f(U("uWaterClear"), wclear.value/100);
    gl.uniform1f(U("uMaxH"),sceneMaxH);
    gl.uniform1f(U("uTime"),clock);
    gl.uniform1f(U("uMode"),parseFloat(mode.value));
    // Slot 0 is his staff gem (not his chest -- a light at his own position blows
    // the model flat and hides the normals). Slot 1 is the mouse. The rest are
    // wall torches, sorted by distance to him: there are only 8 slots and, under
    // inverse-square falloff, the far ones contribute almost nothing anyway.
    const lights=[
      {p:[hero.wx+0.45,hero.wy+0.45,1.5+(hero.z||0)], c:[1.25,0.85,0.48], r:rng.value/10},
      {p:[mouse[0],mouse[1],3.0],         c:[0.35,0.55,1.15], r:9.0}
    ];
    // A LIVE SPELL IS A LIGHT. The effect sprite is emissive and gets ADDED to
    // the frame, which makes it bright but leaves the room it went off in dark --
    // and a fireball that lights nothing reads as a decal on the glass. These go
    // in before the torches so a blast always gets a slot: it is the thing the
    // eye is on. Brightness follows the animation, peaking early and dying with
    // the smoke, because a flash that ends on full is a lamp switching off.
    for(const e of fx){
      const def=FXDEF[e.name]; if(!def) continue;
      const k=fxBurn(e);
      lights.push({p:[e.wx,e.wy,(e.z||0)+0.8],
                   c:def.light.map(v=>v*k), r:def.r});
    }
    torches.map(t=>({t,d:(t[0]-hero.wx)*(t[0]-hero.wx)+(t[1]-hero.wy)*(t[1]-hero.wy)}))
           .sort((a,b)=>a.d-b.d).slice(0,6)
           .forEach(({t})=>lights.push({p:t, c:[1.5,0.82,0.34], r:8.0}));
    const NL=Math.min(8,lights.length);
    for(let k=0;k<NL;k++){
      gl.uniform3fv(U("uLp["+k+"]"),lights[k].p);
      gl.uniform3fv(U("uLc["+k+"]"),lights[k].c);
      gl.uniform1f(U("uLr["+k+"]"),lights[k].r);
    }
    gl.uniform1f(U("uNL"),NL);
    gl.uniform1f(U("uHasUpper"),hasUpper);
    gl.uniform1i(U("uMove"),9);
    gl.uniform2f(U("uMoveSize"),SW,SH);
    gl.uniform1f(U("uMoveOn"),document.getElementById("turn").checked?1:0);
    gl.uniform2f(U("uPan"),panX,panY);
    gl.uniform1f(U("uZoom"),zoom.value/100);
    gl.uniform2f(U("uVP"),glc.width,glc.height);
    gl.uniform1f(U("uPixel"),Math.max(1,parseInt(pix.value,10))/Math.max(1,parseInt(ss.value,10)));
    gl.uniform1f(U("uLevels"),Math.pow(2,parseInt(bits.value,10))-1.0);
    gl.uniform1f(U("uDither"),dith.value/100);
    gl.uniform1f(U("uBands"),parseFloat(bands.value));
    gl.uniform1f(U("uLightDither"),bdith.value/100);
    gl.viewport(0,0,glc.width,glc.height);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    FRAMES++;
  }
  // HOW MANY FRAMES HAVE ACTUALLY REACHED THE SCREEN. Asking the canvas instead
  // -- readPixels on a presented drawing buffer -- reads black whatever was
  // drawn, which is how a load measurement came back with 260 seconds for a page
  // that was already up. A counter cannot lie about this.
  let FRAMES=0;
  function resizeCanvas(){
    // pixel size k  -> render at 1/k and upscale NEAREST (the PS1 chunk)
    // anti-alias  s -> render at xS and downscale LINEAR (supersampling)
    // The map textures are non-power-of-two, so WebGL1 cannot mipmap them; with
    // high-frequency bump normals that means sparkle. Supersampling is the fix
    // available to us, and it also smooths the shadow jitter and dither stipple.
    const k=Math.max(1,parseInt(pix.value,10));
    const s=Math.max(1,parseInt(ss.value,10));
    // RENDER AT DEVICE PIXELS. The backing store used to be sized in CSS pixels,
    // so on any display at a scale factor other than 100% the browser stretched
    // the finished frame to fit -- a 1984-wide canvas blown up to 2976 device
    // pixels. `image-rendering:pixelated` does not save it: 1.5x nearest doubles
    // some columns and not others, which reads as everything being slightly soft.
    // Painting one backing pixel per device pixel is the only thing that makes
    // pixel art land on pixels.
    const dpr=Math.max(1, Math.min(3, window.devicePixelRatio||1));
    glc.width=Math.ceil(innerWidth*dpr/k*s); glc.height=Math.ceil(innerHeight*dpr/k*s);
    glc.style.width=innerWidth+"px"; glc.style.height=innerHeight+"px";
    glc.style.imageRendering = s>1 ? "auto" : "pixelated";
  }

  // ---- view ---------------------------------------------------------------
  // PAN IS IN DEVICE PIXELS, and has to be. The shader computes
  //   P = (gl_FragCoord.xy*uPixel - uPan)/uZoom
  // and gl_FragCoord is in BACKING pixels, which resizeCanvas sets to
  // CSS*dpr/pix*ss -- so gl_FragCoord*uPixel is exactly CSS*dpr, and uPan is
  // compared against a device-pixel coordinate. Every assignment below used to
  // come from a CSS one (e.clientX, innerWidth), so at any display scale other
  // than 100% the map was offset by the scale factor and a drag ran slower than
  // the cursor. It never showed up here because the demo was developed at 100%
  // and screenshot at exactly 1 or 2.
  let panX=0,panY=0;
  const DPR=()=>Math.max(1, Math.min(3, window.devicePixelRatio||1));
  const cssX=e=>e.clientX*DPR(), cssY=e=>e.clientY*DPR();
  const viewW=()=>innerWidth*DPR(), viewH=()=>innerHeight*DPR();
  const fitZoom=()=>Math.min(viewW()/CW, viewH()/CH)*0.97;
  function centreView(){ const z=zoom.value/100;
    panX=(viewW()-CW*z)/2; panY=(viewH()-CH*z)/2; }
  function fit(){ /* pan/zoom are shader uniforms now; the next frame picks them up */ }
  addEventListener("wheel",e=>{
    e.preventDefault();
    const z0=zoom.value/100, cx=(cssX(e)-panX)/z0, cy=(cssY(e)-panY)/z0;
    const z1=Math.min(2.0,Math.max(0.04,z0*(e.deltaY<0?1.12:1/1.12)));
    zoom.value=Math.round(z1*100); panX=cssX(e)-cx*z1; panY=cssY(e)-cy*z1; fit();
  },{passive:false});
  let drag=null,downAt=null;
  addEventListener("mousedown",e=>{ if(e.target.closest("#hud")) return;
    drag=[cssX(e)-panX,cssY(e)-panY]; downAt=[e.clientX,e.clientY]; });
  addEventListener("mousemove",e=>{
    if(drag){ panX=cssX(e)-drag[0]; panY=cssY(e)-drag[1]; fit(); return; }
    if(frozen) return;
    const z=zoom.value/100;
    mouse=screenToWorldFloor((cssX(e)-panX)/z,(cssY(e)-panY)/z);
  });
  addEventListener("mouseup",e=>{
    const moved=downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
    if(downAt&&moved<5&&!e.target.closest("#hud")){
      const z=zoom.value/100;
      // Pick the square whose ANCHOR is nearest the click, rather than inverse-
      // projecting the clicked pixel onto the floor plane. A wall drawn over the
      // floor behind it made those squares impossible to click at all -- the
      // pixel belonged to the wall, so it mapped to a square in front of it.
      const cx=(cssX(e)-panX)/z, cy=(cssY(e)-panY)/z;
      let X=-1, Y=-1, bestD=Infinity;
      for(let sy2=0; sy2<SH; sy2++) for(let sx2=0; sx2<SW; sx2++){
        const [wx2,wy2]=sqWorld(sx2,sy2);
        const [px,py]=worldToScreen(wx2,wy2);
        const zz=squareZ(sx2,sy2,0)*COS30*PPU;
        const d=(px-cx)*(px-cx)+(py-zz-cy)*(py-zz-cy);
        if(d<bestD){ bestD=d; X=sx2; Y=sy2; }
      }
      // Clicking a LIVE GOBLIN attacks it, or throws the armed spell at it; the
      // square under him is not what you meant. Matched against the actor's
      // screen anchor rather than his square, because he is between squares for
      // most of every step and the square he is nearest is not where he looks.
      const tgt=pickActor(cx,cy);
      if(tgt && tgt!==hero){
        const armed=document.querySelector('input[name="spell"]:checked').value;
        if(armed==="melee") heroAttack(tgt); else heroCast(armed,tgt.wx,tgt.wy,tgt.z,tgt);
        drag=null; downAt=null; return;
      }
      // clicking a door works it rather than walking to it
      const dt = (X>=0&&X<SW&&Y>=0&&Y<SH) ? cells[((Y/CELLS)|0)*W+((X/CELLS)|0)] : null;
      if(dt && dt.kind==="door"){
        dt.open=!dt.open;
        passable=buildSquares();
        rebuildComposite();
        flash(dt.open?"door opened":"door shut");
        drag=null; downAt=null; return;
      }
      if(X>=0&&X<SW&&Y>=0&&Y<SH){
        // An armed spell lands on the GROUND you clicked -- that is the whole
        // difference between a fireball and a sword, and it is why the ground
        // click and the actor click above run the same cast function.
        const armed=document.querySelector('input[name="spell"]:checked').value;
        if(armed!=="melee"){
          const [wx2,wy2]=sqWorld(X,Y);
          heroCast(armed,wx2,wy2,squareZ(X,Y,sqL(hero.sq)),null);
          drag=null; downAt=null; return;
        }
        // A click is ambiguous when two floors overlap on screen: try the layer
        // he is standing on first, then the other one.
        const hereL=sqL(hero.sq);
        let p=pathToward(hero.sq,X,Y,hereL);
        if(document.getElementById("turn").checked && p.length>moveLeft)
          p=p.slice(0,moveLeft);          // spend only what is left this turn
        if(p.length){
          const end=p[p.length-1];
          hero.path=p;
          flash(sqX(end)===X && sqY(end)===Y ? "" : "as close as I can get");
        } else flash("nowhere to go");
      } else flash("outside the map");
    }
    drag=null; downAt=null;
  });
  let flashT=null;
  function flash(m){ const el=document.getElementById("msg"); el.textContent=m;
    clearTimeout(flashT); if(m) flashT=setTimeout(()=>el.textContent="",1800); }
  addEventListener("keydown",e=>{
    const k=e.key.toLowerCase(), s=(e.shiftKey?240:80)*DPR();
    if(k==="f"){ frozen=!frozen; flash(frozen?"light frozen":""); return; }
    if(k==="q"||k==="e"){ const n=(k==="q")?3:1;
      for(let t=0;t<n;t++) rotateWorld(); e.preventDefault(); return; }
    if(k==="arrowleft"||k==="a") panX+=s; else if(k==="arrowright"||k==="d") panX-=s;
    else if(k==="arrowup"||k==="w") panY+=s; else if(k==="arrowdown"||k==="s") panY-=s;
    else if(k==="0"){ zoom.value=Math.round(fitZoom()*100); centreView(); }
    else return;
    e.preventDefault(); fit();
  });
  zoom.addEventListener("input",fit);
  pix.addEventListener("input",()=>{ resizeCanvas(); fit(); });
  ss.addEventListener("input",()=>{ resizeCanvas(); fit(); });
  addEventListener("resize",()=>{ resizeCanvas(); fit(); });
  function endTurn(){ moveLeft=parseInt(document.getElementById("mv").value,10);
                      refreshMoveRange(); flash("new turn"); }
  document.getElementById("endturn").onclick=endTurn;
  document.getElementById("turn").addEventListener("change",refreshMoveRange);
  document.getElementById("mv").addEventListener("change",endTurn);
  document.getElementById("mv").addEventListener("input",refreshMoveRange);
  document.getElementById("dbg").addEventListener("change",()=>rebuildComposite());
  document.getElementById("dbgE").addEventListener("change",e=>{ EDGE_DEBUG=e.target.checked; rebuildComposite(); });
  const refit=()=>{ zoom.value=Math.round(fitZoom()*100); centreView(); fit(); refreshMoveRange(); };
  // regenerate = a NEW seed; typing a seed and pressing enter = that exact map
  document.getElementById("regen").onclick=()=>{ SEED=(Math.random()*1e9)|0; if(build()) refit(); };
  document.getElementById("spawn").onclick=()=>{
    const before=actors.length; spawnGoblins(1);
    flash(actors.length>before ? actors[actors.length-1].body : "no room"); };
  seedBox.onchange=()=>{ const v=parseInt(seedBox.value,10); if(!isNaN(v)){ SEED=v; if(build()) refit(); } };

  // How many pixels of the sprite actually survive the depth test: render the
  // frame with and without the sprite and diff. This is the only honest way to
  // tell "correctly occluded" apart from "never drawn".
  function spriteVisiblePixels(who){
    const a=who||hero;
    const [rx,ry,rw,rh]=spriteRect(a);
    const z=zoom.value/100;
    // pan/zoom are DEVICE px (see the note where panX is declared) and readPixels
    // wants BACKING-STORE px; those differ by ss/pix. Mixing them made this read
    // the wrong region and report 0 visible pixels for a sprite drawing fine.
    const k=Math.max(1,parseInt(ss.value,10))/Math.max(1,parseInt(pix.value,10));
    const x0=Math.max(0,Math.floor((rx*z+panX)*k)), y0=Math.max(0,Math.floor((ry*z+panY)*k));
    const w=Math.min(glc.width-x0,Math.ceil(rw*z*k)), h=Math.min(glc.height-y0,Math.ceil(rh*z*k));
    if(w<=0||h<=0) return {visible:0,area:0,note:"sprite off-screen"};
    const grab=()=>{ const b=new Uint8Array(w*h*4);
      gl.readPixels(x0,glc.height-y0-h,w,h,gl.RGBA,gl.UNSIGNED_BYTE,b); return b; };
    drawGL(); const A=grab();
    // Hide EVERY sprite for the control frame, not just this one: with several
    // actors on the map a diff that leaves the others in still reports their
    // pixels as this one's whenever two overlap.
    gl.uniform1f(U("uNSpr"),0); gl.uniform1f(U("uNCast"),0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    const B=grab();
    let diff=0;
    for(let k=0;k<A.length;k+=4)
      if(Math.abs(A[k]-B[k])+Math.abs(A[k+1]-B[k+1])+Math.abs(A[k+2]-B[k+2])>8) diff++;
    drawGL();
    return {visible:diff, area:w*h, pct:+(100*diff/(w*h)).toFixed(1)};
  }

  // ANY uncaught error used to end as a black canvas and nothing else. The one
  // thing a person staring at a black screen needs is the first line of the
  // error that caused it.
  window.addEventListener("error", ev=>{
    const el=document.getElementById("status");
    if(el && !el.dataset.err){
      el.dataset.err="1";
      el.textContent = "ERROR: " + (ev.message||ev.error) + "  (see console)";
      el.style.color = "#ff6b6b";
    }
  });

  // THE COMPOSITE-TO-CANVAS TRANSFORM, so a test can find a tile EDGE on screen.
  // Every seam measurement before this one thresholded "darker than its
  // neighbours" over a patch and was swamped by the grass mottle -- it reported
  // 1.4% dark and 1.3% bright on the same frame, which is texture, not a lattice.
  // Knowing where the edges ARE is the difference between measuring the seam and
  // measuring the noise.
  window.__gview=()=>({orgX:gOrgX, orgY:gOrgY, scale:gScale, w:gW, h:gH,
                       cw:(document.querySelector('canvas')||{}).width});
  window.__engine={hero:()=>hero,cells:()=>cells,path:()=>hero.path,reach:()=>reach,
    worldToScreen,sqWorld,bfsSq,SW,SH,spriteVisiblePixels,spriteRect,
    standable:(X,Y,L)=>passable(X,Y,L||0,X,Y,L||0),
    propPlan:()=>propPlan, draws:()=>lastDraws, frames:()=>FRAMES, phases:()=>PHASE,
    // WHAT THE MAP COSTS, in bytes, split the way the two renderers differ.
    // The composite path pays for the whole map at art resolution whether or not
    // any of it is on screen; the G-buffer path pays for the art it actually
    // draws plus a viewport. Reporting both from the live scene is the only way
    // to compare them honestly -- every earlier estimate of this was arithmetic
    // done from tile counts, and the arithmetic left out the upper layer.
    vram:()=>{
      const seen=new Map();
      for(const it of (lastDraws||[])){
        if(it.kind!=="tile") continue;
        const a=tileArt(it.c), k=a.name+"_r"+a.rot, E=imgs[k];
        if(E && !seen.has(k)) seen.set(k, E[0].width*E[0].height + E[1].width*E[1].height
                                         + E[2].width*E[2].height);
      }
      let art=0; for(const v of seen.values()) art+=v*4;
      const layers = 3 * (hasUpper?2:1);
      return { variants:seen.size, loaded:Object.keys(imgs).length,
               compositeMB: +(CW*CH*4*layers/1048576).toFixed(1),
               // the composite exists twice: a 2D canvas and the GL texture
               compositeTotalMB: +(CW*CH*4*layers*2/1048576).toFixed(1),
               usedArtMB: +(art/1048576).toFixed(1),
               allArtMB: +(Object.values(imgs).reduce((t,E)=>t+
                  (E[0].width*E[0].height+E[1].width*E[1].height+E[2].width*E[2].height)*4,0)
                  /1048576).toFixed(1),
               viewportMB: +(glc.width*glc.height*4*3/1048576).toFixed(1),
               CW, CH,
               // WHAT THIS RUN ACTUALLY PAID. The two paths are listed above as
               // alternatives; this is the one in force, so a claim about the
               // saving can be read off rather than argued.
               path: useGBuf() ? "gbuffer" : "composite",
               liveMB: useGBuf()
                 ? +(([...gArt.values()].reduce((t,T)=>t+T.n,0)
                      + (gW*gH*4*3*2))/1048576).toFixed(1)
                 : +(CW*CH*4*(hasUpper?6:3)*2/1048576).toFixed(1),
               gTiles: gLastCount, gUploaded: gArt.size,
               // The CPU height buffer, the last thing sized by map area.
               heightMB: +(Math.ceil(CW/HSCALE)*Math.ceil(CH/HSCALE)*4/1048576).toFixed(1),
               heightScale: HSCALE,
               // Composite textures must NOT exist on the G-buffer path; if they
               // do, something rebuilt them and the saving is imaginary.
               compositeTexAlive: !!texA };
    },
    pathToward, squareZ, heightAt,
    // Slope under a square, from the composited height buffer -- the same buffer
    // walkability reads. "Can you stand here" and "is this a rock face" are
    // different questions and this is the second one.
    slopeAt:slopeUnder,
    sqId:(X,Y,L)=>(L||0)*SW*SH+Y*SW+X,
    goto:s=>{const p=bfsSq(hero.sq,s); if(p.length) hero.path=p; return p;},
    view:(z,px,py)=>{zoom.value=Math.round(z*100);panX=px;panY=py;fit();},
    // Actors and effects, for shot.py -- the browser is not the only witness,
    // and "did the goblin die" has to be answerable without reading pixels.
    actors:()=>actors.map(a=>({body:a.body,action:a.action,frame:a.frame,dir:a.dir,
                               hp:a.hp,dead:a.dead,wx:+a.wx.toFixed(2),wy:+a.wy.toFixed(2),
                               z:+(a.z||0).toFixed(2),sq:a.sq})),
    fx:()=>fx.map(e=>({name:e.name,frame:e.frame,wx:+e.wx.toFixed(2),wy:+e.wy.toFixed(2),
                       rot:+e.rot.toFixed(3)})),
    loaded:()=>Object.keys(actLoading).filter(k=>{
      const [b,a]=k.split("/"); return ACT[b]&&ACT[b][a]; }),
    // EVERYONE WHO IS NOT YOU. It filtered on body==="goblin", which was true
    // when a goblin was the only thing to fight and silently returned nothing the
    // moment the roster grew.
    foes:()=>actors.filter(a=>a!==hero),
    goblins:()=>actors.filter(a=>a!==hero),
    spawn:(body,sq)=>{ const a=newActor(body, sq===undefined
                         ? reach[(Math.random()*reach.length)|0] : sq, {wander:true});
                       actors.push(a); return a; },
    attack:a=>heroAttack(typeof a==="number"?actors[a]:(a||actors[1])),
    cast:(n,x,y)=>heroCast(n, x===undefined?hero.wx+2:x, y===undefined?hero.wy:y,
                           hero.z||0, null),
    play:(i,act)=>play(actors[i],act),
    // Hand-cranked time, for a witness that is not a browser at 60fps: pause,
    // then step the simulation an exact number of ticks and screenshot that.
    pause:v=>{ paused=v!==false; return paused; },
    step:(n,dt)=>{ const was=paused; paused=false;
                   for(let k=0;k<(n||1);k++) tick(dt||0.05); paused=was; },
    view0:()=>({panX,panY,zoom:zoom.value/100}),
    // HOW LONG A FRAME ACTUALLY TAKES. Counting requestAnimationFrame callbacks
    // measures the browser's willingness to schedule them, not the renderer:
    // Chromium clamps rAF to about 1fps whenever a page is not visibly
    // composited, which is always true in an automated browser. Every frame-rate
    // number taken that way in here was really that clamp, including the ones
    // used to chase a regression. Drawing n frames back to back with a finish()
    // at the end asks the GPU instead.
    // The sync is a one-pixel readPixels, NOT gl.finish(): finish is advisory in
    // ANGLE and returns before the work is done, which reported 0.05ms a frame
    // for seven megapixels of shadow-marched shader -- twenty thousand frames a
    // second, and obviously not true. A readback cannot return until the frame it
    // reads has actually been drawn.
    bench:(n)=>{ n=n||30;
      const px=new Uint8Array(4);
      const sync=()=>gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      drawGL(); sync();
      const t0=performance.now();
      for(let k=0;k<n;k++){ drawGL(); }
      sync();
      const ms=(performance.now()-t0)/n;
      return {msPerFrame:+ms.toFixed(2), fps:+(1000/ms).toFixed(1),
              canvas:[glc.width,glc.height],
              megapixels:+(glc.width*glc.height/1e6).toFixed(2)}; },
    // What the shader was actually handed this frame. "It is in the list" and
    // "it is in a slot" are different claims, and only this one answers the
    // second: the compositor trims, reorders and clears slots behind you.
    slots:()=>Array.from({length:lastSlots},(_,i)=>({
      rect:[...spRect.slice(i*4,i*4+4)].map(v=>+v.toFixed(1)),
      atlas:[...spAtlas.slice(i*4,i*4+4)].map(v=>+v.toFixed(3)),
      meta:[...spMeta.slice(i*4,i*4+4)].map(v=>+v.toFixed(3))}))};

  (window.__loadPhases=window.__loadPhases||{}).beforeBuild = +performance.now().toFixed(0);
  if(!build()) return;
  window.__loadPhases.afterBuild = +performance.now().toFixed(0);
  zoom.value=Math.round(fitZoom()*100); centreView(); fit();

  endTurn();                      // start the first turn with a full move budget
  // ONE tick, so a headless caller advances the world exactly the way the frame
  // loop does. A test that steps the simulation by hand and a browser running at
  // 60fps must not be able to disagree about what happened.
  function tick(dt){
    // PAUSED still draws, it just stops time. Without this a screenshot cannot
    // catch a transient: an eval that sets up a blast returns, the frame loop
    // keeps running while the screenshot is taken, and the picture arrives after
    // the animation has ended -- which looks exactly like the effect never
    // rendering, and cost an afternoon of debugging a working shader.
    if(paused) return;
    hero.wander=document.getElementById("wander").checked;
    stepPending(dt);
    for(const a of actors) stepActor(a,dt);
    checkIntent();
    stepEffects(dt);
  }
  let last=performance.now(), fps=0, acc=0, frames=0;
  const fpsEl=document.getElementById("fps");
  (function loop(t){
    const dt=Math.min(0.05,(t-last)/1000); last=t;
    acc+=dt; frames++;
    if(acc>0.5){ fps=Math.round(frames/acc); fpsEl.textContent=fps+" fps"; acc=0; frames=0; }
    clock+=dt;
    tick(dt); drawGL();
    requestAnimationFrame(loop);
  })(last);
})();
</script>
