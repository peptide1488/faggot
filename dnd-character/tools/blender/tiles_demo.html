<!doctype html>

<title>Iso tile test engine — WFC dungeon</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#08080a; color:#c9c9d2; font:13px/1.5 ui-monospace,Consolas,monospace; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; overflow:hidden; }
  canvas { position:absolute; top:0; left:0; transform-origin:0 0;
           image-rendering:pixelated; image-rendering:crisp-edges; }
  /* The panel is taller than the viewport and grows every time a control is
     added, so the bottom of it was simply unreachable -- resizing and zooming
     do not help, because it is pinned to the top and clipped by the window.
     Bound it to the viewport and let it scroll on its own. */
  #hud { position:fixed; top:10px; left:10px; background:#12121aee; border:1px solid #2a2a38;
         padding:10px 12px; border-radius:6px; z-index:5; width:300px;
         max-height:calc(100vh - 20px); overflow-y:auto; overscroll-behavior:contain; }
  /* A thin scrollbar that belongs to the panel rather than the page. */
  #hud { scrollbar-width:thin; scrollbar-color:#3a3a4e transparent; }
  #hud::-webkit-scrollbar { width:8px; }
  #hud::-webkit-scrollbar-thumb { background:#3a3a4e; border-radius:4px; }
  #hud::-webkit-scrollbar-track { background:transparent; }
  #hud h1 { font-size:13px; margin:0 0 6px; color:#eaeaf2; }
  label { display:flex; align-items:center; gap:8px; margin:3px 0; }
  input[type=range], select { flex:1; }
  #status { color:#7a7a8a; margin-bottom:6px; }
  b { color:#e8b06a; } kbd { background:#22222e; border:1px solid #33334a; border-radius:3px; padding:0 4px; }
  button { background:#22222e; color:#c9c9d2; border:1px solid #3a3a4e; border-radius:4px;
           padding:4px 8px; cursor:pointer; font:inherit; }
</style>
<div id="hud">

  <div id="status">loading…</div>
  <label>mode <select id="mode">

  <label><input id="daylight" type="checkbox"> daylight (outdoor)</label>
  <label>ambient <input id="amb" type="range" min="0" max="100" value="18"></label>
  <label>sun <input id="sun" type="range" min="0" max="150" value="0"></label>

    <b>drag</b> scrolls · <b>wheel</b> zooms<br>

<div id="stage"><canvas id="gl"></canvas></div>
<script>
const VERSION = "0.52.0";

// ---- tile SET ------------------------------------------------------------
// build_tiles.py bakes each named look into its own directory (--theme NAME),
// so a set is a path, not a rebuild: geometry, lattice and lighting are shared
// and only the albedo changes. Props and the wizard are theme-independent and
// stay at out/ -- a barrel is a barrel in a castle or a cave.
const TILESETS = ["sandstone","stone","grass10A","dust10A","scree10A"];
let TILESET = new URLSearchParams(location.search).get("set")
           || localStorage.getItem("iso.tileset") || TILESETS[0];
if(!TILESETS.includes(TILESET)) TILESET = TILESETS[0];
const TSET = "out/" + TILESET + "/";

// ---- one seeded generator for the whole world ----------------------------
// Every random decision the MAP makes goes through rnd(): rooms, doors, rifts,
// causeways, elevation, props, torches. It used to be two generators -- bare
// Math.random for terrain and an alias called rnd for props -- which meant "give
// me that map again" was unanswerable. That cost a real comparison: an A/B of
// the packed tiles against the raw ones measured a 59/255 difference that was
// entirely two different maps, because seeding one generator never reached the
// other.
// The hero's idle wander deliberately stays on Math.random. It is animation, not
// world-building, and if it drew from this stream then how long you watched the
// map would change the NEXT map you generated.
// EVERY URL SETTING IS READ ONCE, HERE, before anything rewrites the address
// bar -- because build() does exactly that, replacing it with just ?set&seed to
// make the current map shareable, and any parameter read AFTER that point is
// simply gone. `goblins` was read later, inside finishBuild, so it never had a
// value: ?goblins=0 spawned three, every "empty map" control had three actors
// wandering through it, and the frame that would not hold still between loads
// was them walking. Two hours of it looked like a renderer bug.
const PARAMS = new URLSearchParams(location.search);
let SEED = (PARAMS.get("seed")|0) ||
           ((Math.random()*1e9)|0);
let _rs = SEED;
function reseed(s){ SEED = s>>>0; _rs = SEED; }
function rnd(){                       // mulberry32
  _rs = (_rs + 0x6D2B79F5) | 0;
  let t = Math.imul(_rs ^ (_rs>>>15), 1 | _rs);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
  return ((t ^ (t>>>14)) >>> 0) / 4294967296;
}

// ---- must match build_tiles.py -------------------------------------------
const TILE_W = 640, RES = 1024, ANCHOR = RES/2;
// Tiles are NOT all the same size any more: build_tiles.py sizes each canvas
// from the geometry in it, so a raised wall gets a taller image than a floor
// (it used to be clipped by a fixed 1024). What is invariant is the ANCHOR --
// every tile's own centre is the image centre, at any resolution -- so the
// composite positions each image by its own half-size, never by a constant.
let MAXR = RES;
const CELLS = 4;                          // squares per tile edge
const TILE_U = 4.0;                       // world units per tile
const PPU = TILE_W / (TILE_U*Math.SQRT2); // pixels per world unit
const CAM_DIST = 30.0;
// height encoding: (z + HEIGHT_OFF)/HEIGHT_RANGE, so negatives survive
const HEIGHT_OFF = 4.0, HEIGHT_RANGE = 8.0;
const COS30 = Math.cos(Math.PI/6), SIN30 = 0.5, COS45 = Math.SQRT1_2;

const STEP_I = [ TILE_W/2,  TILE_W/4];    // world +X : screen right & down
const STEP_J = [-TILE_W/2,  TILE_W/4];    // world -Y : screen left  & down
const ORDER = ["Y+","X+","Y-","X-"];
// The two walls nearest the camera. Their room-facing side points AWAY from it,
// so anything mounted on that side is behind its own masonry. Rotation re-labels
// prop edges with the world and buildDraws re-runs, so testing here stays correct
// through Q/E rather than being baked into the map.
const NEAR_EDGES = new Set(["Y-","X+"]);
const OPP   = {"Y+":"Y-","Y-":"Y+","X+":"X-","X-":"X+"};
// ---- THE ACTIVE TILESET ----------------------------------------------------
// Tile names belong to the SET, not to this file. A set ships out/<id>/tiles.json
// declaring each piece's name, its ROLE and the edges it blocks; this file only
// ever asks for a role. That is what lets grass10A call its cliff a `scarp` and a
// hell set call its wall an `obsidian_spire` while the solver below is unchanged.
//
// Weights are derived from the SHAPE of a wall set rather than looked up by name,
// so a new set gets sensible ones without declaring any. Dead ends stay in the
// vocabulary at near-zero weight: a three-walled cul-de-sac is almost never wanted,
// but removing the variant outright causes WFC contradictions.
// STAGED, NOT YET LIVE. buildTileSet below is complete and unit-checked, but the
// name-resolution call sites (tileArt, the rim/span suffix builders, the loader's
// name list) still use the dungeon's literal names -- so until those are converted
// the vocabulary is still built the old way, from BASE. Converting half of them
// would break every set, so this stays switched off until the rest lands.
const BASE  = { floor:[], wall:["Y+"], corner:["Y+","X+"], corridor:["Y+","Y-"], deadend:["Y+","X+","X-"] };
const WEIGHT= { floor:12, wall:4, corner:2, corridor:2, deadend:0.15 };

const VARIANTS = [];
let NV = 0, TS = null;
const setKey = a => [...a].sort().join(",");
function rotSet(edges, rot){ const s=((rot/90)%4+4)%4;
  return edges.map(e=>ORDER[(ORDER.indexOf(e)+s)%4]); }
function edgeWeight(n){ return n===0 ? 12 : n===1 ? 4 : n>=3 ? 0.15 : 2; }

function buildTileSet(man){
  const byRole={};
  for(const [name,t] of Object.entries(man.tiles))
    (byRole[t.role]=byRole[t.role]||[]).push(Object.assign({name},t));
  const of = r => byRole[r]||[];

  // Find the piece of `role` whose declared `field` set, turned by some rotation,
  // lands exactly on the edges the map is asking for.
  const find=(role,field,want,filter,fixedRot)=>{
    const wk=setKey(want||[]);
    for(const t of of(role)){
      if(filter && !filter(t)) continue;
      const rots = fixedRot==null ? [0,90,180,270] : [fixedRot];
      for(const rot of rots)
        if(setKey(rotSet(t[field]||[],rot))===wk) return {name:t.name, rot};
    }
    return null;
  };
  const fam=f=>t=>t.family===f;

  TS={
    id:man.set, label:man.label||man.set, tiles:man.tiles,
    names:Object.keys(man.tiles),
    ground:(walls,level)=>find(level?"high_ground":"ground","edges",walls),
    hazard:(family,rims)=>find(family==="liquid"?"liquid":"drop","rims",rims,fam(family)),
    span:(family,rims)=>find("span","rims",rims,fam(family)),
    spanFlank:family=>{ const t=of("span_flank").find(fam(family)); return t?{name:t.name,rot:0}:null; },
    // A feature with a direction (a stair rises one way, a door faces one way) has
    // its rotation fixed by that direction; only the flanking walls are searched.
    stair:(walls,rot)=>find("stair","edges",walls,null,rot),
    opening:(walls,rot,closed)=>find("opening","edges",walls,t=>!!t.closed===!!closed,rot),
    upper:(role,walls,rot)=>find(role,"edges",walls,null,rot)
  };

  VARIANTS.length=0;
  for(const t of of("ground"))
    for(const rot of [0,90,180,270]){
      const walls=rotSet(t.edges||[],rot), key=setKey(walls);
      if(!VARIANTS.some(v=>v.key===key))
        VARIANTS.push({name:t.name,rot,key,walls:new Set(walls),w:edgeWeight(walls.length)});
    }
  NV=VARIANTS.length;
  for(const v of VARIANTS) BY_KEY[v.key]=v;
  return TS;
}

// The vocabulary as it is actually built TODAY, from the dungeon's literal names.
// buildTileSet replaces this wholesale once the call sites are converted.
for (const [name, edges] of Object.entries(BASE))
  for (const rot of [0,90,180,270]) {
    const walls=rotSet(edges,rot), key=setKey(walls);
    if(!VARIANTS.some(v=>v.key===key))
      VARIANTS.push({name,rot,key,walls:new Set(walls),w:WEIGHT[name]});
  }
NV = VARIANTS.length;
// ---- SOCKET SETS -----------------------------------------------------------
// The dungeon vocabulary is described by WALLS: a tile lists the edges it blocks,
// and two tiles may abut when both sides agree about whether there is masonry
// between them. That works because a dungeon has exactly one thing happening at
// an edge.
//
// An outdoor set has several. grass10A's edges carry an ELEVATION BAND, a water
// line and a track, in combinations -- "grass at the high band with a path
// crossing" is a different socket from "grass at the high band", and neither is
// expressible as a set of blocked edges. So a set may instead ship a SOCKET per
// edge per rotation in its manifest, and adjacency becomes string equality:
//
//     A may sit left of B  <=>  A.sockets["X+"] === B.sockets["X-"]
//
// That is strictly more general than the wall rule (a wall set could be written
// as sockets), but the dungeon sets are baked and packed under the old contract,
// so both live here and the manifest decides which one a set uses.
let MAN = null, SOCKET_SET = false;
const SVAR = [];                       // {name, rot, sock, w}
// Weights decide the CHARACTER of a map, not just its legality. Every role at a
// similar weight gives a valid tiling that looks like static: a checkerboard of
// one-tile ponds and one-tile meadows, because WFC has no notion of a landmass. So
// open ground outweighs everything by a wide margin, and the features that need
// company to make sense -- water, level changes -- are rare enough that when the
// solver does reach for one it tends to have to commit to a run of them.
// A PLATEAU COSTS A RING. High ground can only exist behind a closed loop of
// transition tiles, so weighting transitions down -- which is the obvious way to
// stop the map looking busy -- makes elevation impossible rather than rare, and the
// solver returns a flat green field every time. Transitions have to be affordable
// enough to buy the ring; it is open ground being MUCH cheaper that keeps the map
// calm, not the features being expensive.
// A PEAK IS RARE ON PURPOSE. It is the third level, not a second plateau: one
// outcrop that overlooks the map is a feature, and a board half of which is at
// the top band is just a smaller map with a moat round it.
// WATER'S WEIGHT ONLY CONTROLS THE EXTRA. The river is seeded, so its cells are
// forced whatever this says; everything the solver adds on top of it is a pool it
// chose freely. Measured on a 12x12: at 3.4 a map came out 17% water when the
// river itself is about 10% of it. Dropping it does not thin the river, it stops
// the ponds.
// A BRIDGE IS RARE BECAUSE IT IS A BRIDGE, not because the sockets make it hard.
// Its span carries W on both flanks, so it can stand anywhere a mere can, and at
// a track's weight the solver would happily plank the whole river. The sockets
// already stop a bridge to nowhere -- a +B edge has only another +B to meet -- so
// what is left to say is how often a river should be crossed, and the answer is
// about once.
// A ROAD, NOT A ROAD NETWORK. Role weight cannot express this: straight, bend,
// tee, crossroads and dead end are all role `track`, so the only dial that can
// tell them apart is the PIECE. Measured on a 12x12 over five seeds before this
// existed: a mean of 12.8 junctions and 6.8 dead-end spurs per map, one seed
// carrying 9 tees and 10 crossroads. That is a lane network laid over a meadow.
//
// These MULTIPLY the role weight rather than replace it, so a junction is still
// reachable when the sockets leave no alternative -- and the seeded road line
// forces whatever it needs regardless. They just stop being as ordinary as a
// straight. After: 4.0 junctions and 2.0 dead ends per map.
//
// LOWERING THE TRACK ROLE WEIGHT IS NOT THE SAME LEVER AND DOES NOT WORK. Swept
// 3.0 / 1.5 / 0.8: junctions did not improve, road fragments went UP (the road
// broke into 7-8 pieces), and two seeds fell through to the settle-for-anything
// branch -- a cheaper track makes the seeded line harder to satisfy, which is
// the opposite of what it looks like it should do.
const PIECE_W = [[/-(0530|0573)$/, 0.10],    // crossroads
                 [/-(0520|0572)$/, 0.22],    // tee
                 [/-(0540|0574)$/, 0.15]];   // dead end
const pieceMul = name => {
  for(const [re,m] of PIECE_W) if(re.test(name)) return m;
  return 1;
};
const ROLE_W = { ground:18, high_ground:9, peak:2.2, liquid:0.5, track:3.0,
                 transition:4.5, slope:5.0, track_slope:3.4, wallow:1.4,
                 span:0.8, span_flank:0.8 };
// ...and weights alone are not enough, and cannot be made enough.
//
// A weight says how often a tile is picked LOCALLY; it cannot say "roughly a third
// of this map should be up a hill". Both failures came from trying: weighting
// features down made elevation impossible rather than rare (a plateau needs a whole
// ring of transitions before it can exist at all), and weighting it back up gave a
// map where every one of the 68 land tiles was high -- one plateau, wall to wall.
// Once WFC is up on high ground, staying there is locally cheap, and nothing in the
// model ever argues for coming back down.
//
// Judging the finished tiling instead does not work either, and the reason is
// worth writing down: WFC's output here is BIMODAL, so asking for 10-42% high
// ground and 4-32% water at the same time is asking for a middle it almost never
// lands in -- measured, 112 attempts produced zero acceptances.
//
// So stop sampling and start STATING. A handful of cells are collapsed to a chosen
// role before the solve begins, and WFC grows a coherent region outward from each
// because that is the one thing it is genuinely good at. Seeds say where the
// features are; weights say what fills the space between them; and the acceptance
// test drops to a sanity check rather than a filter doing work it cannot do.
// The RAMP is seeded first, on purpose. Rejecting maps that have no way up cannot
// conjure one -- 112 attempts in a row failed that test -- because WFC never wanted
// to spend a tile on a ramp in the first place. Placing one up front inverts it:
// the ramp exists, and the plateau grows around it because that is the only thing
// its high edge can connect to.
// Point seeds: features that want to EXIST somewhere, with no shape to them.
// Water is not one of these any more -- seeding it as loose cells is what made
// ponds spatter across the map. It gets a path instead, below.
const MAP_SEEDS = { slope:[2,4], high_ground:[1,2], peak:[0,1] };

// What a finished tiling has to look like to be accepted, as fractions of the
// board. LAND IS EVERYTHING THAT IS NOT WATER -- a transition tile is walkable
// ground that happens to change level partway across, and counting it as "not
// land" is what made 97 maps in 112 fail this test while the interesting checks
// never ran at all.
const MAP_MIX = { land:[0.62,1.0], high:[0.01,0.46], water:[0.10,0.26], open:[0.008,1.0],
                  peakMax:0.14 };
// RANGES SET FROM WHAT THE SOLVER ACTUALLY PRODUCES, not from what a map ought
// to look like in the abstract. Sampled over 206 attempts of a 12x12 (the
// sampler is still there, window.__wfcSamples): `open` has a median of 0.014 and
// a maximum of 0.111, and the floor was 0.10 -- so it rejected 134 of 206 maps,
// `high` another 69, and the run NEVER accepted. It reached attempt 292 of 300
// every time and took the "settle for anything" branch at tries-8, which is why
// the page sat black for 20 seconds AND why the water rule never applied: the
// map you were shown had passed no test at all.

// A RIVER AND A ROAD ARE PATHS, NOT QUANTITIES. Weighting water up gives you more
// water everywhere; it cannot give you one river. Weighting was tried three times
// on this set and failed for exactly that reason -- it can say how MUCH, never
// where or what shape. A path seeded before the solve says both, and WFC then has
// to grow banks and verges around it because the sockets leave it no choice.
//
// Seeded SOFTLY: each cell on the path is narrowed to the role, not pinned to one
// variant, so the solver still picks which piece of that role fits its
// neighbours. Pinning a whole line of exact tiles over-constrains the board and
// the attempt just fails.
function buildSocketVariants(man){
  SVAR.length = 0;
  for(const [name,t] of Object.entries(man.tiles)){
    if(!t.sockets) continue;
    for(const rot of [0,90,180,270]){
      const sock = t.sockets[rot];
      if(!sock) continue;
      SVAR.push({name, rot, sock, role:t.role, band:t.band|0,
                 w:(ROLE_W[t.role]||1)*pieceMul(name)});
    }
  }
  return SVAR.length;
}

function seedPath(dom, propagate, W, H, want, down, wobble, joined, out, noturn){
  const idx=(i,j)=>j*W+i;
  const N=SVAR.length;
  // ONE ORTHOGONAL STEP AT A TIME. The first version advanced along the span and
  // wobbled sideways in the same move, so consecutive cells were DIAGONAL -- and
  // a diagonal pair shares no edge, so the arms it then demanded were on edges
  // that do not touch. Nothing could satisfy that and every seed failed to solve.
  // Either go forward or go sideways; never both.
  const span = down ? H : W, cross = down ? W : H;
  const cell = (a, c) => down ? [c, a] : [a, c];
  const path = [];
  let a = 0, c = 1 + ((rnd()*(cross-2))|0);
  path.push(cell(a, c));
  let guard = 0;
  // A ROAD CROSSES A RIVER STRAIGHT. `noturn` is the set of cells within one
  // cell of the river line, and the wobble is refused there: a turn at the
  // water cell leaves only the BEND ford in its domain -- measured, seven of
  // twelve seeds' crossing cells held exactly ford-0562 and nothing else -- and
  // a turn at the bank cell prunes the approaches the same way, since a span
  // and its approaches are straight-through pieces. The rolls still spend so
  // the stream stays comparable.
  const near1 = (i,j)=>{ if(!noturn) return false;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++)
      if(noturn.has((i+di)+","+(j+dj))) return true;
    return false; };
  while(a < span-1 && guard++ < span*4){
    if(rnd() < wobble){
      const nc = c + (rnd()<0.5 ? -1 : 1);
      if(nc >= 1 && nc <= cross-2){
        const cur = cell(a, c), tgt = cell(a, nc);
        if(!near1(cur[0],cur[1]) && !near1(tgt[0],tgt[1])){
          c = nc; path.push(cell(a, c)); continue;
        }
      }
    }
    a++; path.push(cell(a, c));
  }
  // Which edge of THIS cell faces that one. j increases toward Y-, which is the
  // convention the neighbour table uses.
  const edgeTo = (p, q) => q[0] > p[0] ? "X+" : q[0] < p[0] ? "X-"
                         : q[1] > p[1] ? "Y-" : "Y+";
  // The caller needs to know WHERE the river went, to keep the water near it.
  if(out) for(const c of path) out.push(c);
  for(let k=0; k<path.length; k++){
    const me = path[k], prev = path[k-1], next = path[k+1];
    const need = [];
    if(prev) need.push(edgeTo(me, prev));
    if(next) need.push(edgeTo(me, next));
    // the ends run off the map, so the road meets the border rather than stopping
    if(!prev) need.push(down ? "Y+" : "X-");
    if(!next) need.push(down ? "Y-" : "X+");
    const n = idx(me[0], me[1]);
    const keep = [...dom[n]].filter(v => {
      if(!want(SVAR[v])) return false;
      // +B is a join you could walk as much as +P is -- it is the same road,
      // carried rather than laid. Reading only +P here meant the road seed could
      // never choose a bridge for the one cell where it meets the river, which is
      // the only cell a bridge was ever for.
      return !joined || need.every(e => /\+[PBC]/.test(SVAR[v].sock[e]));
    });
    if(!keep.length) return false;
    dom[n] = new Set(keep);
    if(!propagate([[me[0], me[1]]])) return false;
  }
  return true;
}

// Do the tiles of these two cells form a ROAD between them? A track's edge carries
// +P only where an arm actually leaves it, and the socket rule makes two abutting
// edges equal -- so a shared socket with +P in it is a join you could walk, and
// anything else is two roads that happen to be next to each other.
function roadCrosses(dom, W, H){
  const idx=(i,j)=>j*W+i, at=n=>SVAR[[...dom[n]][0]];
  // EITHER WAY ACROSS. This only ever looked west to east, and the road runs
  // perpendicular to the river -- so whenever the river went east-west the road
  // ran north-south and a perfectly good crossing was rejected. It threw out
  // about one attempt in fifteen for being the wrong shape of right.
  const reach = (starts, done) => {
    const seen=new Uint8Array(W*H), st=[];
    for(const [i,j] of starts){ st.push([i,j]); seen[idx(i,j)]=1; }
    while(st.length){
      const [i,j]=st.pop();
      if(done(i,j)) return true;
      for(const nb of NEIGH){
        const ni=i+nb.di, nj=j+nb.dj;
        if(ni<0||ni>=W||nj<0||nj>=H) continue;
        const m=idx(ni,nj); if(seen[m]) continue;
        // a shared socket carrying +P is a join you could walk; anything else is
        // two roads that happen to be next to each other. +B is the same join
        // carried over water on a deck -- a bridge is a way across or it is
        // nothing, and reading only +P here would have rejected every map that
        // solved its river crossing with one.
        if(!/\+[PBC]/.test(at(idx(i,j)).sock[nb.edge])) continue;
        seen[m]=1; st.push([ni,nj]);
      }
    }
    return false;
  };
  const west=[], north=[];
  for(let j=0;j<H;j++) west.push([0,j]);
  for(let i=0;i<W;i++) north.push([i,0]);
  return reach(west, (i)=>i===W-1) || reach(north, (i,j)=>j===H-1);
}

function socketWfc(W,H,tries=300){
  const N=SVAR.length, idx=(i,j)=>j*W+i;
  let accepted=null;
  const rej={land:0, ways:0, low:0, flat:0, river:0, road:0, nocross:0, busy:0, peaky:0, wide:0};
  // Precompute compatibility once: OK[e][a] is the set of b that may sit across
  // edge e from a. Recomputing this inside propagate was the whole cost.
  const OK={};
  for(const nb of NEIGH){
    const tab=new Array(N);
    for(let a=0;a<N;a++){
      const want=SVAR[a].sock[nb.edge], list=[];
      for(let b=0;b<N;b++) if(SVAR[b].sock[OPP[nb.edge]]===want) list.push(b);
      tab[a]=list;
    }
    OK[nb.edge]=tab;
  }
  // ARC CONSISTENCY OVER FULL DOMAINS IS THE SAME EVERY TIME. Nothing has been
  // collapsed yet, so this depends only on the tile set -- and it was being
  // recomputed from scratch on all 292 attempts a 16x16 needed, which is most of
  // the 20.5 seconds the page spent black. Compute once, clone per attempt.
  let BASE=null;
  for(let attempt=0;attempt<tries;attempt++){
    const dom=new Array(W*H);
    if(BASE){ for(let n=0;n<W*H;n++) dom[n]=new Set(BASE[n]); }
    else { for(let n=0;n<W*H;n++){ dom[n]=new Set(); for(let v=0;v<N;v++) dom[n].add(v); } }
    const propagate=stack=>{
      while(stack.length){
        const [i,j]=stack.pop();
        for(const nb of NEIGH){
          const ni=i+nb.di, nj=j+nb.dj;
          if(ni<0||ni>=W||nj<0||nj>=H) continue;
          const allow=new Set();
          for(const a of dom[idx(i,j)]) for(const b of OK[nb.edge][a]) allow.add(b);
          const cur=dom[idx(ni,nj)]; let changed=false;
          for(const b of cur) if(!allow.has(b)){ cur.delete(b); changed=true; }
          if(changed){ if(!cur.size) return false; stack.push([ni,nj]); }
        }
      }
      return true;
    };
    if(!BASE){
      if(!propagate(Array.from({length:W*H},(_,n)=>[n%W,(n/W)|0]))) continue;
      BASE = dom.map(d=>new Set(d));
    }

    // ---- seeds. Kept off the border: a feature pinned against the edge of the map
    // has only half its neighbourhood to grow into, and a plateau needs room for a
    // whole ring of transitions before it can exist at all.
    // THE PATHS GO IN FIRST, before the point seeds. They are far the most
    // constrained things on the board -- a river is a line of tiles that present
    // water on all four edges, so it dictates its neighbours for its whole length
    // -- and a plateau seeded into the middle of one leaves the river's cells with
    // no water variant left. Seeded second, it failed 100 attempts in 120 and the
    // whole solve came back empty. A scarp can find somewhere else to be; a river
    // that has been cut in half cannot.
    // WATER ALL THE WAY ACROSS, which is not the same as "the open-water tile".
    // Pinning the river to role `liquid` pins it to the mere, whose four edges are
    // plain W -- and W cannot carry a track, so the road had nothing to cross the
    // river WITH and failed 90 attempts in 120. A ford is water with a crossing on
    // it: its arms are W+P and its sides are W. Asking for "every edge is water,
    // with or without a track on it" lets the two paths meet where they should,
    // at a ford, instead of making them rivals for the same cell.
    // ...AND A BRIDGE IS WATER TOO, for exactly the reason a ford is. This read
    // `/^W(\+P)?$/` and so pinned every river cell to a piece with no deck on it:
    // measured over eight seeds, 0 bridges placed and 8 to 21 fords. The pieces
    // and the sockets were both right; the river's own seed forbade the span, the
    // same way it once forbade the ford by pinning to role `liquid`. A span's
    // flanks are W and its ends are W+B, and the two approaches either side are
    // then FORCED -- nothing else in the set presents W+B -- so the crossing
    // assembles itself from one seeded cell.
    const isWater = v => ORDER.every(e => /^W(\+[PBC])?$/.test(v.sock[e]));
    // A BRIDGE IS A ROAD. Both seeds have to admit it or it lands somewhere no
    // road reaches: seeded as water only, the span went in wherever the river ran
    // and came out as a pier hanging off the map edge over the shore. Where the
    // two lines cross, the cell's domain is now {ford, span} -- both satisfy both
    // seeds -- and the ROLE WEIGHT decides which, so how often a river is bridged
    // rather than waded is one number in ROLE_W and not a special case here.
    const isTrack = v => /track|span/.test(v.role);
    // ACROSS EACH OTHER, NOT ALONG. Each picked its own direction, so half the
    // time the river and the road ran parallel -- and since a ford is both, they
    // merged into one long wet street: twenty ford tiles on a nine by nine board
    // and no grass at all. Crossing at right angles they meet once, which is a
    // ford, which is the thing worth having.
    const riverDown = rnd()<0.5;
    const river=[];
    if(!seedPath(dom, propagate, W, H, isWater, riverDown, 0.30, false, river)){ rej.river++; continue; }
    const road=[];
    const riverKeys=new Set(river.map(([i,j])=>i+","+j));
    if(!seedPath(dom, propagate, W, H, isTrack, !riverDown, 0.30, true, road, riverKeys)){ rej.road++; continue; }
    // A BRIDGE ONLY WHERE THE ROAD IS. Admitting the span to the river seed put it
    // anywhere the river ran, and it went to the MAP EDGE almost every time -- for
    // a structural reason worth keeping: in the interior a `W+B` edge has to be
    // answered by another span or by an approach standing on a real bank, and at
    // the boundary it is answered by nothing at all. So the cheapest place to put
    // a bridge was always the one place it could lead nowhere. Measured: 2 of 8
    // seeds bridged, both off the edge, one of them a pier over the shore.
    // Being on the road is the thing that makes a crossing a crossing, and it is
    // one mask.
    {
      const onRoad=new Uint8Array(W*H);
      for(const [i,j] of road) onRoad[j*W+i]=1;
      const stack=[]; let bad=false;
      for(let n=0;n<W*H && !bad;n++){
        if(onRoad[n]) continue;
        const d=dom[n]; let changed=false;
        for(const v of d) if(/^span/.test(SVAR[v].role)){ d.delete(v); changed=true; }
        if(changed){ if(!d.size){ bad=true; break; } stack.push([n%W,(n/W)|0]); }
      }
      if(bad || !propagate(stack)){ rej.road++; continue; }
    }
    // A RIVER, NOT A LAKE. Seeding only asked for water ALONG a line; nothing
    // stopped the collapse from spreading it, and with the acceptance test
    // falling through (see below) what came back was a map that was mostly
    // water. Water is now only permitted within one tile of the line that was
    // actually drawn, which bounds the channel at three tiles and, with the
    // run check further down, two in practice.
    {
      const near=new Uint8Array(W*H);
      for(const [ri,rj] of river)
        for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
          const i=ri+di, j=rj+dj;
          if(i>=0&&i<W&&j>=0&&j<H) near[j*W+i]=1;
        }
      // ANY TILE THAT CARRIES WATER, not just a fully-liquid one. This is the
      // whole bug: only 12 of 256 tiles were role "liquid" while 104 were
      // "transition" -- shore pieces that shelve down to the bed and are half
      // water by area. Masking on the role let every shore tile spread across
      // the map, which is the flooding you can see. A tile is wet if ANY of its
      // edges is a water socket.
      const wet = v => { const sk=SVAR[v].sock;
                         for(const e in sk) if(/^W/.test(sk[e])) return true;
                         return false; };
      let bad=false;
      const stack=[];
      for(let n=0;n<W*H && !bad;n++){
        if(near[n]) continue;
        const d=dom[n]; let changed=false;
        for(const v of d) if(wet(v)){ d.delete(v); changed=true; }
        if(changed){ if(!d.size){ bad=true; break; } stack.push([n%W,(n/W)|0]); }
      }
      if(bad || !propagate(stack)){ rej.river++; continue; }
    }
    // ---- BRIDGE OR FORD: state it, do not weight it.
    // The crossing is a PLACE -- the one cell on both lines -- and that is a fact
    // about the whole board, which is the exact thing this file already says a
    // weight cannot express. Weighting was tried: at span 0.8 no seed in twelve
    // bridged, and at 12 -- four times a track's weight -- one in six did, because
    // a span needs BOTH its along-road neighbours to be approaches and the collapse
    // usually decides one of them first, killing the span before its cell is
    // reached. Raising the number further only makes a rare thing arrive by luck.
    // Collapsed here instead, the approaches are forced (nothing else presents
    // `W+B`) and the ford keeps every crossing this one does not take.
    // A BRIDGE IS WORTH HALF THE ATTEMPTS, NOT THE MAP. Seeding the crossing
    // poisons an attempt whenever propagation succeeds and the board it leaves
    // then satisfies no acceptance rule, so the last half of the tries is left
    // clear for a map that just wades.
    //
    // MEASURED OVER 60 SEEDS, not 12 -- at 12 the answer is 0, 1 or 2 depending
    // on the seed and reads as pure noise. Crossing seed off: 1 of 60 falls
    // through to the settle-for-anything branch. Always on: 4 of 60. Cut off at
    // half the tries: 2 of 60, and the one seed that fails with the seeding
    // switched off entirely (48) fails in every configuration, so the honest cost
    // of bridges is about one map in sixty.
    //
    // Do not expect a cutoff sweep to be monotonic: the stream diverges the
    // instant a crossing actually lands, so two cutoffs are two different
    // experiments. 0.25 measured WORSE than 0.5 and no better than always-on.
    // EVERY MAP GETS A CROSSING IT CAN WALK, or proves it cannot. This used to
    // be a coin flip -- half of all maps got no bridge or causeway on purpose --
    // which made sense when a ford was walkable and stopped making sense the day
    // it was not: a ford is 0 of 64 squares standable, so on the unseeded half
    // the road ran to the river, continued as ford ART, and quietly stopped
    // being a road. The map lied. Now every attempt below the cutoff tries to
    // place a span, at EVERY cell where the road meets the river rather than
    // only the first -- a cell can refuse (its neighbourhood may not fit the
    // approaches) while the next one over accepts, and giving up after one try
    // was leaving crossings unbuilt that the sockets allowed.
    // Whether it lands as a bridge or a causeway stays with the piece weights.
    let crossTry='skipped';
    if(attempt < tries*0.5){
      crossTry='nocell';
      const onRiver=new Uint8Array(W*H);
      for(const [ri,rj] of river) onRiver[rj*W+ri]=1;
      for(const [i,j] of road){
        const n=idx(i,j);
        if(!onRiver[n]) continue;
        const keep=[...dom[n]].filter(v=>SVAR[v].role==="span");
        if(!keep.length){
          if(crossTry==='nocell')
            crossTry='nospan:'+[...dom[n]].slice(0,5).map(v=>SVAR[v].name.replace(/^[^-]+-/,'')+'r'+SVAR[v].rot).join(',');
          continue; }
        const save=dom.map(d=>new Set(d));
        dom[n]=new Set(keep);
        // A refusal here is not a bad map, it is a cell this road cannot bridge.
        // Put the board back and offer the next crossing cell instead.
        if(propagate([[i,j]])){ crossTry='placed'; break; }
        crossTry='refused';
        for(let m=0;m<W*H;m++) dom[m]=save[m];
      }
    }
    // ORDER MATTERS. The mask above shrinks every domain off the river, and
    // running it before the road was seeded left the road nowhere to cross:
    // 150 of 300 attempts died on rej.road. The road picks its line first.

    let seeded=true;
    for(const [role,[lo,hi]] of Object.entries(MAP_SEEDS)){
      const pool=[]; for(let v=0;v<N;v++) if(SVAR[v].role===role) pool.push(v);
      if(!pool.length) continue;
      const count=lo+((rnd()*(hi-lo+1))|0);
      for(let k=0;k<count && seeded;k++){
        // LOOK FOR SOMEWHERE IT FITS, rather than trying one cell and shrugging.
        // The river and the road go in first and take a lot of the board with
        // them, so a single random pick lands on an already-decided cell most of
        // the time -- and a plateau that never got placed is a flat map, which is
        // three of twelve seeds rejected for want of about ten lines.
        for(let tryN=0; tryN<14; tryN++){
          const i=1+((rnd()*(W-2))|0), j=1+((rnd()*(H-2))|0), n=idx(i,j);
          const keep=pool.filter(v=>dom[n].has(v));
          if(!keep.length) continue;            // already decided; leave it alone
          dom[n]=new Set([keep[(rnd()*keep.length)|0]]);
          if(!propagate([[i,j]])) seeded=false;
          break;
        }
      }
    }
    if(!seeded) continue;
    let ok=true;
    while(true){
      let best=-1,bestC=1e9;
      for(let n=0;n<W*H;n++){ const c=dom[n].size; if(c>1&&c<bestC){bestC=c;best=n;} }
      if(best<0) break;
      const opts=[...dom[best]];
      let tot=0; for(const v of opts) tot+=SVAR[v].w;
      let r=rnd()*tot, pick=opts[0];
      for(const v of opts){ r-=SVAR[v].w; if(r<=0){pick=v;break;} }
      dom[best]=new Set([pick]);
      if(!propagate([[best%W,(best/W)|0]])){ ok=false; break; }
    }
    if(!ok) continue;
    // ---- acceptance. Only the last few attempts are allowed to settle for
    // anything, so a stubborn set still returns a map rather than nothing.
    if(attempt < tries-8){
      let land=0, high=0, water=0, low=0, ways=0, open=0, peak=0;
      for(let n=0;n<W*H;n++){
        const r=SVAR[[...dom[n]][0]].role;
        if(r!=="liquid") land++;
        if(r==="high_ground"||r==="peak") high++;
        if(r==="peak") peak++;
        // MEASURED THE WAY IT LOOKS: a shore tile is water on screen even though
        // its role is "transition", so the metric counts anything carrying a
        // water socket. Counting role==="liquid" reported 12 wet tiles on a map
        // that was half blue, and every water constraint passed while it flooded.
        { const sk=SVAR[[...dom[n]][0]].sock; let w=false;
          for(const e in sk) if(/^W/.test(sk[e])) { w=true; break; }
          if(w) water++; }
        if(r==="ground"||r==="track"||r==="wallow") low++;
        if(r==="slope"||r==="track_slope") ways++;
        // PLAIN LOW GROUND, and not high ground as well -- counting both let a
        // map of plateau, road and river pass with literally zero grass on it.
        if(r==="ground") open++;
      }
      const T=W*H;
      // WHAT THE SOLVER ACTUALLY PRODUCES, sampled every attempt. Two rounds of
      // tuning were spent guessing these ranges; the samples say what they
      // should be, and the tally below says which clause is doing the rejecting.
      (window.__wfcSamples=window.__wfcSamples||[]).push(
        {land:land/T, high:high/T, water:water/T, low:low/T,
         ways:ways/T, open:open/T, peak:peak/T});
      // Count WHY maps are rejected. Two rounds of tuning were spent guessing which
      // clause was doing the rejecting; the tally answers it in one run.
      const inRange=(v,[lo,hi])=>v>=T*lo && v<=T*hi;
      if(!inRange(land, MAP_MIX.land)){ rej.land++; continue; }
      if(!inRange(water, MAP_MIX.water)){ rej.land++; continue; }
      if(!inRange(high, MAP_MIX.high)){ rej.flat++; continue; }
      // A PLATEAU YOU CANNOT CLIMB IS SCENERY, NOT TERRAIN. WFC will happily raise
      // half the map and never spend a tile on a ramp -- measured, 592 of 1200
      // squares unreachable on one seed. It will also raise ALL of it, leaving no
      // low ground at all, because staying high is locally cheap once it is up
      // there. Both are cheap to detect and cheap to reject.
      // `ways` is guaranteed by the seed above, so this only catches the case where
      // the seed failed to place at all.
      if(high && !ways){ rej.ways++; continue; }
      if(high && low < T*0.12){ rej.low++; continue; }
      // A ROAD THAT DOES NOT ARRIVE IS A LAY-BY. Seeding the line only asks for
      // track tiles along it; whether their ARMS line up into something you could
      // walk from one edge to the other is a different question, and the only one
      // worth asking.
      if(!roadCrosses(dom, W, H)){ rej.nocross++; continue; }
      if(!inRange(open, MAP_MIX.open)){ rej.busy++; continue; }
      // The top band is an outcrop, not a second storey over the whole map.
      if(peak > T*MAP_MIX.peakMax){ rej.peaky++; continue; }
      // NEVER MORE THAN TWO TILES THICK, measured the way you would look at it:
      // the longest unbroken run of water across any row and down any column.
      {
        const wet=n=>SVAR[[...dom[n]][0]].role==="liquid";
        let worst=0;
        for(let j=0;j<H;j++){ let run=0;
          for(let i=0;i<W;i++){ run = wet(j*W+i) ? run+1 : 0; if(run>worst) worst=run; } }
        for(let i=0;i<W;i++){ let run=0;
          for(let j=0;j<H;j++){ run = wet(j*W+i) ? run+1 : 0; if(run>worst) worst=run; } }
        if(worst > 2){ rej.wide++; continue; }
      }
      accepted = {attempt, land, high, water, ways, cross: crossTry};
    }
    // Publish which attempt was taken and why: "the map is flat" and "the map was
    // rejected 119 times and the fallback ran" look identical from the outside.
    // ALSO published when nothing survives -- see the assignment after the loop.
    // It used to sit only here, past every `continue`, so a set that rejected
    // every single attempt left no tally at all: the one case the tally is for.
    window.__wfcDebug={attempt, accepted, tries, rej};
    const cells=[];
    for(let j=0;j<H;j++) for(let i=0;i<W;i++){
      const v=SVAR[[...dom[idx(i,j)]][0]];
      // `walls` stays an empty Set so every consumer written for the dungeon
      // (buildSquares, buildDraws, the debug overlay) keeps working unchanged --
      // an outdoor tile blocks nothing at its edges, which is the truth.
      cells.push({i, j, name:v.name, rot:v.rot, role:v.role, socket:true,
                  walls:new Set(), level:v.band===1?1:0,
                  noStand:v.role==="liquid", upper:null, kind:""});
    }
    return cells;
  }
  // NOTHING SURVIVED. Publish the tally anyway -- this is the case it exists for,
  // and it used to be the one case where it was never written.
  window.__wfcDebug={attempt:tries, accepted:null, tries, rej};
  return null;
}

const NEIGH = [ {di:1,dj:0,edge:"X+"}, {di:-1,dj:0,edge:"X-"},
                {di:0,dj:1,edge:"Y-"}, {di:0,dj:-1,edge:"Y+"} ];




// ---------------------------------------------------------------------------
// EDGE CONTRACT
// Every tile declares what each of its four edges offers, and neighbours must
// agree. Choosing art per tile from its own neighbours -- with no contract --
// is what let two adjacent causeway tiles run perpendicular to each other: each
// was independently "correct" and the pair was nonsense.
//
//   "ground"  walkable floor at this tile's level
//   "open"    a chasm/water edge: nothing to walk on
//   "deck"    a causeway continues through this edge
// ---------------------------------------------------------------------------
const FAM = k => k==="bridge" ? "pit" : k==="water_bridge" ? "water" : k;
function edgeKind(c, edge){
  if(c.kind==="pit"||c.kind==="water") return "open";
  if(c.kind==="bridge"||c.kind==="water_bridge"){
    const along = (c.spanAxis==="y") ? (edge==="Y+"||edge==="Y-")
                                     : (edge==="X+"||edge==="X-");
    return along ? "deck" : "open";
  }
  return "ground";
}
// A deck must lead somewhere: ground, or more deck. Returns the offending pairs.
function checkEdges(cells,W,H){
  const bad=[];
  for(const c of cells) for(const nb of NEIGH){
    const ni=c.i+nb.di, nj=c.j+nb.dj;
    if(ni<0||ni>=W||nj<0||nj>=H) continue;
    const t=cells[nj*W+ni];
    const a=edgeKind(c,nb.edge), b=edgeKind(t,OPP[nb.edge]);
    if(a==="deck" && b==="open" && !isGround(t)) bad.push([c.i,c.j,nb.edge,a,b]);
    if(b==="deck" && a==="open" && !isGround(c)) bad.push([t.i,t.j,OPP[nb.edge],b,a]);
  }
  return bad;
}
// Rebuild every crossing as a STRAIGHT run perpendicular to its own rift, from
// ground on one side to ground on the other. Derived from the rift's recorded
// orientation, never from whichever direction a repair happened to look in.
function normaliseCrossings(cells,W,H){
  const at=(i,j)=>cells[j*W+i];
  for(const c of cells){
    if(c.kind!=="bridge" && c.kind!=="water_bridge") continue;
    const axis = bestSpanAxis(cells,W,H,c) || (c.riftHoriz ? "y" : "x");
    const step = axis==="x" ? [1,0] : [0,1];
    const fam = FAM(c.kind);
    for(const dir of [1,-1]){
      let i=c.i, j=c.j;
      while(true){
        const t=at(i,j);
        if(!t || FAM(t.kind)!==fam) break;
        t.kind = fam==="pit" ? "bridge" : "water_bridge";
        t.spanAxis = axis;
        i+=step[0]*dir; j+=step[1]*dir;
      }
    }
  }
}


// HARD RULE, enforced to a fixpoint.
//  (a) neighbouring causeways must agree on their span axis -- two decks side by
//      side running at right angles was the visible "bridge rotated wrong" bug;
//  (b) a causeway must reach WALKABLE GROUND at both ends, passing only through
//      decks of its own rift. Running into a lake does not count as landing.
// Anything failing either test is demoted back to chasm.
const GROUND_KINDS = new Set(["", "stairs", "over_stairs", "arch", "door"]);  // all walkable tile kinds
const isGround = t => t && GROUND_KINDS.has(t.kind||"");

function enforceEdges(cells,W,H){
  const at=(i,j)=>(i<0||i>=W||j<0||j>=H)?null:cells[j*W+i];
  const isDeck = t => t && (t.kind==="bridge"||t.kind==="water_bridge");
  let demoted=0;
  for(let pass=0; pass<10; pass++){
    let changed=false;
    // (a) adjacent decks must share an axis; demote the later one deterministically
    for(const c of cells){
      if(!isDeck(c)) continue;
      for(const nb of NEIGH){
        const t=at(c.i+nb.di, c.j+nb.dj);
        if(!isDeck(t) || FAM(t.kind)!==FAM(c.kind)) continue;
        if(t.spanAxis===c.spanAxis) continue;
        const later = (t.j*W+t.i) > (c.j*W+c.i) ? t : c;
        later.kind=FAM(later.kind); delete later.spanAxis; demoted++; changed=true;
      }
    }
    // (b) a deck must LAND: reach ground at both ends, through an edge that is
    //     actually open. Checking only "is the next tile ground" let causeways
    //     terminate against a wall face -- a bridge to nowhere.
    // (c) and it must cross the rift, not run along it: a run longer than
    //     MAX_SPAN means the deck is pointing down the chasm.
    const MAX_SPAN = 4;
    for(const c of cells){
      if(!isDeck(c)) continue;
      const axis=c.spanAxis, fam=FAM(c.kind);
      const step = axis==="x" ? [1,0] : [0,1];
      let ok = !!axis;
      const landings=[];
      if(ok) for(const dir of [1,-1]){
        let i=c.i+step[0]*dir, j=c.j+step[1]*dir, run=0;
        while(true){
          const t=at(i,j);
          if(isGround(t)){ landings.push({t, from:at(i-step[0]*dir, j-step[1]*dir),
                                          edge: axis==="x" ? (dir>0?"X+":"X-")
                                                           : (dir>0?"Y-":"Y+")}); break; }
          if(!t){ ok=false; break; }
          if(!isDeck(t) || FAM(t.kind)!==fam || t.spanAxis!==axis){ ok=false; break; }
          if(++run>MAX_SPAN){ ok=false; break; }
          i+=step[0]*dir; j+=step[1]*dir;
        }
        if(!ok) break;
      }
      if(ok){
        // must be the SHORTER way across
        const other = axis==="x" ? "y" : "x";
        if(spanCost(cells,W,H,c,other) < spanCost(cells,W,H,c,axis)) ok=false;
        // ...and it must actually CROSS: the chasm has to continue alongside it.
        // On a wide lake both axes can be long, so "shorter" alone cannot tell a
        // crossing from a causeway laid lengthwise down the channel -- which is
        // what was rendering parallel to the water. A real crossing has rift on
        // at least one perpendicular side; a lengthwise one has ground on both.
        if(ok){
          const perp = axis==="x" ? ["Y+","Y-"] : ["X+","X-"];
          let touchesRift=false;
          for(const e of perp){
            const nb=NEIGH.find(n=>n.edge===e);
            const t=at(c.i+nb.di, c.j+nb.dj);
            if(t && FAM(t.kind)===fam && !isGround(t)) touchesRift=true;
          }
          if(!touchesRift) ok=false;
        }
      }
      if(!ok){ c.kind=fam; delete c.spanAxis; demoted++; changed=true; continue; }
      // open the wall the causeway lands against -- the bridge IS the doorway
      for(const L of landings){
        if(L.t.walls.has(OPP[L.edge])){
          L.t.walls.delete(OPP[L.edge]); resync(L.t); changed=true;
        }
        if(L.from && L.from.walls && L.from.walls.has(L.edge)){
          L.from.walls.delete(L.edge); resync(L.from);
        }
      }
    }
    if(!changed) break;
  }
  return demoted;
}




// Bridge art lookup keyed by (span axis, rim edges) -- the two were previously
// derived from ONE rotation, so choosing rims correctly could silently rotate
// the causeway. They are independent now: base spec s0..s3 puts rims on the
// edges PERPENDICULAR to the span, and rotation moves both together.
const BRIDGE_BY_KEY={};
(function(){
  const bases=[[],["X+"],["X-"],["X+","X-"]];      // rims, in the base orientation
  for(let b=0;b<4;b++) for(const rot of [0,90,180,270]){
    const st=(rot/90)%4;
    const spanEdge = ORDER[(ORDER.indexOf("Y+")+st)%4];
    const axis = (spanEdge==="Y+"||spanEdge==="Y-") ? "y" : "x";
    const rims = bases[b].map(e=>ORDER[(ORDER.indexOf(e)+st)%4]).sort().join(",");
    const key = axis+"|"+rims;
    if(!(key in BRIDGE_BY_KEY)) BRIDGE_BY_KEY[key]={suf:"_s"+b, rot};
  }
})();
function bridgeArt(cells,W,H,c,base){
  const axis=c.spanAxis||"y";
  const perp = axis==="y" ? ["X+","X-"] : ["Y+","Y-"];
  const rims=[];
  for(const e of perp){
    const nb=NEIGH.find(n=>n.edge===e);
    const t=(c.i+nb.di<0||c.i+nb.di>=W||c.j+nb.dj<0||c.j+nb.dj>=H)
            ? null : cells[(c.j+nb.dj)*W+(c.i+nb.di)];
    if(!t || FAM(t.kind)!==FAM(c.kind)) rims.push(e);   // chasm ends here
  }
  const v=BRIDGE_BY_KEY[axis+"|"+rims.sort().join(",")];
  const art = v ? {name:base+v.suf, rot:v.rot} : {name:base+"_s0", rot:axis==="y"?0:90};
  c.__art = art;          // stamped so the ART can be audited, not just the data
  return art;
}

// Which way should a causeway run HERE?
// Not "perpendicular to the rift" -- a rift wanders, so its global orientation
// is wrong exactly where it turns, and that is where causeways came out facing
// along the chasm. Ask the local question instead: along which axis is solid
// ground closest on BOTH sides? That is the axis to span.
function spanCost(cells,W,H,c,axis){
  const at=(i,j)=>(i<0||i>=W||j<0||j>=H)?null:cells[j*W+i];
  const isRiftish = t => t && (FAM(t.kind)===FAM(c.kind)) &&
                         (t.kind==="pit"||t.kind==="water"||
                          t.kind==="bridge"||t.kind==="water_bridge");
  const step = axis==="x" ? [1,0] : [0,1];
  let total=1;
  for(const dir of [1,-1]){
    let i=c.i+step[0]*dir, j=c.j+step[1]*dir, run=0;
    while(true){
      const t=at(i,j);
      if(isGround(t)) break;                 // landed
      if(!t || !isRiftish(t)) return Infinity;
      if(++run>4) return Infinity;
      total++; i+=step[0]*dir; j+=step[1]*dir;
    }
  }
  return total;
}
function bestSpanAxis(cells,W,H,c){
  const at=(i,j)=>(i<0||i>=W||j<0||j>=H)?null:cells[j*W+i];
  // a candidate axis only counts as a crossing if the rift continues beside it
  const crosses = axis => {
    const perp = axis==="x" ? ["Y+","Y-"] : ["X+","X-"];
    for(const e of perp){
      const nb=NEIGH.find(n=>n.edge===e);
      const t=at(c.i+nb.di, c.j+nb.dj);
      if(t && FAM(t.kind)===FAM(c.kind) && !isGround(t)) return true;
    }
    return false;
  };
  let cx=spanCost(cells,W,H,c,"x"), cy=spanCost(cells,W,H,c,"y");
  if(!crosses("x")) cx=Infinity;
  if(!crosses("y")) cy=Infinity;
  if(cx===Infinity && cy===Infinity) return null;
  return cx<=cy ? "x" : "y";
}

// Guarantee a LEGAL crossing wherever a rift separates two regions.
// Enforcement demotes illegal causeways, which is correct but leaves the map
// cut; the old repair only re-flooded and hoped. This builds a crossing that
// satisfies the edge contract by construction: perpendicular to the rift, a
// straight run, landing on ground at both ends with the blocking walls opened.
function ensureCrossings(cells,W,H){
  const at=(i,j)=>(i<0||i>=W||j<0||j>=H)?null:cells[j*W+i];
  const isDeck = t => t && (t.kind==="bridge"||t.kind==="water_bridge");
  const isRift = t => t && (t.kind==="pit"||t.kind==="water");
  const walkable = t => isGround(t) || isDeck(t);

  const components = () => {
    const comp=new Int32Array(W*H).fill(-1); let n=0;
    for(const c of cells){
      const id=c.j*W+c.i;
      if(comp[id]>=0 || !walkable(c)) continue;
      const st=[c]; comp[id]=n;
      while(st.length){
        const t=st.pop();
        for(const nb of NEIGH){
          const u=at(t.i+nb.di,t.j+nb.dj);
          if(!u||!walkable(u)) continue;
          if(t.walls.has(nb.edge)||u.walls.has(OPP[nb.edge])) continue;
          if((t.level||0)!==(u.level||0) && t.kind!=="stairs" && u.kind!=="stairs") continue;
          const id2=u.j*W+u.i;
          if(comp[id2]<0){ comp[id2]=n; st.push(u); }
        }
      }
      n++;
    }
    return {comp,n};
  };

  let built=0;
  for(let pass=0; pass<8; pass++){
    const {comp,n}=components();
    if(n<=1) break;
    let made=false;
    for(const c of cells){
      if(!isRift(c)) continue;
      const axis = bestSpanAxis(cells,W,H,c);
      if(!axis) continue;
      const step = axis==="x" ? [1,0] : [0,1];
      const run=[c]; const ends=[]; let ok=true;
      for(const dir of [1,-1]){
        let i=c.i, j=c.j, guard=0;
        while(true){
          i+=step[0]*dir; j+=step[1]*dir;
          const t=at(i,j);
          if(!t){ ok=false; break; }
          if(isGround(t)){ ends.push({t, edge: axis==="x" ? (dir>0?"X+":"X-")
                                                          : (dir>0?"Y-":"Y+")}); break; }
          if(!(isRift(t)||isDeck(t)) || FAM(t.kind)!==FAM(c.kind)){ ok=false; break; }
          if(++guard>4){ ok=false; break; }
          run.push(t);
        }
        if(!ok) break;
      }
      if(!ok || ends.length<2) continue;
      const a=comp[ends[0].t.j*W+ends[0].t.i], b=comp[ends[1].t.j*W+ends[1].t.i];
      if(a===b || a<0 || b<0) continue;                 // already joined
      for(const t of run){
        t.kind = FAM(t.kind)==="pit" ? "bridge" : "water_bridge";
        t.spanAxis = axis;
      }
      for(const e of ends){
        if(e.t.walls.has(OPP[e.edge])){ e.t.walls.delete(OPP[e.edge]); resync(e.t); }
      }
      built++; made=true; break;
    }
    if(!made) break;
  }
  return built;
}

// A chasm tile only draws a rim where it meets solid ground. Without this, two
// adjacent pit tiles each drew their own rim on the shared edge -- two walls
// back to back through the middle of the rift -- so a continuous chasm rendered
// as a row of separate square holes.
const RIM_SHAPES={ "":[], "_e":["Y+"], "_c":["Y+","X+"], "_o":["Y+","Y-"],
                   "_d":["Y+","X+","X-"], "_x":["Y+","X+","Y-","X-"] };
const RIM_BY_KEY={};
for(const [suf,edges] of Object.entries(RIM_SHAPES))
  for(const rot of [0,90,180,270]){
    const st=(rot/90)%4;
    const key=edges.map(e=>ORDER[(ORDER.indexOf(e)+st)%4]).sort().join(",");
    if(!(key in RIM_BY_KEY)) RIM_BY_KEY[key]={suf,rot};
  }
function rimArt(cells,W,H,c,base){
  const solid=[];
  for(const nb of NEIGH){
    const ni=c.i+nb.di, nj=c.j+nb.dj;
    const t=(ni<0||ni>=W||nj<0||nj>=H)?null:cells[nj*W+ni];
    // pit+bridge are one family, water+water_bridge another: a causeway must not
    // wall itself off from the chasm it spans
    const fam = k => k==="bridge" ? "pit" : k==="water_bridge" ? "water" : k;
    const sameKind = t && fam(t.kind)===fam(c.kind);
    if(!sameKind) solid.push(nb.edge);        // rim only against non-rift
  }
  const v=RIM_BY_KEY[solid.sort().join(",")] || {suf:"_x",rot:0};
  return {name:base+v.suf, rot:v.rot};
}

// ---------------------------------------------------------------------------
// LAYOUT: rooms and doors, not WFC.
//
// WFC was the wrong tool for this job and the maps showed it. Its constraints
// are per-edge and one tile wide, so it can only guarantee LOCAL agreement --
// it has no way to express "this room is 4x3" or "this chasm crosses the map".
// What it produced was a field of wall stubs: dead ends, pockets, and chasms
// one tile long. Global structure has to be authored globally.
//
// So: BSP-partition the whole grid into rectangular rooms that TILE the map
// (no leftover rock, so every tile is reachable floor), put walls only on room
// perimeters, and cut a doorway between every pair of adjacent rooms. Minimum
// room dimension is 2 so no tile ever needs 3 walls -- which also means no tile
// is ever a cul-de-sac.
// ---------------------------------------------------------------------------
function genLayout(W,H){
  const cells=[];
  for(let j=0;j<H;j++) for(let i=0;i<W;i++)
    cells.push({i,j,walls:new Set(),level:0,kind:"",upper:null,name:"floor",rot:0});
  const at=(i,j)=>cells[j*W+i];

  const rooms=[];
  (function split(x,y,w,h,d){
    const canV = w>=5, canH = h>=5;
    if(d>=3 || (!canV&&!canH) || (d>=2 && rnd()<0.35)){ rooms.push({x,y,w,h}); return; }
    const vertical = canV && (!canH || rnd()<0.5);
    if(vertical){ const cut=2+((rnd()*(w-3))|0);
      split(x,y,cut,h,d+1); split(x+cut,y,w-cut,h,d+1); }
    else { const cut=2+((rnd()*(h-3))|0);
      split(x,y,w,cut,d+1); split(x,y+cut,w,h-cut,d+1); }
  })(0,0,W,H,0);

  // walls on every room perimeter (j increases toward -Y, so j=y is the Y+ edge)
  for(const r of rooms){
    r.id = rooms.indexOf(r);
    for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++){
      const c=at(i,j); c.room=r.id;
      if(i===r.x)         c.walls.add("X-");
      if(i===r.x+r.w-1)   c.walls.add("X+");
      if(j===r.y)         c.walls.add("Y+");
      if(j===r.y+r.h-1)   c.walls.add("Y-");
    }
  }

  // one doorway per adjacent room pair -- loops are fine, they kill dead ends
  const pairs=new Map();
  for(const c of cells) for(const nb of NEIGH){
    const ni=c.i+nb.di, nj=c.j+nb.dj;
    if(ni<0||ni>=W||nj<0||nj>=H) continue;
    const t=at(ni,nj);
    if(t.room===c.room) continue;
    const key = Math.min(c.room,t.room)+":"+Math.max(c.room,t.room);
    if(!pairs.has(key)) pairs.set(key,[]);
    pairs.get(key).push([c,t,nb.edge]);
  }
  let doors=0;
  for(const list of pairs.values()){
    const n = 1 + (list.length>=6 ? 1 : 0);          // wide walls get two openings
    for(let k=0;k<n;k++){
      const [a,b,edge]=list[(rnd()*list.length)|0];
      a.walls.delete(edge); b.walls.delete(OPP[edge]); doors++;
      // Dress the opening as masonry: an arch, or a door that can be shut. This
      // used to require `a.walls.size===0`, because the only opening art was a
      // lone arch with nothing either side -- so a doorway in a room CORNER, or
      // in a one-tile-wide room (both walls survive), had to stay a bare gap,
      // which is most of the doorways a room carver produces. The flanking
      // variants (arch_l/_r/_wall/_end/_nook_*) cover every wall set that can
      // survive here, so the only remaining condition is that this tile is not
      // already something else. See openingArt() for the wall-set -> art map.
      if(!a.kind && rnd()<0.7){
        a.kind = rnd()<0.45 ? "door" : "arch";
        a.doorEdge = edge;
        a.open = a.kind==="arch";
      }
    }
  }
  for(const c of cells) resync(c);
  return {cells, rooms, doors};
}

// A rift that crosses the ENTIRE map, with a wander so it is not a ruled line.
// This is the thing WFC could not do: it is a global feature by construction.
function addRift(cells,W,H,kind,width){
  const horiz = rnd()<0.5;
  const span = horiz ? W : H;
  const cross = horiz ? H : W;
  let t = 2 + ((rnd()*(cross-4))|0);
  const touched=[];
  for(let u=0;u<span;u++){
    if(rnd()<0.30){
      // carve the corner tile too, or the step is diagonal and the rift breaks
      // into squares that only touch at a point
      const prev=t;
      t = Math.max(1, Math.min(cross-2, t + (rnd()<0.5?-1:1)));
      if(t!==prev){
        const c0 = horiz ? cells[prev*W+u] : cells[u*W+prev];
        if(c0){ c0.kind=kind; c0.walls=new Set(); c0.riftHoriz=horiz; touched.push(c0); }
      }
    }
    t = Math.max(1, Math.min(cross-2, t));
    for(let k=0;k<width;k++){
      const tt=Math.min(cross-2, t+k);
      const c = horiz ? cells[tt*W+u] : cells[u*W+tt];
      if(!c) continue;
      c.kind=kind; c.walls=new Set(); c.riftHoriz=horiz; touched.push(c);
    }
  }
  // Crossings: without them the rift cuts the dungeon in half. Convert a whole
  // COLUMN of the rift at one position, so the causeway actually spans it.
  const crossings = 1 + ((rnd()*2)|0);
  const used=new Set();
  for(let k=0;k<crossings;k++){
    let u, guard=0;
    do { u = 1 + ((rnd()*(span-2))|0); } while(used.has(u) && guard++<20);
    used.add(u);
    for(const c of touched){
      if((horiz ? c.i : c.j) !== u) continue;
      c.kind = kind==="pit" ? "bridge" : "water_bridge";
      c.spanAxis = horiz ? "y" : "x";
    }
  }
  return touched.length;
}

// Openings are dressed while the rooms are carved, but the rift is gouged
// AFTERWARDS and can turn the square beyond a doorway into a chasm -- and a
// doorway on the outer wall has nothing beyond it at all. Either way the frame
// has no floor behind it and you see the void straight through the jamb, which
// reads as a black diamond at the foot of the wall. A causeway still counts as
// somewhere to go; open water and open chasm do not. Strip the dressing back to
// plain masonry rather than trying to patch the art -- a doorway that leads
// nowhere is a map bug, not a rendering one.
function undressStrandedOpenings(cells,W,H){
  const at=(i,j)=>(i<0||i>=W||j<0||j>=H)?null:cells[j*W+i];
  let n=0;
  for(const c of cells){
    if(c.kind!=="arch" && c.kind!=="door") continue;
    const dir=NEIGH.find(d=>d.edge===c.doorEdge);
    if(!dir) continue;
    const t=at(c.i+dir.di, c.j+dir.dj);
    if(!t || t.kind==="pit" || t.kind==="water"){
      delete c.kind; delete c.doorEdge; delete c.open; n++;
    }
  }
  return n;
}

// ---- Wave Function Collapse ----------------------------------------------
// Contradictions are normal in WFC; a failed attempt costs almost nothing, so
// retry generously rather than surfacing a dead map to the user.
function wfc(W,H,tries=400){
  for(let attempt=0;attempt<tries;attempt++){
    const full=(1<<NV)-1, dom=new Array(W*H).fill(full);
    const idx=(i,j)=>j*W+i;
    for(let i=0;i<W;i++) for(let j=0;j<H;j++){
      let m=dom[idx(i,j)];
      for(const nb of NEIGH){
        const ni=i+nb.di, nj=j+nb.dj;
        if(ni>=0&&ni<W&&nj>=0&&nj<H) continue;
        for(let v=0;v<NV;v++) if(!VARIANTS[v].walls.has(nb.edge)) m&=~(1<<v);
      }
      dom[idx(i,j)]=m;
    }
    const pc=m=>{let c=0;while(m){m&=m-1;c++;}return c;};
    const propagate=stack=>{
      while(stack.length){
        const [i,j]=stack.pop();
        for(const nb of NEIGH){
          const ni=i+nb.di, nj=j+nb.dj;
          if(ni<0||ni>=W||nj<0||nj>=H) continue;
          let solid=false, open=false;
          for(let v=0;v<NV;v++) if(dom[idx(i,j)]&(1<<v))
            (VARIANTS[v].walls.has(nb.edge)?solid=true:open=true);
          let m=dom[idx(ni,nj)]; const before=m;
          for(let v=0;v<NV;v++) if(m&(1<<v)){
            const s=VARIANTS[v].walls.has(OPP[nb.edge]);
            if((s&&!solid)||(!s&&!open)) m&=~(1<<v);
          }
          if(m!==before){ if(!m) return false; dom[idx(ni,nj)]=m; stack.push([ni,nj]); }
        }
      }
      return true;
    };
    if(!propagate(Array.from({length:W*H},(_,n)=>[n%W,(n/W)|0]))) continue;
    let ok=true;
    while(true){
      let best=-1,bestC=1e9;
      for(let n=0;n<W*H;n++){ const c=pc(dom[n]); if(c>1&&c<bestC){bestC=c;best=n;} }
      if(best<0) break;
      const opts=[]; for(let v=0;v<NV;v++) if(dom[best]&(1<<v)) opts.push(v);
      let tot=0; for(const v of opts) tot+=VARIANTS[v].w;
      let r=rnd()*tot, pick=opts[0];
      for(const v of opts){ r-=VARIANTS[v].w; if(r<=0){pick=v;break;} }
      dom[best]=1<<pick;
      if(!propagate([[best%W,(best/W)|0]])){ ok=false; break; }
    }
    if(!ok) continue;
    const cells=[];
    for(let j=0;j<H;j++) for(let i=0;i<W;i++){
      const m=dom[idx(i,j)]; let v=0;
      for(let k=0;k<NV;k++) if(m&(1<<k)){v=k;break;}
      // clone `walls`: spreading shares the Set with the global VARIANTS entry,
      // and connectRegions() deletes from it -- which silently destroyed the
      // tile catalogue after a few regenerations.
      cells.push({...VARIANTS[v], i, j, walls:new Set(VARIANTS[v].walls)});
    }
    return cells;
  }
  return null;
}

// WFC happily seals off regions -- a valid tiling is not a connected dungeon.
// Knock down interior walls until every tile is reachable. Removing edge E from
// A and OPP(E) from B keeps the socket contract (both sides become open), and
// every wall-subset except "all four" exists as a variant, so the replacement
// tile always exists.
const BY_KEY = {};
for (const v of VARIANTS) BY_KEY[v.key] = v;

// Give every tile at least two exits. WFC can still produce a cul-de-sac even at
// a low weight, and the measured rate was 9-12 per 81-tile map.
function openDegree(cells,W,H,c){
  let open=0;
  for(const nb of NEIGH){
    const ni=c.i+nb.di, nj=c.j+nb.dj;
    if(ni<0||ni>=W||nj<0||nj>=H) continue;
    const t=cells[nj*W+ni];
    if(!c.walls.has(nb.edge) && !t.walls.has(OPP[nb.edge])) open++;
  }
  return open;
}

// A stair only needs the walls ALONG its axis removed -- the two it climbs
// between. Wiping the whole set deleted the room wall the stair was cut into,
// which is why sections of wall went missing with torches left on nothing.
function openForStair(t, dir){
  t.walls = new Set([...t.walls].filter(e => e!==dir && e!==OPP[dir]));
}

function resync(t){
  // A SOCKET TILE HAS NO WALLS, and this function derives art FROM walls -- so
  // for one of those it looked up the empty wall set, found the dungeon's plain
  // floor, and renamed the tile to it. Every grass tile in the map turned into
  // `floor` the first time the view was rotated, and the whole map went blank.
  // Its art is already chosen; rotating the world just turns it.
  if(t.socket) return;
  // Only wall-derived art. A tile with a kind (pit/water/stairs/...) chooses its
  // art from the kind, so rewriting its name here churns a field nobody reads --
  // and made rotation look non-idempotent when auditing it.
  if(t.kind) return;
  const v=BY_KEY[[...t.walls].sort().join(",")];
  if(v){ t.name=v.name; t.rot=v.rot; t.key=v.key; }
}
function removeDeadEnds(cells,W,H){
  let opened=0;
  for(let pass=0; pass<4; pass++){
    let changed=false;
    for(const c of cells){
      if(openDegree(cells,W,H,c)>=2) continue;
      // knock out the wall that opens onto the neighbour with the most exits
      let best=null, bestDeg=-1;
      for(const nb of NEIGH){
        const ni=c.i+nb.di, nj=c.j+nb.dj;
        if(ni<0||ni>=W||nj<0||nj>=H) continue;
        const t=cells[nj*W+ni];
        if(!c.walls.has(nb.edge) && !t.walls.has(OPP[nb.edge])) continue;
        const d=openDegree(cells,W,H,t);
        if(d>bestDeg){ bestDeg=d; best={nb,t}; }
      }
      if(!best) continue;
      c.walls.delete(best.nb.edge); best.t.walls.delete(OPP[best.nb.edge]);
      resync(c); resync(best.t);
      opened++; changed=true;
    }
    if(!changed) break;
  }
  return opened;
}

function connectRegions(cells, W, H){
  const at=(i,j)=>cells[j*W+i];
  const comp=new Int32Array(W*H).fill(-1);
  let nc=0;
  for(let s=0;s<W*H;s++){
    if(comp[s]>=0) continue;
    const st=[s]; comp[s]=nc;
    while(st.length){
      const n=st.pop(), c=cells[n];
      for(const nb of NEIGH){
        const ni=c.i+nb.di, nj=c.j+nb.dj;
        if(ni<0||ni>=W||nj<0||nj>=H) continue;
        if(c.walls.has(nb.edge)||at(ni,nj).walls.has(OPP[nb.edge])) continue;
        const m=nj*W+ni;
        if(comp[m]<0){ comp[m]=nc; st.push(m); }
      }
    }
    nc++;
  }
  let removed=0, guard=0;
  while(nc>1 && guard++<500){
    let done=false;
    for(let n=0;n<W*H && !done;n++){
      const c=cells[n];
      for(const nb of NEIGH){
        const ni=c.i+nb.di, nj=c.j+nb.dj;
        if(ni<0||ni>=W||nj<0||nj>=H) continue;      // never breach the outer wall
        const m=nj*W+ni;
        if(comp[m]===comp[n]) continue;
        const a=cells[n], b=cells[m];
        a.walls.delete(nb.edge); b.walls.delete(OPP[nb.edge]);
        for(const t of [a,b]){
          const v=BY_KEY[[...t.walls].sort().join(",")];
          t.name=v.name; t.rot=v.rot; t.key=v.key;
        }
        const from=comp[m], to=comp[n];
        for(let k=0;k<W*H;k++) if(comp[k]===from) comp[k]=to;
        removed++; nc--; done=true; break;
      }
    }
    if(!done) break;
  }
  return removed;
}

// "#8899cc" -> [0.53, 0.60, 0.80]. The pickers hand back hex; the shader wants
// linear-ish floats, and doing it per frame is cheaper than watching for change
// events on six controls.
const hex3=h=>[parseInt(h.substr(1,2),16)/255,
               parseInt(h.substr(3,2),16)/255,
               parseInt(h.substr(5,2),16)/255];
// A LIGHT'S COLOUR IS ITS HUE, NOT ITS BRIGHTNESS -- the slider next to it owns
// that. Feeding the picker's value in raw multiplies the two together, so
// choosing a believable sky (#8899cc, none of whose channels is above 0.8)
// silently drops the fill to 60% and the whole map goes contrasty and yellow.
// Scaling by the brightest channel keeps the tint and leaves the intensity where
// the person put it.
const tint=h=>{ const c=hex3(h), m=Math.max(c[0],c[1],c[2])||1;
                return [c[0]/m, c[1]/m, c[2]/m]; };
// DECODE OFF THE MAIN THREAD. new Image() decodes on it, and the browser
// serialises those decodes, so 552 packed tile images -- 27MB, already cropped
// and webp -- took 21.9 seconds to become usable while the page sat black. It
// was never the bytes: it was one core decoding them one at a time.
// createImageBitmap hands the work to the browser's decode pool, which does it
// in parallel and off-thread, and returns something both drawImage() and
// texImage2D() take directly.
const load = src => fetch(src).then(r => {
  if(!r.ok) throw new Error("failed: "+src);
  return r.blob();
}).then(b => createImageBitmap(b)).catch(e => {
  // Older browsers, and any decode createImageBitmap refuses: fall back to the
  // element rather than failing the load, since one missing image aborts the
  // whole set.
  if(typeof createImageBitmap !== "function" || /decode|blob/i.test(e.message||""))
    return new Promise((ok,no)=>{const im=new Image();
      im.onload=()=>ok(im); im.onerror=()=>no(new Error("failed: "+src)); im.src=src;});
  throw e;
});

// ---- actors and effects: the asset half -----------------------------------
// build_actors.py bakes BODY x ACTION x 8 DIRECTIONS x frames, three buffers
// each: 960 images, 45 MB. Fetching all of it before the map appears is ten
// seconds of black screen for art that the first turn will not use, so an ACTION
// is the unit of loading and it is memoised -- walk for every body before the
// map draws, everything else in the background behind it. An actor asked to play
// an action it does not have yet keeps walking and starts the moment it lands,
// which is the only failure mode here that does not show as a missing frame.
let ACTMAN=null, FXMAN=null, loadQueue=null;

const FXIMG={};                   // FXIMG[name][frame]     = {a,n,h}
const actLoading={};
const triple=base=>Promise.all([load(base+".png"),load(base+"_NRM.png"),load(base+"_H.png")])
  .then(([a,n,h])=>({a,n,h}));
function loadAction(body,action){
  const key=body+"/"+action;

  const n=ACTMAN.actions[action];
  return actLoading[key]=Promise.all(DIRS.map(d=>
      Promise.all(Array.from({length:n},(_,f)=>
        triple("out/actors/"+body+"_"+action+"_"+d+"_f"+f))).then(fr=>[d,fr])))
    .then(pairs=>{ (ACT[body]=ACT[body]||{})[action]=Object.fromEntries(pairs); });

// WHICH BODIES ARE ACTUALLY HERE. The hero always, plus whatever is standing on
// the map; `actors` is populated by the time this is first called, and reading it
// rather than the manifest is the whole point -- the manifest lists everything
// that was ever baked.
function sceneBodies(){
  const set=new Set([HERO_BODY]);
  try{ for(const a of actors) if(a && a.body) set.add(a.body); }catch(e){}

// Everything one body can do. Memoised by loadAction, so calling it twice is
// free and calling it early is harmless.
async function ensureBody(body){

// Effects are radial -- one render, no directions -- so a whole effect is about
// as much art as one direction of one action, and they all load up front.
const loadEffect=name=>Promise.all(
    Array.from({length:FXMAN.effects[name]},(_,f)=>triple("out/effects/"+name+"_f"+f)))

const STEP=1.8, PITZ=3.4;   // MUST match build_tiles.py STEP/PIT
// A tile is (wall-set, level, kind). kind: ""|"stairs"|"pit"|"bridge".
// Level 1 tiles are the same wall-set at a raised base; stairs join 0 and 1.
function tileArt(t){
  // A socket tile names its own art: the manifest picked the piece and the
  // rotation, so there is nothing left to resolve.
  if(t.socket) return {name:t.name, rot:t.rot};
  if(t.kind==="pit")    return rimArt(RIFT_CELLS,RIFT_W,RIFT_H,t,"pit");
  if(t.kind==="water")  return rimArt(RIFT_CELLS,RIFT_W,RIFT_H,t,"water");
  if(t.kind==="water_bridge") return bridgeArt(RIFT_CELLS,RIFT_W,RIFT_H,t,"water_bridge");
  if(t.kind==="bridge") return bridgeArt(RIFT_CELLS,RIFT_W,RIFT_H,t,"bridge");
  if(t.kind==="stairs")
    return {name:t.walls.size?"stairs_wall":"stairs", rot:ROT_FOR_EDGE[t.dir]};
  if(t.kind==="over_stairs")
    return {name:t.walls.size?"over_stairs_wall":"over_stairs", rot:ROT_FOR_EDGE[t.dir]};

// which rotation sends a Y+ feature to each edge
const ROT_FOR_EDGE={};
for(const r of [0,90,180,270]) ROT_FOR_EDGE[ORDER[((ORDER.indexOf("Y+")+(r/90))%4)]]=r;

// An opening plus whatever wall survived on the same tile.
//
// The models are authored with the opening on Y+ and the flanking walls named
// from THAT frame: `_l` is X+, `_r` is X-, `_end` is the far edge Y-. Rotation
// carries the opening and its walls together, so to pick art we ask the inverse
// question -- with the opening rotated onto this tile's doorEdge, which edge is
// the model's X+ now? -- and read the tile's real wall set through that map.
//
// Both chiralities are separate models on purpose: mirroring the render would
// mirror the masonry bond and the lighting with it.
const OPENING_SUFFIX={ "":"", "opp":"_end", "l":"_l", "r":"_r",
                       "l,r":"_wall", "l,opp":"_nook_l", "opp,r":"_nook_r" };
function openingArt(t){
  const rot=ROT_FOR_EDGE[t.doorEdge], s=rot/90;
  const at=e=>ORDER[(ORDER.indexOf(e)+s)%4];       // model frame -> world edge
  const role={ [at("X+")]:"l", [at("X-")]:"r", [at("Y-")]:"opp" };
  const key=[...t.walls].map(e=>role[e]).filter(Boolean).sort().join(",");
  // A closed door shows its leaf; an open one is just the arch it was cut into.
  const base=(t.kind==="door" && !t.open) ? "door" : "arch";
  const suffix=OPENING_SUFFIX[key];
  // Three surviving walls has no model and no way to occur (a cell carries at
  // most three walls, and the doorway consumed one of them) -- but if the carver
  // ever changes, a bare opening is a better failure than a missing image.
  return {name:base+(suffix||""), rot};
}

  const MAP_N = Math.max(5, Math.min(16,

  const gl=glc.getContext("webgl2",{alpha:false}) ||

  const GL2 = !!(gl && gl.TEXTURE_BINDING_3D);          // a webgl2-only enum

  let gDead = "";

    // and nothing about him is special-cased below.
    //   uSpRect  x,y,w,h on the composite, in canvas px

    //               right now -- the tail of a blast is smoke, and smoke added
    //               at full strength is a pale slab lying over the map

    // at every pixel, which is the entire point -- a baked plane records itself

    // function of depth and "water clarity" could only ever be a flat blend.
    //

    // genuinely deep (Beer's law below), a shoreline that is where the depth
    // crosses zero rather than where a neighbouring pixel happens to differ, and
    // a level you can MOVE -- drop it and the river is a dry gully, raise it and

    uniform float uWaterZ;

    // at -3.4 would fill with river. Every water bed in every set is cut to -0.95,

    const vec2 WD0=vec2( 0.9391, 0.3437), WD1=vec2(-0.4161, 0.9093), WD2=vec2( 0.7071,-0.7071);

    vec3 waterNormal(vec2 wp, float t, float amp){

             + WD1*(WAMP.y*WFRQ.y*cos(dot(wp,WD1)*WFRQ.y - t*WSPD.y))

    float xMinusY(vec2 P, float h){

      return uCam - (COS30*COS45*xMinusY(P,h) + SIN30*h);

    vec2 worldAt(vec2 P, float h){
      float sum=(P.x-uOrigin.x)/(COS45*uPPU);

    // Cast shadows by marching the HEIGHT FIELD toward the light. At each step the
    // ray has a known world position and height; project it back to a pixel and
    // read the surface height there. If the surface is above the ray, something

    // carries a height -- the same buffer that gives us the depth test.
    float occluded(vec2 wp, float h, vec3 L, float distToLight){

      // cheap -- 28 samples over three units becomes six -- but that IS the
      // sampling rate, so a torch-lit room changes: 5522 pixels of the dungeon
      // set moved, all of them shadow, while the outdoor set did not move at all
      // because the sun's ray is long enough that its step was already 0.5. It is
      // a quality trade dressed as a free win, and the honest saving next door
      // (one texture fetch instead of two) was four times the size and cost
      // nothing. If it is ever wanted, it belongs behind the shadow slider as a
      // quality setting, not hidden in the constant.
      //
      // 3614 pixels, measured against a control that was actually empty. The
      // first time this was judged, three goblins were walking through the
      // "empty" frame -- see PARAMS at the top -- and the number was 5522 with
      // most of it being them. Same verdict, but the first run of it proved
      // nothing.
      float dt=maxT/float(N);
