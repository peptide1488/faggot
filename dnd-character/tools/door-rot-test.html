<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Door rotation test</title>
<style>html,body{margin:0;height:100%;background:#223;overflow:hidden}#mount{position:fixed;inset:0;width:100vw;height:100vh}</style>
</head>
<body>
<div id="mount"></div>
<script type="module">
  import './../iso3d/boot.js?v=test';

  function boot() {
    const I = window.Iso3D;
    if (!I || !I.ready) { setTimeout(boot, 50); return; }
    const mount = document.getElementById('mount');
    const host = new I.Host(mount, { assetBase: '../' });

    // 7x7 room: wall ring around the edge, one door in the TOP wall (east-west run,
    // wallAxis 0) at (3,0), one door in the LEFT wall (north-south run, wallAxis 1) at (0,3).
    const cols = 7, rows = 7;
    const tiles = {};
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const edge = x === 0 || x === cols - 1 || y === 0 || y === rows - 1;
      tiles[x + ',' + y] = edge ? 'wall' : 'grass';
    }
    tiles['3,0'] = 'wall'; // stays wall terrain-wise; door is a decor overlay
    tiles['0,3'] = 'wall';
    const decor = { '3,0': 'door', '0,3': 'door' };
    const map = { cols, rows, tiles, height: {}, decor };
    const session = { map, players: [], monsters: [] };

    window.__host = host;
    host.setSession(session, { frameOn: { col: 0, row: 3, zoom: 3.2 } });
    console.log('canvas size', host.glCanvas.width, host.glCanvas.height, host.glCanvas.clientWidth, host.glCanvas.clientHeight);
    console.log('view units', host._view && host._view.units && host._view.units.length, 'decorSprites', JSON.stringify(host._view && host._view.decorSprites));
    console.log('cam', JSON.stringify(host.renderer.getCamera()));
    window.__ready = true;
  }
  boot();
</script>
</body>
</html>
