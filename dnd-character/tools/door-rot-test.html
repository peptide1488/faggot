<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wang autotile test</title>
<style>html,body{margin:0;height:100%;background:#223;overflow:hidden}#mount{position:fixed;inset:0;width:100vw;height:100vh}</style>
</head>
<body>
<div id="mount"></div>
<script type="module">
  import './../iso3d/boot.js?v=test';

  function boot() {
    const I = window.Iso3D;
    if (!I || !I.ready) { setTimeout(boot, 50); return; }
    const mount = document.getElementById('mount');
    const host = new I.Host(mount, { assetBase: '../' });

    // 8x8 stone room with a brick perimeter wall and one door in the south wall —
    // tests real UV-mapped wall side faces (brick.png) + the door-as-3D-quad geometry.
    const cols = 8, rows = 8;
    const tiles = {};
    const height = {};
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const edge = x === 0 || y === 0 || x === cols - 1 || y === rows - 1;
        tiles[x + ',' + y] = edge ? 'wall' : 'stone';
      }
    }
    // Door gap in the south wall (row = rows-1), floor tile so it's walkable.
    tiles['4,' + (rows - 1)] = 'stone';
    const decor = { ['4,' + (rows - 1)]: 'door' };
    const map = { cols, rows, tiles, height, decor };
    const session = { map, players: [], monsters: [] };

    window.__host = host;
    host.setSession(session, { resetCamera: true });
    setTimeout(() => {
      const s = host.renderer.sampler;
      console.log('sampler ready', s.ready, 'has door tex', !!(s.images && s.images['sprites/decor/door.png']));
      console.log('ground mesh groups', (host.renderer._groundMeshes || []).map(g => ({ url: g.url, count: g.count })));
    }, 1200);
    window.__ready = true;
  }
  boot();
</script>
</body>
</html>
